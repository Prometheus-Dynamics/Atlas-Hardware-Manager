# EXAMPLE, for scripts/check-devices.sh only. Not a device.
# A Rust component in the form Gaia aa987cc reads (hello-rust in Gaia's examples): one cargo
# package, its source a path in this directory, its build image pinned by the lock, the target
# and crates taken from the board and Cargo.lock.
version = 1
name = "hello-rust"
description = "Example Rust component (fixture)"

[sources.src]
path = "src"

# The Rust release the build uses (Gaia 08e71181): rustc, cargo and each target's std, the official files pinned by the
# lock. The build machine's rustup is never read. Every board here is aarch64 (static musl).
[sources.toolchain]
rust = "1.99.0"
targets = ["aarch64-unknown-linux-musl"]

[sources.root]
image = "docker.io/library/debian:trixie-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "hello-rust"

[[install]]
from = "bin/hello-rust"
to = "/usr/bin/hello-rust"
mode = "0755"
