# EXAMPLE in Gaia F8 form, as Gaia 10beed8 reads it (fixture). Not a device.
version = 1
extends = "../../families/example-family/family.toml"
name = "example-board"
description = "Example board (F8 fixture)"

[target]
cpu = "cortex-a55"

[sources.rkbin]
path = "rkbin"

# Gaia 1c2b9dc9 wants every board with a U-Boot to name its own defconfig (crates/core/graph/src/os.rs:382: it carries
# the board's pin and voltage setup, so a family gives none).
[bootloader]
defconfig = "example-board"

[bootloader.blobs]
ROCKCHIP_TPL = { source = "rkbin", path = "bin/example.bin" }
