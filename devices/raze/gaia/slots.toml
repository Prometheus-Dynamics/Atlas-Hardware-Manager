# Raze dynamic slots (for any OS on a Raze): import this and initramfs.toml
# after the Raze layers. The layer is the BCM2712 family's; Raze names its
# config.txt fragment.
config = 3
imports = ["../../families/rpi-bcm2712/gaia/slots.toml"]

[inputs.board_device_config]
description = "The board's config.txt fragment"
kind = "string"
default = "raze-device.txt"
