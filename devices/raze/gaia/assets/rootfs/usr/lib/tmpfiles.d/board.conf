# Runtime state for the board scripts. requests/ is where the
# unprivileged identity endpoint drops action requests: anyone may create a
# file there, nobody but root may list or read it.
d /run/board 0755 root root -
d /run/board/requests 1733 root root -
# The bench lock reboot-locked waits for, under its name and its old one
# (raze-gpu.lock, an alias while bench scripts move over): one file.
f /run/lock/board-gpu.lock 0644 root root -
L /run/lock/raze-gpu.lock - - - - /run/lock/board-gpu.lock
