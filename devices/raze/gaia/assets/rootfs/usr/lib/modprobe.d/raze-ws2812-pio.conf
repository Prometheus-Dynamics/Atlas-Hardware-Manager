# Raze LED ring: load the RP1 PIO driver before the WS2812 PIO driver.
softdep ws2812_pio_rp1 pre: rp1_pio
# Keep the frame the ring was showing when the driver loads (the package's
# kernel patch, linux/patches): across a restart that is lemnosd's reboot
# ember, held until lemnosd starts and takes over. A cold start is dark
# anyway (the LEDs power up off).
options ws2812_pio_rp1 clear_on_probe=0
