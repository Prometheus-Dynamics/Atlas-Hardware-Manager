# Device package defaults for NetworkManager. Override in
# /etc/NetworkManager/conf.d/.

# The USB gadget link (u_ether reports driver g_ether) and its bridge are
# configured by board-usb-gadget.service.
[keyfile]
unmanaged-devices+=driver:g_ether,interface-name:usbbr0

# mDNS is resolved's on every link (60-board-mdns.conf): NetworkManager asks
# it for mDNS on its connections. 2 = yes (avahi.toml sets 0).
[connection]
connection.mdns=2
