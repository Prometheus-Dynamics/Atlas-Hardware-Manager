# mDNS on a Raze is avahi's (avahi-daemon): WPILib's NetworkTables finds the
# robot controller through avahi-client over D-Bus, and PhotonVision
# announces through it too. resolved keeps unicast DNS and stays off 5353, so
# the two don't answer for the same names. Override in
# /etc/systemd/resolved.conf.d/.
[Resolve]
MulticastDNS=no
LLMNR=no
