# mDNS on a Raze is systemd-resolved's: it answers for <hostname>.local and
# the identity's _pd-device._tcp (/run/systemd/dnssd/pd-device.dnssd, written
# by board-identity.service) on every link with an address; the USB bridge's
# members have none, so usbbr0 answers for them. No LLMNR. An OS whose
# programs need libavahi-client imports avahi.toml, which turns this off.
# Override in /etc/systemd/resolved.conf.d/.
[Resolve]
MulticastDNS=yes
LLMNR=no
