# mDNS responder for the _pd-device._tcp advertisement. mDNS must also be on
# for each link: the USB gadget link turns it on itself; Ethernet needs
# MulticastDNS=yes in its .network file (networkd) or connection.mdns=2
# (NetworkManager, see /usr/lib/NetworkManager/conf.d/60-pd-device.conf).
# Override in /etc/systemd/resolved.conf.d/.
[Resolve]
MulticastDNS=yes
