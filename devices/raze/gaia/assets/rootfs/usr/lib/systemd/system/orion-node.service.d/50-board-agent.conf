# Device package: let board-agent (root) and lemnos-orion (user lemnos, the
# Lemnos bridge) use orion-node's local IPC.
# ORION_NODE_LOCAL_AUTH_ALLOW is an allow-list added on top of the node's
# local auth mode (ignored when auth is disabled); admitting root gives root
# nothing it can't already do on the board.
#
# systemd can't compose this with another value: an OS that sets its own
# ORION_NODE_LOCAL_AUTH_ALLOW (a later drop-in, or an EnvironmentFile read
# after this) replaces it and MUST include root, e.g.
# ORION_NODE_LOCAL_AUTH_ALLOW=root,user:lemnos,photonvision. Without root,
# board-agent can't claim its actions; without user:lemnos the board's
# devices don't show in Orion. Both log the refusal.
[Service]
Environment=ORION_NODE_LOCAL_AUTH_ALLOW=root,user:lemnos
