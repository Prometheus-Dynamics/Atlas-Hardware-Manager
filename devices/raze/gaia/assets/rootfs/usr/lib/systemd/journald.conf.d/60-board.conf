# Device package: keep the journal across boots, bounded, so a failed trial
# boot or a hang at shutdown leaves its logs. The OS keeps /var/log/journal
# on /data (the root is read-only); without it, the journal stays in /run.
# A stable machine id (board-machine-id.service) keeps it in one directory.
# Small caps: a few boots fit in 16M, and 4M files keep each mapping and
# rotation small. journald's RAM is its binary and heap (about 2.5 MB PSS on
# a Raze either way); the caps bound /data and the page cache, not that.
[Journal]
Storage=persistent
SystemMaxUse=16M
SystemMaxFileSize=4M
SystemKeepFree=256M
RuntimeMaxUse=4M
RuntimeMaxFileSize=1M
