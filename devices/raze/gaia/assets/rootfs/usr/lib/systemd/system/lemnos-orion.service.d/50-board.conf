# Device package: let lemnos-orion (user `lemnos`) reach orion-node's local
# IPC. orion-node's packaged unit keeps /run/orion at 0750, group `orion`,
# so the bridge joins that group here; orion-node then admits it through
# 50-board-agent.conf (ORION_NODE_LOCAL_AUTH_ALLOW=root,user:lemnos).
#
# The bridge registers its provider on ORION_NODE_ID, which must be
# orion-node's: both read /run/board/orion.env (board-orion-env.service), read
# here after /etc/default/lemnos-orion.env so the two can't disagree.
[Unit]
After=board-orion-env.service
# Only with an Orion node: without the `orion` group the unit couldn't start.
ConditionPathIsDirectory=/run/orion

[Service]
SupplementaryGroups=orion
EnvironmentFile=-/run/board/orion.env
