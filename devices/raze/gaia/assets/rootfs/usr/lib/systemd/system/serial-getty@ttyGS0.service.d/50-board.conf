# Recovery console on the USB gadget's serial port (ACM): logs in as root
# without a password. Anyone who can reach this port can already reflash the
# board over the same cable, so it adds no access, and it works when the
# network, SSH, and any management agent don't. An OS turns it off with
# `systemctl mask serial-getty@ttyGS0.service serial-getty@ttyGS1.service`.
[Service]
# No terminal reset, vhangup or deallocation by systemd on start and stop:
# PID 1 writes reset and size-probe sequences to the tty then, and on a gadget
# port the computer doesn't read (no program holds /dev/ttyACM*), those writes
# block once unread output fills the port. A blocked PID 1 stops feeding the
# hardware watchdog, which resets the board mid-shutdown (0x20, nothing
# logged; a tryboot flag lost with it). Found on the bench board 2026-10-19:
# every shutdown after ~50 s of uptime hung where these two gettys stopped.
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --autologin root --noreset --noclear --keep-baud 115200,57600,38400,9600 - ${TERM}
