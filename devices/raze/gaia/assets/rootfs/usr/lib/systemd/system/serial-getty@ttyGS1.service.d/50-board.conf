# Atlas's console on the USB gadget's second serial port (ttyGS1), while the
# security switch is off (security.env): a root shell without a login
# session, prompt, line editing or terminal queries, the line raw, so Atlas's
# framed commands (Atlas console.rs) can't be mangled or left at a prompt; it
# starts again whenever it ends or the computer hangs up. People use ttyGS0.
# Whoever holds this cable can already reflash the board, so it adds no access
# off the cable. With the switch on, ttyGS1 has no console. An OS turns both
# consoles off with
# `systemctl mask serial-getty@ttyGS0.service serial-getty@ttyGS1.service`.
[Service]
ExecCondition=/bin/sh -c '. /usr/lib/board/lib.sh; ! board_security_on'
ExecStart=
ExecStart=-/bin/sh -c 'stty raw -echo 2>/dev/null; exec /bin/sh /dev/stdin'
Restart=always
RestartSec=1
