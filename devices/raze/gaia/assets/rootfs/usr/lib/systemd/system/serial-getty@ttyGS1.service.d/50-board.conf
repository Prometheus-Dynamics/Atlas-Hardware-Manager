# Atlas's console on the USB gadget's second serial port (ttyGS1), while the
# security switch is off (security.env): a root shell without a login
# session, prompt, line editing or terminal queries, the line raw, so Atlas's
# framed commands (Atlas console.rs) can't be mangled or left at a prompt; it
# starts again whenever it ends or the computer hangs up. People use ttyGS0.
# Whoever holds this cable can already reflash the board, so it adds no access
# off the cable. With the switch on, ttyGS1 has no console. An OS turns both
# consoles off with
# `systemctl mask serial-getty@ttyGS0.service serial-getty@ttyGS1.service`.
[Service]
# No terminal reset, vhangup or deallocation by systemd on start and stop:
# PID 1 writes reset and size-probe sequences to the tty then, and on a gadget
# port the computer doesn't read (no program holds /dev/ttyACM*), those writes
# block once unread output fills the port. A blocked PID 1 stops feeding the
# hardware watchdog, which resets the board mid-shutdown (0x20, nothing
# logged; a tryboot flag lost with it). Found on the bench board 2026-10-19:
# every shutdown after ~50 s of uptime hung where these two gettys stopped.
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
ExecCondition=/bin/sh -c '. /usr/lib/board/lib.sh; ! board_security_on'
ExecStart=
# The shell ends when nothing holds the port (it reads end of file); the
# loop starts it again in place, so the unit stays running instead of
# restarting every second.
ExecStart=-/bin/sh -c 'while :; do stty raw -echo 2>/dev/null; /bin/sh /dev/stdin; sleep 1; done'
Restart=always
RestartSec=5
