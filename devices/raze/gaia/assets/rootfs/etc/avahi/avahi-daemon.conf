# avahi on a Raze (the device package): mDNS for the board's name
# (<hostname>.local), its _pd-device._tcp identity (/etc/avahi/services, bound
# from /run/board/avahi-services at boot), and for clients on the board that
# browse through avahi-client over D-Bus (WPILib's NetworkTables finding the
# robot controller, PhotonVision). systemd-resolved's mDNS is off
# (60-board-mdns.conf), so only avahi answers on 5353.
[server]
use-ipv4=yes
use-ipv6=yes
# Every interface but the USB bridge's members: usbbr0 answers for them, and
# answering on both would announce the board twice to the same computer.
deny-interfaces=usb0,usb1
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
publish-addresses=yes

[reflector]
enable-reflector=no

[rlimits]
