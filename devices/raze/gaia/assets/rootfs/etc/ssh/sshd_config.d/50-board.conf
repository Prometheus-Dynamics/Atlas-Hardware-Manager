# board: SSH keys left on the boot partition (/usr/lib/board/ssh-keys)
# are installed at boot to /run/board/ssh/authorized_keys, so they work on
# a read-only root. Needs `Include /etc/ssh/sshd_config.d/*.conf` near the top
# of sshd_config, before any other AuthorizedKeysFile line.
AuthorizedKeysFile .ssh/authorized_keys /run/board/ssh/authorized_keys
