# board: SSH keys left on the boot partition (/usr/lib/board/ssh-keys)
# are installed at boot to /run/board/ssh/authorized_keys, so they work on
# a read-only root. Needs `Include /etc/ssh/sshd_config.d/*.conf` near the top
# of sshd_config, before any other AuthorizedKeysFile or HostKey line.
AuthorizedKeysFile .ssh/authorized_keys /run/board/ssh/authorized_keys
# The board's host keys, the same in every OS image it runs
# (/usr/lib/board/ssh-hostkeys copies them here from /data/ssh at boot).
HostKey /run/board/ssh/hostkeys/ssh_host_ed25519_key
HostKey /run/board/ssh/hostkeys/ssh_host_ecdsa_key
HostKey /run/board/ssh/hostkeys/ssh_host_rsa_key
