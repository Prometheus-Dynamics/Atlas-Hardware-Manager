# Gaia 2.0.2+ (members/extract_to, rootfs.overlays, drop_shadowed_modules,
# checks.optional_firmware); an older gaia stops with an upgrade hint
# instead of listing unknown keys.
gaia_version = ">=2.0.2"
config = 3
description = "Raze kernel and firmware: Raspberry Pi kernel for CM5, OV9782 sensor support, Raspberry Pi firmware and overlays."

[image]
kind = "buildroot"
defconfig = "raspberrypicm5io_defconfig"
# Linux extension for OV9782 (linux/) and Gaia package overrides for libcamera
# and libpisp (packages/). Gaia takes one external_tree value and the last
# import wins: an OS with its own tree sets a colon-separated list of both.
external_tree = "${self}/buildroot-external"
external_tree_mode = "required"
config_overrides = [
  # Bootlin's newest aarch64 glibc toolchain (2025.08-1: gcc 15, kernel
  # headers 5.15). The defconfig's "stable" one has 5.4 headers, too old for
  # libpisp (linux/dma-heap.h, 5.6); PhotonVision's natives also want
  # glibc >= 2.38.
  ["BR2_TOOLCHAIN_EXTERNAL_BOOTLIN_AARCH64_GLIBC_STABLE", "n"],
  ["BR2_TOOLCHAIN_EXTERNAL_BOOTLIN_AARCH64_GLIBC_BLEEDING_EDGE", "y"],
  ["BR2_LINUX_KERNEL", "y"],
  ["BR2_LINUX_KERNEL_CUSTOM_TARBALL", "y"],
  # Hash in buildroot-external/linux/linux.hash (wired in external.mk).
  # raspberrypi/linux rpi-7.2.y at 53679a5 (Linux 7.2.9), pinned by commit.
  ["BR2_LINUX_KERNEL_CUSTOM_TARBALL_LOCATION", "\"https://github.com/raspberrypi/linux/archive/53679a5788f7912272b412fd78029bccae6f2b1a.tar.gz\""],
  ["BR2_LINUX_KERNEL_DEFCONFIG", "\"bcm2712\""],
  # 4 KiB pages, explicitly: Buildroot forces this onto the kernel config
  # after fragments (see raze.config). Change both together, after a hardware
  # test, if the package moves to 16 KiB.
  ["BR2_ARM64_PAGE_SIZE_4K", "y"],
  # Kernel fragments are OS-owned: an OS may list extra fragments here (for
  # modules it needs). The package's own decisions (16K pages, built-in EROFS,
  # trims: buildroot-external/linux/raze.config) are appended after them by
  # external.mk, so they always win. Empty by default, which also drops the
  # defconfig's linux-4k-page-size.fragment.
  ["BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES", "\"\""],
  # OV9782 as a variant of the upstream ov9282 driver (VIDEO_OV9282=m).
  ["BR2_LINUX_KERNEL_EXT_OV9782", "y"],
  ["BR2_PACKAGE_RPI_FIRMWARE", "y"],
  # The firmware's overlay set, for OS-level overlays. The ones raze-device.txt
  # loads (dwc2, i2c1-pi5, ws2812-pio, vc4-kms-v3d-pi5, ramoops-pi5) are built from
  # this kernel instead (external.mk, RAZE_KERNEL_OVERLAYS): the firmware's come
  # from its own kernel series.
  ["BR2_PACKAGE_RPI_FIRMWARE_INSTALL_DTB_OVERLAYS", "y"],
  # Only the firmware overlays a Raze loads, not its ~390 (each boot
  # partition and every slot carries them): bcm2712d0, which the firmware
  # applies by itself on D0 silicon (through overlay_map.dtb, always
  # installed). The rest raze-device.txt loads are this kernel's own
  # (RAZE_KERNEL_OVERLAYS) or the package's (boot.toml). An OS that loads
  # another stock overlay sets this list in its own config, keeping bcm2712d0.
  ["BR2_PACKAGE_RPI_FIRMWARE_DTB_OVERLAYS", "\"bcm2712d0\""],
  # vcgencmd (buildroot-external/packages/rpi-utils; Buildroot 2026.08
  # removed rpi-userland).
  ["BR2_PACKAGE_RPI_UTILS", "y"],
  # dtc for the compile-dts assembly transforms in boot.toml.
  ["BR2_PACKAGE_HOST_DTC", "y"],
]

# The seven Realtek USB Ethernet firmware files r8152 loads, extracted from
# linux-firmware into rootfs/usr/lib/firmware (merged /usr: an overlay may not
# hold /lib), instead of Buildroot's linux-firmware package, which extracts the
# whole 650 MB tarball on every clean build. r8152 is kept by raze-trim.config.
# Needs Gaia 96ceeec+ (members, extract_to, extract cache).
[[sources]]
id = "linux-firmware"
kind = "archive"
url = "https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-20260810.tar.xz"
sha256 = "ac17c34fe73756926a961fbafadf8d8f07a3bd2dd2f4ea31a0fb5d50c714a49a"
strip_components = 1
extract_to = "rootfs/usr/lib/firmware"
members = [
  "linux-firmware-20260810/rtl_nic/rtl8153a-2.fw",
  "linux-firmware-20260810/rtl_nic/rtl8153a-3.fw",
  "linux-firmware-20260810/rtl_nic/rtl8153a-4.fw",
  "linux-firmware-20260810/rtl_nic/rtl8153b-2.fw",
  "linux-firmware-20260810/rtl_nic/rtl8153c-1.fw",
  "linux-firmware-20260810/rtl_nic/rtl8156a-2.fw",
  "linux-firmware-20260810/rtl_nic/rtl8156b-2.fw",
]

# An OS adds its own overlays the same way; Gaia appends every layer's list to
# BR2_ROOTFS_OVERLAY (Gaia cf62b48+).
[image.rootfs]
overlays = ["${source.linux-firmware.path}/rootfs"]
# An OS that ships out-of-tree modules in updates/ (Styx's ov9282, pisp-be,
# rp1-cfe-downstream) gets their in-tree copies left out: modprobe never
# loads them. A variant that leaves the out-of-tree package out keeps the
# in-tree module. Needs Gaia f90bed4+ and per-package directories.
drop_shadowed_modules = true

[image.checks]
# r8152 also lists these two, which no linux-firmware release ships; it works
# without them. Needs Gaia 9445693+ (optional_firmware) and 8626987+ (an OS's
# own [image.checks] keeps this list).
optional_firmware = ["rtl_nic/rtl8157-1.fw", "rtl_nic/rtl8159-1.fw"]
