description = "Raze runtime: identity endpoint and mDNS advertisement, default hostname, USB gadget network and serial, USB port power policy, LED ring probe, hardware description."

# Units are installed in /usr/lib/systemd/system (not /etc), so an OS or user
# can mask or replace them, and are enabled by 70-pd-device.preset when the
# image is built. Defaults live in /usr/lib/pd-device/*.env and are overridden
# by files of the same name in /etc/pd-device/. Requires systemd as init and
# systemd-resolved for the mDNS advertisement (see devices/README.md).

