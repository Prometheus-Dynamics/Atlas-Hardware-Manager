[image]
kind = "buildroot"
config_overrides = [
  # DHCP server for the USB gadget link (board-usb-gadget-dhcp.service).
  # Buildroot installs no dnsmasq systemd unit, so nothing else starts it.
  ["BR2_PACKAGE_DNSMASQ", "y"],
  # board-update: the image it installs may be .img.xz (busybox xzcat
  # works too; xz-utils is faster) or .img.zst, and board-image-slots copies the
  # slot partitions out of the stream (buildroot-external/packages).
  ["BR2_PACKAGE_XZ", "y"],
  ["BR2_PACKAGE_ZSTD", "y"],
  ["BR2_PACKAGE_BOARD_IMAGE_SLOTS", "y"],
  # No udev hardware database (about 13 MB): nothing on a Raze needs
  # vendor/model names or input quirks from it. systemd or eudev, whichever
  # the OS uses; the other symbol is simply absent.
  ["BR2_PACKAGE_SYSTEMD_HWDB", "n"],
  ["BR2_PACKAGE_EUDEV_ENABLE_HWDB", "n"],
  # i2cdetect, for the selftest's I2C scan against the manifest's devices
  # (/usr/lib/board/selftest; it skips the scan without it).
  ["BR2_PACKAGE_I2C_TOOLS", "y"],
  # board-agent, the Orion device agent (buildroot-external/packages,
  # built from crates/board-agent in this Atlas checkout). An OS without
  # Orion, or importing a vendored copy of the package, sets it to "n";
  # board-agent.service then doesn't start.
  ["BR2_PACKAGE_BOARD_AGENT", "y"],
]

