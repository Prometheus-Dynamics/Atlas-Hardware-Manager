config = 3
description = "Raze runtime: what only this board has (generated hardware description, LED ring, USB port power, sensors). The rest is devices/common/board-os."

[[stage.files]]
id = "raze-modules-load-d-raze-i2c-dev-conf"
src = "${self}/assets/rootfs/usr/lib/modules-load.d/raze-i2c-dev.conf"
dest = "/usr/lib/modules-load.d/raze-i2c-dev.conf"
origin = "static-asset"

[[stage.files]]
id = "raze-board-device-package-env"
src = "${self}/assets/rootfs/usr/lib/board/board-package.env"
dest = "/usr/lib/board/board-package.env"
origin = "static-asset"

[[stage.files]]
id = "raze-board-raze-leds"
src = "${self}/assets/rootfs/usr/lib/board/raze-leds"
dest = "/usr/lib/board/raze-leds"
origin = "static-asset"
mode = 493

[[stage.files]]
id = "raze-udev-rules-d-60-raze-usb-power-rules"
src = "${self}/assets/rootfs/usr/lib/udev/rules.d/60-raze-usb-power.rules"
dest = "/usr/lib/udev/rules.d/60-raze-usb-power.rules"
origin = "static-asset"

[[stage.files]]
id = "raze-board-raze-sensors-toml"
src = "${self}/assets/rootfs/usr/share/board/raze/sensors.toml"
dest = "/usr/share/board/raze/sensors.toml"
origin = "static-asset"

# The camera module (generated from manifest.json): the lens model an OS's
# self-calibration of an uncalibrated camera starts from.
[[stage.files]]
id = "raze-board-raze-camera-toml"
src = "${self}/assets/rootfs/usr/share/board/raze/camera.toml"
dest = "/usr/share/board/raze/camera.toml"
origin = "static-asset"

[[stage.files]]
id = "raze-board-leds-env"
src = "${self}/assets/rootfs/usr/lib/board/leds.env"
dest = "/usr/lib/board/leds.env"
origin = "static-asset"

[[stage.files]]
id = "raze-board-hardware-env"
src = "${self}/assets/rootfs/usr/lib/board/hardware.env"
dest = "/usr/lib/board/hardware.env"
origin = "static-asset"

[[stage.files]]
id = "raze-lemnos-board"
src = "${self}/assets/rootfs/etc/lemnos/board.toml"
dest = "/etc/lemnos/board.toml"
mode = 420
origin = "static-asset"

# Write access for lemnosd (the `lemnos` user) to the fan and the device nodes.

[[stage.files]]
id = "raze-systemd-system-conf-d-60-board-watchdog-conf"
src = "${self}/assets/rootfs/usr/lib/systemd/system.conf.d/60-board-watchdog.conf"
dest = "/usr/lib/systemd/system.conf.d/60-board-watchdog.conf"
origin = "static-asset"

[image]
kind = "buildroot"

[image.feed]
stage_files = [
  "raze-systemd-system-conf-d-60-board-watchdog-conf",
  "raze-modules-load-d-raze-i2c-dev-conf",
  "raze-board-device-package-env",
  "raze-udev-rules-d-60-raze-usb-power-rules",
  "raze-board-raze-sensors-toml",
  "raze-board-raze-camera-toml",
  "raze-board-raze-leds",
  "raze-board-leds-env",
  "raze-board-hardware-env",
  "raze-lemnos-board",
]
