description = "Raze runtime: identity endpoint and mDNS advertisement, default hostname, USB gadget network and serial, USB port power policy, LED ring probe, hardware description and self-test."

# Units are installed in /usr/lib/systemd/system (not /etc), so an OS or user
# can mask or replace them, and are enabled by 70-board.preset when the
# image is built. Defaults live in /usr/lib/board/*.env and are overridden
# by files of the same name in /etc/board/. Requires systemd as init and
# systemd-resolved for the mDNS advertisement (see devices/README.md).

