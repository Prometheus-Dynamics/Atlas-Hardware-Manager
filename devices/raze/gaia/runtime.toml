[image]
kind = "buildroot"
config_overrides = [
  # DHCP server for the USB gadget link (pd-device-usb-gadget-dhcp.service).
  # Buildroot installs no dnsmasq systemd unit, so nothing else starts it.
  ["BR2_PACKAGE_DNSMASQ", "y"],
]

