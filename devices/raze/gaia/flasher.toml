# The Raze's USB-boot flasher (docs/flasher.md): the BCM2712 family's layer,
# with this board's config and command line (generated from the manifest).
config = 3
imports = ["../../families/rpi-bcm2712/gaia/flasher.toml"]

[inputs.flasher_name]
description = "The flasher bundle's name, as the manifest's recovery.flasher.bundle"
kind = "string"
default = "raze-flasher"

[[image.assembly.files]]
tree = "flasher-boot"
src = "${self}/assets/flasher/config.txt"
dest = "config.txt"

[[image.assembly.files]]
tree = "flasher-boot"
src = "${self}/assets/flasher/cmdline.txt"
dest = "cmdline.txt"

[image]
kind = "buildroot"
