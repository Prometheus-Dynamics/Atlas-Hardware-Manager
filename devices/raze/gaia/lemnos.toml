# Raze: lemnosd, the board's hardware service (LEDs, fan, sensors, GPIO).
#
# Imports Lemnos's own Gaia layer, which builds lemnosd and lemnos-ctl as
# static aarch64 musl binaries (in Docker), installs them in /usr/bin and
# stages lemnosd.service, its sysusers entry (the `lemnos` user, in groups
# i2c, gpio and video), a preset that enables it and /etc/default/lemnosd.env.
# This file then replaces that env file with the package's (the item
# `lemnosd-env`), so lemnosd's updating animation follows the package's update
# writer (/run/board/update.json). The board definition
# (/etc/lemnos/board.toml) and the udev rules lemnosd needs are staged by
# runtime.toml; both are generated or kept with the package. Lemnos's
# optional lemnos-orion layer adds the Orion bridge (/usr/bin/lemnos-orion,
# lemnos-orion.service as the `lemnos` user); runtime.toml stages its drop-in
# and enables it in 70-board.preset.
#
# The Lemnos source. Gaia lets only local config files (the OS build, or a
# layer it imports by plain path) declare an import source, so the OS build
# declares it, next to its `atlas` source, pinned at the commit this package is
# tested with (capabilities.hardware-service.gaia_import in manifest.json):
#
#   [[sources]]
#   id = "lemnos"
#   kind = "git"
#   repo = "https://github.com/Prometheus-Dynamics/Lemnos.git"
#   rev = "ae59665800dfc554f09c2d9842512f32e196f077"
#
# Without it, resolving this layer fails and names the source `lemnos`. For
# local development: --set sources.lemnos.path=/path/to/Lemnos.
description = "Raze hardware service: Lemnos's lemnosd layer, with the package's lemnosd settings."

imports = [
  { source = "lemnos", path = "packaging/gaia/lemnosd.toml" },
  # The bridge: lemnosd's devices as Orion resources (Lemnos docs/orion.md),
  # so Atlas reads them live and sets their controls through Orion. It
  # retries without orion-node; the drop-in below lets it in.
  { source = "lemnos", path = "packaging/gaia/lemnos-orion.toml" },
]

# The `lemnos` user, from Lemnos's own Buildroot users table (the same user
# as its sysusers entry, in groups i2c, gpio, spi and video), created at build
# time: systemd-sysusers can't add it on the EROFS root. external.mk adds it
# next to the OS's BR2_ROOTFS_USERS_TABLES; an OS needs no copy of its own.
[image]
kind = "buildroot"
# A Kconfig string: quoted in .config, or olddefconfig resets it to "".
# ${source.lemnos.path} is substituted anywhere in the value (an @source:
# token only at its start, so not inside the quotes).
config_overrides = [
  ["BR2_RAZE_LEMNOS_USERS_TABLE", "\"${source.lemnos.path}/packaging/buildroot/lemnos-users.table\""],
]

# The image is fed by id (board-agent.toml lists ids), so the bridge's items
# are named here; lemnosd.toml names its own.
[image.feed]
install_entries = ["install-lemnos-orion"]
stage_services = ["lemnos-orion-service"]

# Replaces Lemnos's item of the same id (a later layer replaces the whole
# item; this file's own items come after its imports).
[[stage.files]]
id = "lemnosd-env"
src = "@self/assets/lemnos/lemnosd.env"
dest = "/etc/default/lemnosd.env"
mode = 420
origin = "static-asset"
