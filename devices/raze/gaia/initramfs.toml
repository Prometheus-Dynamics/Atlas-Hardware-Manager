# The Raze slot initramfs (dynamic slots: slot images as EROFS files on the
# ext4 /data, each with its dm-verity tree appended). One per OS variant,
# from the same Buildroot base and kernel as the slot, beside its kernel in
# the slot's boot directory (slots/<id>/initramfs, `initramfs initramfs
# followkernel`). Its /init is slot-init itself (crates/slot-init, boot.rs;
# tested by tests/slot-init.sh), a static binary: it mounts /data, opens the
# slot's image through dm-verity with the root hash on the kernel command
# line, mounts it and switch_roots; on a failure it falls back to the
# default or the previous slot. Nothing else is in it but the dm modules:
# no shell, no libc, no e2fsck (the kernel replays /data's journal; a
# filesystem marked as having errors is mounted read-only), so it is
# ~0.3 MB instead of 2 MB per slot.
#
# Output: $assembly.work/slots/initramfs.cpio.zst, for the slot bundle and
# the boot directory (the recipes that assemble those take it from there).
# The kernel needs BLK_DEV_INITRD, BLK_DEV_LOOP, EROFS_FS, EXT4_FS, VFAT_FS
# built in (they are); dm-mod, dm-bufio and dm-verity come as modules, below.

[[image.assembly.trees]]
id = "slot-initramfs"
path = "$assembly.work/slots/initramfs"
# Every ELF in it stripped before it is packed (the modules --strip-debug).
strip = true

# Device-mapper and verity (modules in the Raze kernel), with their deps.
# /init reads modules.dep and nothing else of the module metadata.
[[image.assembly.kernel_modules]]
tree = "slot-initramfs"
from = "$provider.buildroot_output/target/lib/modules"
depmod = "$provider.buildroot_output/host/sbin/depmod"
modules = ["dm-mod", "dm-bufio", "dm-verity"]
metadata = ["modules.dep"]

[[image.assembly.files]]
tree = "slot-initramfs"
src = "${workspace.out_dir}/artifacts/slot-init/slot-init"
dest = "init"
mode = "0755"

# zstd -19 (Gaia's default level). Not xz, though smaller (~90 KB): three xz
# encodings stopped the kernel before /init (r54, r55, r56), and zstd booted
# from the first try. The slots writer refuses an xz initramfs (slot-init
# check-initramfs).
[[image.assembly.filesystems]]
id = "slot-initramfs"
kind = "cpio-zstd"
source_tree = "slot-initramfs"
output = "$assembly.work/slots/initramfs.cpio.zst"

# slot-init, as board-agent is built (board-agent.toml): a static aarch64
# musl binary from the OS build's `atlas` source. Only the initramfs takes it.
[[artifacts]]
id = "slot-init"
kind = "rust"
source = "atlas"
package = "slot-init"
target = "aarch64-unknown-linux-musl"
# Built for size: every slot's initramfs carries it (Cargo.toml).
profile = "device-small"
target_name = "slot-init"
output_path = "${workspace.out_dir}/artifacts/slot-init/slot-init"

[artifacts.execution]
backend = "docker"

[artifacts.execution.docker]
image = "board-aarch64-musl"
dockerfile = "@self/docker/aarch64-musl.Dockerfile"
context = "@self/docker"

# The OS takes slot-init too: the slots writer (/usr/lib/board/slots) reads
# slot.json and state.json with it.
[[install]]
id = "install-slot-init"
artifact = "slot-init"
dest = "/usr/lib/board/slot-init"
replace = true
mode = 493 # 0755

[image]
kind = "buildroot"

[image.feed]
install_entries = ["install-slot-init"]
