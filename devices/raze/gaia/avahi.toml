# Optional, not imported by device.toml: mDNS through avahi-daemon instead of
# systemd-resolved, for an OS whose programs browse or announce through
# libavahi-client over D-Bus (WPILib's NetworkTables finding the 2027 robot
# controller, _SystemCore._tcp; PhotonVision announcing itself). resolved has
# no avahi-client API, so such an image needs avahi; HeliOS doesn't (about
# 2.5 MB of RAM). Import after device.toml:
#   { source = "atlas", path = "devices/raze/gaia/avahi.toml" }
# avahi then answers for <hostname>.local and the identity's _pd-device._tcp
# (/run/board/avahi-services, bound over /etc/avahi/services); resolved's and
# NetworkManager's mDNS go off, so only avahi uses 5353.
config = 3
description = "Raze mDNS through avahi-daemon (for libavahi-client programs) instead of systemd-resolved."

[[stage.files]]
id = "raze-etc-avahi-daemon-conf"
src = "${self}/assets/rootfs/etc/avahi/avahi-daemon.conf"
dest = "/etc/avahi/avahi-daemon.conf"
origin = "static-asset"

[[stage.files]]
id = "raze-systemd-system-etc-avahi-services-mount"
src = "${self}/assets/rootfs/usr/lib/systemd/system/etc-avahi-services.mount"
dest = "/usr/lib/systemd/system/etc-avahi-services.mount"
origin = "static-asset"

[[stage.files]]
id = "raze-systemd-system-avahi-daemon-service-d-50-board"
src = "${self}/assets/rootfs/usr/lib/systemd/system/avahi-daemon.service.d/50-board.conf"
dest = "/usr/lib/systemd/system/avahi-daemon.service.d/50-board.conf"
origin = "static-asset"

[[stage.files]]
id = "raze-systemd-resolved-conf-d-61-board-avahi-conf"
src = "${self}/assets/rootfs/usr/lib/systemd/resolved.conf.d/61-board-avahi.conf"
dest = "/usr/lib/systemd/resolved.conf.d/61-board-avahi.conf"
origin = "static-asset"

[[stage.files]]
id = "raze-NetworkManager-conf-d-61-board-avahi-conf"
src = "${self}/assets/rootfs/usr/lib/NetworkManager/conf.d/61-board-avahi.conf"
dest = "/usr/lib/NetworkManager/conf.d/61-board-avahi.conf"
origin = "static-asset"

[[stage.files]]
id = "raze-systemd-system-preset-70-board-avahi-preset"
src = "${self}/assets/rootfs/usr/lib/systemd/system-preset/70-board-avahi.preset"
dest = "/usr/lib/systemd/system-preset/70-board-avahi.preset"
origin = "static-asset"

[image]
kind = "buildroot"
config_overrides = [
  # avahi-daemon, and libavahi-client (built with D-Bus) for the programs.
  ["BR2_PACKAGE_AVAHI", "y"],
  ["BR2_PACKAGE_AVAHI_DAEMON", "y"],
]

[image.feed]
stage_files = [
  "raze-etc-avahi-daemon-conf",
  "raze-systemd-system-etc-avahi-services-mount",
  "raze-systemd-system-avahi-daemon-service-d-50-board",
  "raze-systemd-resolved-conf-d-61-board-avahi-conf",
  "raze-NetworkManager-conf-d-61-board-avahi-conf",
  "raze-systemd-system-preset-70-board-avahi-preset",
]
