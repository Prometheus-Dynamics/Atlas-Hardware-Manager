# Radxa ZERO 3E device support from Atlas: everything an OS imports, so a later
# addition here needs no change there. Import it from a source named `atlas`
# (none in Gaia yet):
#
#   imports = [
#     { source = "atlas", path = "devices/radxa-zero-3e/gaia/device.toml" },
#   ]
# Network: Gigabit Ethernet (RTL8211F-CG; the ZERO 3E has no Wi-Fi), which a
# Gaia image must bring up before this answers (DHCP on eth0 is UNCONFIRMED).
# Written from Atlas's contract; untested on a board.
config = 3
gaia_version = ">=2.0.0"

imports = ["../../common/board-lite/gaia/aarch64.toml"]

[inputs.board_lite_model]
description = "The model board-lite reports"
kind = "string"
default = "radxa-zero-3e"
