# Radxa ROCK 4D device support from Atlas: everything an OS imports, so a later
# addition here needs no change there. Import it from a source named `atlas`
# (Gaia's examples/boards/rock-4d):
#
#   imports = [
#     { source = "atlas", path = "devices/radxa-rock-4d/gaia/device.toml" },
#   ]
# Network: DHCP on eth0 (BR2_SYSTEM_DHCP).
# Written from Atlas's contract; untested on a board.
config = 3
gaia_version = ">=2.0.0"

imports = ["../../common/board-lite/gaia/aarch64.toml"]

[inputs.board_lite_model]
description = "The model board-lite reports"
kind = "string"
default = "radxa-rock-4d"
