# The ZERO 3E's Lemnos board file, the USB device port part only (B15). It is not installed by any
# product yet, and it is not the whole board file: the buses, the fan and the other devices are not
# written here.
#
# WRITTEN TO Lemnos Q2f (96080d36; Q2e and Q2f, socs/rk3566.toml). VALIDATED at Lemnos 96080d36 in B21 (see
# docs/prs/B21.md for the commands and the output). Earlier, at 4a2d3b7d (B18), the Q2e part was validated.
# `lemnos-ctl validate --socs socs BOARD --no-live` and `lemnos-ctl tree --socs socs BOARD` run in scratch from a git
# archive of 96080d36, not on a board. The bench ZERO 3E is the first check that the port probes.
#
# Status, the bring-up checks and the labels list: docs/prs/B21.md.
#
# The generator writes nothing for this port unless a gadget names it, and the one gadget below names
# it. The overlay is generated by `lemnos-ctl tree`; no board .dts is written by hand for this.
format = "lemnos.board"
schema_version = 1

[board]
id = "radxa-zero-3e"
soc = "rk3566"
# The base tree's VBUS facts for this port are read from the map under this name (Q2f, docs/device-tree.md,
# "VBUS of a device port"). `usb-no-vbus` says: the base's OTG port has no phy-supply, so nothing to hold and nothing
# for the stand-in to replace. Without this line the map's fact is not seen, and the port is refused.
base = "usb-no-vbus"

# The USB device port: the OTG port of the RK3566's DRD controller 0 (USB 2 only).
#
# Evidence, each point from the mainline device tree at v7.3.3 (fetched from git.kernel.org,
# arch/arm64/boot/dts/rockchip/) unless said otherwise:
# (a) Which connector: usb_host0_xhci (usb@fcc00000, rk356x-base.dtsi and rk3566-base.dtsi) is the one
#     controller with an OTG PHY (usb2phy0_otg). usb_host1_xhci is host-only (dr_mode "host", usb2phy0_host).
#     Radxa's hardware interface page (docs.radxa.com/en/zero/zero3/hardware-design/hardware-interface)
#     names USB-C 1 as the USB 2.0 OTG port (it is also the 5 V power input) and USB-C 2 as a USB 3.0 host.
#     Schematic V1.2.00 (dl.radxa.com/zero3/docs/hw/3e/radxa_zero_3e_v1200_schematic.pdf, sheet 18 "Power IN"):
#     J2 (USB_TYPEC_115H0) carries USB_OTG0_DP/DM to the SoC; its VBUS pins go to +5V_INPUT, which is the board's
#     input to VCC_SYS. CC1/CC2 are pulled down with 5.1 K (a sink, no PD controller).
# (b) SuperSpeed: none. usb_host0_xhci's only PHY is usb2phy0_otg; the RK3566 has no SuperSpeed PHY on this
#     port in any tree read. The map gives no `usb3` option for this controller. USB 2 only.
# (c) phy-supply: none. Nothing sets phy-supply on usb2phy0_otg in rk356x-base.dtsi, rk3566-base.dtsi,
#     rk3566-radxa-zero-3.dtsi or rk3566-radxa-zero-3e.dts. The PMIC OTG_SWITCH regulator ("vbus",
#     rk3566-radxa-zero-3.dtsi line 410) has no consumer in any tree read, and no regulator-always-on or
#     regulator-boot-on. The base tree's VBUS on this port is therefore: none, by the tree.
#     Schematic sheet 18 shows no VBUS output from the board onto J2's VBUS pins: they are the input. Sheet 17 (PMIC
#     RK817) has a net named VBUS (the charger input, pin 69, through a PMOS to VCC_SYS); its connection to J2 is not
#     shown on any sheet read, and the names differ (VBUS vs +5V_INPUT). That is the one doubt: a meter settles it.
# VBUS on this port comes from the host, by design: the board is powered from USB-C 1 in device mode, so the 5 V on
# VBUS is the host's, not the board's.
[[hardware]]
name = "udc:fcc00000.usb"
controller = "usb-otg0"
role = "peripheral"

# The gadget (the Lemnos usb-gadget driver). Its interfaces are not written here: the function list and
# the identity device come with the rest of the board file.
[[devices]]
id = "gadget"
driver = "usb-gadget"
uses = { function = "udc:fcc00000.usb" }
