# The ZERO 3E's Lemnos board file, for the bench slot image (Z2): the USB device port (B15, below), the identity, the
# hardware watchdog, and the U-Boot slot record (record = "uboot", Lemnos BB1b). Installed by zero-3e-bench as
# /etc/lemnos/board.toml (through the board's [descriptions]). It is not the whole board file: the buses, the fan and the
# other devices are not written here. Untested on board.
#
# Z2 sources (Lemnos 7d91d645 (next head, OWNER-PROBE-ACCESS: the daemon's slot and security writes work under its real unit; coordinator 2026-11-21, F3-1), testing/boards/rk3566-slots.toml, which is the form this file takes for the
# RK3566 with the SD as the one medium): the watchdog `/watchdog@fe600000` (socs/rk3566.toml [controllers.watchdog]),
# the slots device with uboot_env_size 0x10000, uboot_env_mmc_index 1 (SD = U-Boot mmc 1, sdmmc0 `/mmc@fe2b0000`),
# boot_sources, and the test fastboot pair 1209:0001 (pid.codes test pair: NOT a registered id, a test value).
# The [boot] bays are Atlas's sizes, UNVERIFIED: each is the STORED file's size + margin per docs/slots.md; Gaia's
# `boot-report` (the boot-partition fit) gives the real figures on the first build, and a larger payload is refused by name.
#
# WRITTEN TO Lemnos Q2f (96080d36; Q2e and Q2f, socs/rk3566.toml). VALIDATED at Lemnos 96080d36 in B21 (see
# docs/prs/B21.md for the commands and the output). Earlier, at 4a2d3b7d (B18), the Q2e part was validated.
# `lemnos-ctl validate --socs socs BOARD --no-live` and `lemnos-ctl tree --socs socs BOARD` run in scratch from a git
# archive of 96080d36, not on a board. The bench ZERO 3E is the first check that the port probes.
#
# Status, the bring-up checks and the labels list: docs/prs/B21.md.
#
# The generator writes nothing for this port unless a gadget names it, and the one gadget below names
# it. The overlay is generated by `lemnos-ctl tree`; no board .dts is written by hand for this.
format = "lemnos.board"
schema_version = 1

[board]
id = "radxa-zero-3e"
soc = "rk3566"
# The base tree's VBUS facts for this port are read from the map under this name (Q2f, docs/device-tree.md,
# "VBUS of a device port"). `usb-no-vbus` says: the base's OTG port has no phy-supply, so nothing to hold and nothing
# for the stand-in to replace. Without this line the map's fact is not seen, and the port is refused.
base = "usb-no-vbus"

# The USB device port: the OTG port of the RK3566's DRD controller 0 (USB 2 only).
#
# Evidence, each point from the mainline device tree at v7.3.3 (fetched from git.kernel.org,
# arch/arm64/boot/dts/rockchip/) unless said otherwise:
# (a) Which connector: usb_host0_xhci (usb@fcc00000, rk356x-base.dtsi and rk3566-base.dtsi) is the one
#     controller with an OTG PHY (usb2phy0_otg). usb_host1_xhci is host-only (dr_mode "host", usb2phy0_host).
#     Radxa's hardware interface page (docs.radxa.com/en/zero/zero3/hardware-design/hardware-interface)
#     names USB-C 1 as the USB 2.0 OTG port (it is also the 5 V power input) and USB-C 2 as a USB 3.0 host.
#     Schematic V1.2.00 (dl.radxa.com/zero3/docs/hw/3e/radxa_zero_3e_v1200_schematic.pdf, sheet 18 "Power IN"):
#     J2 (USB_TYPEC_115H0) carries USB_OTG0_DP/DM to the SoC; its VBUS pins go to +5V_INPUT, which is the board's
#     input to VCC_SYS. CC1/CC2 are pulled down with 5.1 K (a sink, no PD controller).
# (b) SuperSpeed: none. usb_host0_xhci's only PHY is usb2phy0_otg; the RK3566 has no SuperSpeed PHY on this
#     port in any tree read. The map gives no `usb3` option for this controller. USB 2 only.
# (c) phy-supply: none. Nothing sets phy-supply on usb2phy0_otg in rk356x-base.dtsi, rk3566-base.dtsi,
#     rk3566-radxa-zero-3.dtsi or rk3566-radxa-zero-3e.dts. The PMIC OTG_SWITCH regulator ("vbus",
#     rk3566-radxa-zero-3.dtsi line 410) has no consumer in any tree read, and no regulator-always-on or
#     regulator-boot-on. The base tree's VBUS on this port is therefore: none, by the tree.
#     Schematic sheet 18 shows no VBUS output from the board onto J2's VBUS pins: they are the input. Sheet 17 (PMIC
#     RK817) has a net named VBUS (the charger input, pin 69, through a PMOS to VCC_SYS); its connection to J2 is not
#     shown on any sheet read, and the names differ (VBUS vs +5V_INPUT). That is the one doubt: a meter settles it.
# VBUS on this port comes from the host, by design: the board is powered from USB-C 1 in device mode, so the 5 V on
# VBUS is the host's, not the board's.
[[hardware]]
name = "udc:fcc00000.usb"
controller = "usb-otg0"
role = "peripheral"

# The identity: the board's serial from the device tree (the Raze's way; the rk3566 device-tree serial is read on a board, docs/identity.md).
# name and revision are the board's own facts.
[[devices]]
id = "identity"
driver = "system-identity"
config = { serial = "device-tree", name = "Radxa ZERO 3E", revision = "bench" }

[boot]
# The payload bays of the U-Boot form (Lemnos I5i8, docs/slots.md "the boot partition"): three bay sets, each file's
# size is the STORED file's (on the U-Boot form the kernel is the raw Image; a compressed one is refused by name).
# Sizes (UNVERIFIED on the first build): kernel 32 MiB (Gaia's untrimmed ZERO 3E Image was 23,577,088 bytes); initramfs
# 1 MiB (the slot-init archive: 495,328 bytes on the Raze); device tree 256 KiB (this board's dtb was 115,100 bytes in
# Gaia's scratch build); overlay 16 KiB (1,238 bytes); cmdline 4 KiB (155 bytes).
bay_kernel_bytes = 33554432
bay_initramfs_bytes = 1048576
bay_device_tree_bytes = 262144
bay_cmdline_bytes = 4096
bay_overlay_bytes = 16384

# The hardware the devices use: the watchdog (socs/rk3566.toml [controllers.watchdog]).
[[hardware]]
controller = "watchdog"

# The system: identity, the slot store (the U-Boot record), reboot and the watchdog. Lemnos BB1b testing/boards/rk3566-slots.toml.
[[devices]]
id = "reboot"
driver = "system-reboot"

[[devices]]
id = "watchdog"
driver = "hw-watchdog"
keepalive = true
uses = { watchdog = "watchdog:/watchdog@fe600000" }
config = { timeout_s = 15 }

# The slots: the boot partition holds the bays (FAT), the data partition the slot file (/data). record = "uboot": U-Boot's
# own redundant environment (the GPT partition of type 3de21764..., 128 KiB, copies of uboot_env_size 0x10000) holds the
# record. The SD is U-Boot's mmc 1 (uboot_env_mmc_index = 1): the eMMC socket is disabled on this board. boot_sources names the SD
# controller's device-tree path, which the boot script hands on (Lemnos docs/slots.md "the boot source").
# Sizing (Z2; the arithmetic is in board.toml, [[partitions]] data): keep = 2 (running + the new install), reserve_mb = 128
# (free space an install leaves). Neither inherits Lemnos's defaults (keep 3, reserve 2048 MiB). grow_data = false: GPT: Lemnos's
# GPT is grown in code at bbb3c420 (drivers/slot-store/src/grow/gpt.rs), but GROW is not yet run on a card
# (testing/board-runs/GROW.md, docs/hardware-status.md). This stays false until that run; then it can change.
[[devices]]
id = "slots"
driver = "system-slots"
config = { data = "/data", boot = "/boot", record = "uboot", boot_args = "os", boot_sources = ["/mmc@fe2b0000=/mmc@fe2b0000"], uboot_env_size = 0x10000, uboot_env_mmc_index = 1, uboot_usb_vendor = 0x1209, uboot_usb_product = 0x0001, keep = 2, reserve_mb = 128, grow_data = false }

# The gadget (the Lemnos usb-gadget driver), with the Raze's addressing: the default composition (the orion link, NCM
# derived from the board serial, one ACM console); the NCM interface is lemnos<N>, addressed by the lemnos0-addressing
# component (serial-hash-v1). identity names the identity device above (the daemon reads it from the gadget's config).
[[devices]]
id = "gadget"
driver = "usb-gadget"
uses = { function = "udc:fcc00000.usb" }
config = { vendor = 0x1d6b, product = 0x0104, identity = "identity" }

# The security switch OFF: no record is kept, Orion does not ship here, so nothing is authenticated (docs/slots.md).
[security]
record = "/var/lib/lemnos/security.rec"
orion = false
