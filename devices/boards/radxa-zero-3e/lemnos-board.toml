# The ZERO 3E's Lemnos board file, the USB device port part only (B15). It is not installed by any
# product yet, and it is not the whole board file: the buses, the fan and the other devices are not
# written here.
#
# WRITTEN TO Lemnos e99d51c0 (Q2e: the USB device ports in the RK3566 map, socs/rk3566.toml).
# UNVALIDATED: the Lemnos lock in the products is b0bf0101, which predates Q2e, so `lemnos-ctl tree`
# and the start check cannot read these entries yet. They are checked when the lock moves to a green
# rev that contains Q2e. Do not lock to e99d51c0 here (the coordinator sends the green rev).
#
# The generator writes nothing for this port unless a gadget names it, and the one gadget below names
# it. The overlay is generated by `lemnos-ctl tree`; no board .dts is written by hand for this.
format = "lemnos.board"
schema_version = 1

[board]
id = "radxa-zero-3e"
soc = "rk3566"

# The USB device port: the OTG port of the RK3566's DRD controller 0 (USB 2 only).
#
# Evidence, each point from the mainline device tree at v7.3.3 (fetched from git.kernel.org,
# arch/arm64/boot/dts/rockchip/) unless said otherwise:
# (a) Which connector: usb_host0_xhci (usb@fcc00000, rk356x-base.dtsi and rk3566-base.dtsi) is the one
#     controller with an OTG PHY (usb2phy0_otg). usb_host1_xhci is host-only (dr_mode "host", usb2phy0_host).
#     Radxa's hardware interface page (docs.radxa.com/en/zero/zero3/hardware-design/hardware-interface)
#     names USB-C 1 as the USB 2.0 OTG port (it is also the 5 V power input) and USB-C 2 as a USB 3.0 host.
# (b) SuperSpeed: none. usb_host0_xhci's only PHY is usb2phy0_otg; the RK3566 has no SuperSpeed PHY on this
#     port in any tree read. The map gives no `usb3` option for this controller. USB 2 only.
# (c) phy-supply: none. Nothing sets phy-supply on usb2phy0_otg in rk356x-base.dtsi, rk3566-base.dtsi,
#     rk3566-radxa-zero-3.dtsi or rk3566-radxa-zero-3e.dts. The PMIC OTG_SWITCH regulator ("vbus",
#     rk3566-radxa-zero-3.dtsi) has no consumer. The tree drives no VBUS on this port.
[[hardware]]
name = "udc:fcc00000.usb"
controller = "usb-otg0"
role = "peripheral"

# The gadget (the Lemnos usb-gadget driver). Its interfaces are not written here: the function list and
# the identity device come with the rest of the board file.
[[devices]]
id = "gadget"
driver = "usb-gadget"
uses = { function = "udc:fcc00000.usb" }
