# Radxa ZERO 3E (RK3566, 1 GB LPDDR4, microSD, Gigabit Ethernet, no Wi-Fi) on
# the rk35xx family. Its OTG port runs in peripheral mode as a USB gadget
# network (assets/dts, assets/linux.fragment). Untested on board.
version = 1
extends = "../../families/rk35xx/family.toml"
name = "radxa-zero-3e"
description = "Radxa ZERO 3E (RK3566)"

[target]
cpu = "cortex-a55"

# Lists replace the family's, so both fragment files are named here.
# The booted device tree is the gadget variant (the OTG port in peripheral
# mode); the in-tree rk3566-radxa-zero-3e.dts is included by it.
[kernel]
device_tree = "rockchip/rk3566-radxa-zero-3e-gadget"
device_tree_dir = "assets/dts"
fragments = ["../../families/rk35xx/assets/trim.fragment", "../../families/rk35xx/assets/linux.fragment", "assets/linux.fragment"]

[bootloader]
defconfig = "radxa-zero-3-rk3566"

# The ZERO 3E's own rkbin pin: f43a462e, the commit dev's working image used.
[sources.rkbin]
git = "https://github.com/rockchip-linux/rkbin.git"
ref = "f43a462e7a1429a9d407ae52b4745033034a6cf9"

# U-Boot's make variable ROCKCHIP_TPL: the DDR init blob, RK3566 v1.23.
# VERIFIED ON HARDWARE 2026-11-13: Gaia's bring-up image with this blob boots
# the board (Linux 7.3.3 up, SSH in). v1.26 at rkbin 3e288fe did NOT boot it.
# Never move this without a board run.
[bootloader.blobs]
ROCKCHIP_TPL = { source = "rkbin", path = "bin/rk35/rk3566_ddr_1056MHz_v1.23.bin" }

[bootloader.trusted_firmware]
platform = "rk3568"

# The maskrom loader's RKBOOT ini: names the DDR init and usbplug above and
# the merged loader boot_merger builds from it (versions as that commit's ini names them).
[flash.files]
loader_ini = { source = "rkbin", path = "RKBOOT/RK3566MINIALL.ini" }

[descriptions]
lemnos = "lemnos-board.toml"

# The partitions, in table order (Z2, slot-disk). A board's [[partitions]] REPLACE the family's, so the two areas the family
# gives are restated here, unchanged: `u-boot` (the U-Boot binary at 32K, outside the table; its content is the OS's
# bootloader output) and `uboot-env` (the environment, 16M, 128K). Then `boot` (the FAT partition the U-Boot form reads
# boot.scr and the three bay sets from: its size is the product's boot_size, check-devices requires that) and `data`
# (the slot file; last, and its size is the one number `@data-size@` takes and the ext4 filesystem is made to).
# DATA SIZE 1 GiB (1073741824): one slot is an EROFS root of about 18 to 40 MB (the Raze's measured root: 18,178,048 bytes
# at lzma level 6) and the data partition holds the slot files of every install (the keep-last-N policy), so the first flash
# holds several slots with room; a 1 GiB card area is small for the 8 GB+ SD cards the bench uses. Not grown on first boot:
# the first-start grow is Lemnos M36b, not at the pin. UNVERIFIED on board.
[[partitions]]
name = "u-boot"
role = "bootloader"
offset = "32K"
in_table = false
content = "u-boot-rockchip.bin"

[[partitions]]
name = "uboot-env"
role = "raw"
type = "3de21764-95bd-54bd-a5c3-4abe786f38a8"
offset = "16M"
size = "128K"

[[partitions]]
name = "boot"
role = "boot"
type = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7"
size = "134217728"

[[partitions]]
name = "data"
role = "data"
type = "0fc63daf-8483-4772-8e79-3d69d8477de4"
size = "1073741824"
