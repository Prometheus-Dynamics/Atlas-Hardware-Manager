# Radxa ZERO 3E (RK3566, 1 GB LPDDR4, microSD, Gigabit Ethernet, no Wi-Fi) on
# the rk35xx family. Its OTG port runs in peripheral mode as a USB gadget
# network (assets/dts, assets/linux.fragment). Untested on board.
version = 1
extends = "../../families/rk35xx/family.toml"
name = "radxa-zero-3e"
description = "Radxa ZERO 3E (RK3566)"

[target]
cpu = "cortex-a55"

# Lists replace the family's, so both fragment files are named here.
# The booted device tree is the gadget variant (the OTG port in peripheral
# mode); the in-tree rk3566-radxa-zero-3e.dts is included by it.
[kernel]
device_tree = "rockchip/rk3566-radxa-zero-3e-gadget"
device_tree_dir = "assets/dts"
fragments = ["../../families/rk35xx/assets/trim.fragment", "../../families/rk35xx/assets/linux.fragment", "assets/linux.fragment"]

[bootloader]
defconfig = "radxa-zero-3-rk3566"
# The family's U-Boot fragment, then the RK3568 one: the fastboot buffer address (RK-FASTBOOT). The list replaces the family's.
fragments = ["../../families/rk35xx/assets/u-boot.fragment", "../../families/rk35xx/assets/u-boot-rk3568.fragment"]

# The ZERO 3E's own rkbin pin: f43a462e, the commit dev's working image used.
[sources.rkbin]
git = "https://github.com/rockchip-linux/rkbin.git"
ref = "f43a462e7a1429a9d407ae52b4745033034a6cf9"

# U-Boot's make variable ROCKCHIP_TPL: the DDR init blob, RK3566 v1.23.
# VERIFIED ON HARDWARE 2026-11-13: Gaia's bring-up image with this blob boots
# the board (Linux 7.3.3 up, SSH in). v1.26 at rkbin 3e288fe did NOT boot it.
# Never move this without a board run.
[bootloader.blobs]
ROCKCHIP_TPL = { source = "rkbin", path = "bin/rk35/rk3566_ddr_1056MHz_v1.23.bin" }

[bootloader.trusted_firmware]
platform = "rk3568"

# The maskrom loader's RKBOOT ini: names the DDR init and usbplug above and
# the merged loader boot_merger builds from it (versions as that commit's ini names them).
[flash.files]
loader_ini = { source = "rkbin", path = "RKBOOT/RK3566MINIALL.ini" }

[descriptions]
lemnos = "lemnos-board.toml"

# The partitions, in table order (Z2, slot-disk). A board's [[partitions]] REPLACE the family's, so the two areas the family
# gives are restated here, unchanged: `u-boot` (the U-Boot binary at 32K, outside the table; its content is the OS's
# bootloader output) and `uboot-env` (the environment, 16M, 128K). Then `boot` (the FAT partition the U-Boot form reads
# boot.scr and the three bay sets from: its size is the product's boot_size, check-devices requires that) and `data`
# (the slot file; last, and its size is the one number `@data-size@` takes and the ext4 filesystem is made to).
# DATA SIZE (Z2, final; the set the bench boards copy). The data partition does NOT grow on this GPT board; Lemnos's grow is
# GPT grow is in code at 6c8568d0 (drivers/slot-store/src/grow/gpt.rs) but not yet run on a card (testing/board-runs/GROW.md). Smallest card: 8 GB (the tree's statement, "8 GB+ SD cards the bench uses"), taken as 7.4 GiB
# usable = 7,945,689,497 bytes (a safety margin for cards smaller than nominal). check-devices data_size_rule reads that
# constant (scripts/check-devices.sh, DATA_CARD_USABLE_BYTES): a board file has no key for the card.
# Slot bay set (ENFORCED: install.rs:698 refuses a payload larger than its bay before any write; the sizes are the
# [lemnos-board.toml [boot] bay_* keys below): 33,554,432 + 1,048,576 + 262,144 + 4,096 + 16,384 = 34,885,632 bytes (33.27 MiB).
# NOTE: the slot ROOT image (the EROFS file in data) has NO enforced cap at Lemnos 31e0f736; the data sizing relies on it
# being smaller than the design bound, which Lemnos does not enforce. Flagged for the coordinator.
# Minimum data = 1.10 x (keep x bay set + reserve_mb + journal allowance):
#   keep = 2 (system-slots: running + the new install; after a successful trial housekeeping keeps the new running slot and
#   the previous good one, the rollback target: lib.rs:916-960 at 31e0f736), reserve_mb = 128 (the free space an install
#   leaves), journal allowance = 64 MiB (the journal cap, when it lands).
#   = 1.10 x (2 x 34,885,632 + 134,217,728 + 67,108,864) = 298,207,641 bytes (284.3 MiB). Data here: 1 GiB = 1,073,741,824.
# Layout (the whole card): the first partition's offset 16 MiB (16,777,216, which includes the primary GPT) + uboot-env 128 KiB
#   (131,072) + boot 128 MiB (134,217,728, the FAT partition with the bays) + data 1 GiB (1,073,741,824) + backup GPT
#   (1,048,576) = 1,225,916,416 bytes (1.141 GiB). Fits 7.4 GiB with 6.26 GiB free. Nothing is placed after data.
# UNKNOWN from Lemnos (to confirm): whether a pushed bundle is spooled on the data partition before an install (it may add
# a term). UNVERIFIED on board: nothing has been written to a card.
[[partitions]]
name = "u-boot"
role = "bootloader"
offset = "32K"
in_table = false
content = "u-boot-rockchip.bin"

[[partitions]]
name = "uboot-env"
role = "raw"
type = "3de21764-95bd-54bd-a5c3-4abe786f38a8"
offset = "16M"
size = "128K"

[[partitions]]
name = "boot"
role = "boot"
type = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7"
size = "134217728"

[[partitions]]
name = "data"
role = "data"
type = "0fc63daf-8483-4772-8e79-3d69d8477de4"
size = "1073741824"
