# Pad-table statement for the Cubie A7Z (read by scripts/check-devices.sh pads_rule; Gaia does not read this file).
# Sources: Radxa allwinner-device 7b63c9ec configs/cubie_a7z/linux-6.6/board.dts and uboot-board.dts (both read; hashes in
# kernel/post-patch-facts.txt and kernel/edits.toml). Not derived from the A7S. No schematic for this board is on disk.
# PI is NOT stated: the pin groups are named in the Radxa SoC dtsi, which is not on disk, so no pio reference to bank PI
# can be checked mechanically. PA, PB..PK and PL/PM are stated in the form that needs no rail: no bank supply in the
# kernel dts and no fixed rail in either Radxa file, so nothing programs a rail and the mode is never written.
soc = "a733"
source = "Radxa allwinner-device 7b63c9ec configs/cubie_a7z/linux-6.6/board.dts and uboot-board.dts (no vcc-p supplies, no fixed regulator)"
derived_from_board = ""
bank_voltages = { PA = "no pads: the series pinctrl-sun60i-a733.c a733_nr_bank_pins gives PA 0 pins (first entry, same SoC); source: kernel/post-patch-facts.txt", PB = "left as the PMIC powers it up; no bank supply in the kernel dts and no fixed rail in either Radxa file; mode not written by us; source: kernel/post-patch-facts.txt", PC = "left as the PMIC powers it up; no bank supply in the kernel dts and no fixed rail in either Radxa file; mode not written by us; source: kernel/post-patch-facts.txt", PD = "left as the PMIC powers it up; no bank supply in the kernel dts and no fixed rail in either Radxa file; mode not written by us; source: kernel/post-patch-facts.txt", PE = "left as the PMIC powers it up; no bank supply in the kernel dts and no fixed rail in either Radxa file; mode not written by us; source: kernel/post-patch-facts.txt", PF = "1.8V to 3.3V (pin-controller power-source select; the SD driver switches the slot's IO between vqmmc18sw = cldo5 and vqmmc33sw = dc1sw2, linux-6.6 lines 920-923)", PG = "left as the PMIC powers it up; no bank supply in the kernel dts and no fixed rail in either Radxa file; mode not written by us; source: kernel/post-patch-facts.txt", PH = "left as the PMIC powers it up; no bank supply in the kernel dts and no fixed rail in either Radxa file; mode not written by us; source: kernel/post-patch-facts.txt", PI = "UNSTATED: REFUSED, no pio reference can be checked without the Radxa SoC dtsi (pin groups are named there)", PJ = "left as the PMIC powers it up; no bank supply in the kernel dts and no fixed rail in either Radxa file; mode not written by us; source: kernel/post-patch-facts.txt", PK = "left as the PMIC powers it up; no bank supply in the kernel dts and no fixed rail in either Radxa file; mode not written by us; source: kernel/post-patch-facts.txt", PL = "left as the PMIC powers it up; no bank supply in the kernel dts and no fixed rail in either Radxa file; mode not written by us; source: kernel/post-patch-facts.txt", PM = "left as the PMIC powers it up; no bank supply in the kernel dts and no fixed rail in either Radxa file; mode not written by us; source: kernel/post-patch-facts.txt" }
bank_checks = { PA = "zero-pins", PB = "unsupplied", PC = "unsupplied", PD = "unsupplied", PE = "unsupplied", PG = "unsupplied", PH = "unsupplied", PJ = "unsupplied", PK = "unsupplied", PL = "unsupplied", PM = "unsupplied" }
switched_by = "PF: the SD driver's IO-voltage switch (vqmmc18sw = cldo5, vqmmc33sw = dc1sw2; linux-6.6 lines 920-923), and the pin controller's power-source select"
