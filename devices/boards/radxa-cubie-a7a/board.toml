# Radxa Cubie A7A (Allwinner A733, sun60i family). BENCH CANDIDATE, UNTESTED, NEVER BOOTED. Bench image only: the
# closed DRAM blob (ddr.bin, family.toml LICENCE) is in the bootloader; nothing is published.
# Only what differs from the family is kept here. No per-board code: the family is shared.
version = 1
extends = "../../families/sun60i/family.toml"
name = "radxa-cubie-a7a"
description = "Radxa Cubie A7A (Allwinner A733), bench candidate: kernel dts and the vendor U-Boot defconfig. UNTESTED, never booted."

# USB-C (the only Type-C port on the A7A; Radxa's hardware-use/usb-type-c page: "Supports 5V power input", "Supports USB OTG (USB0 port)"): the DEVICE port, the 5 V input.
# The A7A U-Boot dts (9da4b3e8) gives usb0 VBUS the fixed 5 V rail (reg_vcc5v), not a GPIO-switched one; the USB1 PHY has the switched PL2 rail.

# Kernel device tree: an authored candidate (patches/linux, 0001), UNVERIFIED. The name is ours, not Radxa's.
[kernel]
device_tree = "allwinner/sun60i-a733-cubie-a7a"
cmdline = "console=ttyS0,115200"
# The family's series patches, then this board's dts patch (an own patch dir beside this file). Each names its source.
patches = [{ source = "a733-kernel-series", path = "patches" }, { file = "patches/linux" }]

[descriptions]
lemnos = "lemnos-board.toml"

# U-Boot: the vendor defconfig in radxa/u-boot 9da4b3e8 (A7A) or this repo's patch (A7Z, patches/u-boot, UNVERIFIED).
[bootloader]
defconfig = "radxa-cubie-a7a_defconfig"


[bootloader.blobs]
SUNXI_LIBDRAM = { source = "dlan17-pkg", path = "awbin/a733/ddr.bin" }

# Partitions: the same layout as the A7S (family shape). Sizes are PLACEHOLDERS, not measured (see docs/prs/C1-cubie-a7s-bench.md, open items 1 and 4).
[[partitions]]
name = "u-boot"
role = "bootloader"
offset = "128K"
in_table = false
content = "u-boot-sunxi-with-spl.bin"

[[partitions]]
name = "uboot-env"
role = "raw"
type = "3de21764-95bd-54bd-a5c3-4abe786f38a8"
offset = "16M"
size = "128K"

[[partitions]]
name = "boot"
role = "boot"
type = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
size = "82837504"

[[partitions]]
name = "data"
role = "data"
type = "0fc63daf-8483-4772-8e79-3d69d8477de4"
size = "536870912"
