# Pad statement for the Luckfox Aura (sidecar, PADS rule). Revised 2026-11-16 from the vendor Aura SDK
# (Luckfox_Aura_SDK_202611.tar.gz, sha256 b9a95edbd9b17efef477509926874b498549e9df2712a2bcd6bb60d6b3283b2c;
# files verified against aura-files.sha256). Revs: kernel c67d457cf327 (6.1), U-Boot 649e8bd3474c,
# rkbin 094fb0b6. The SPL is a closed blob (rkbin rv1126b_spl_ipc_v1.05.bin), so what it programs is not
# visible in source and is NOT stated here.
version = 1
derived_from_board = "board.toml"
statement = "no pad/voltage table applied by the kernel dts or by U-Boot source"

[source]
kind = "vendor-sdk"
archive_sha256 = "b9a95edbd9b17efef477509926874b498549e9df2712a2bcd6bb60d6b3283b2c"
kernel_dts = "aura/kernel-dts/rv1126b-luckfox-aura.dtsi"
kernel_dts_sha256 = "see aura-files.sha256"
uboot_source = "aura/uboot/rv1126b.c"

# What the sources say about IO voltage selection:
#   U-Boot rv1126b.c:85-86 defines GPIO1_IOC_IO1_VSEL (0x908) and VCCIO1_VD_3V3 (BIT 15).
#   U-Boot rv1126b.c:510-511 READS that bit to pick the FSPI drive strength (3.3 V: level 4; else level 3).
#   U-Boot rv1126b.c has no write to any *_vsel register. ioc_rv1126b.h:44-443 declares the io_vsel registers
#   (0x0900-0x0920) and nothing writes them.
#   The kernel dts has no io-domain node and no voltage table (grep of the SDK's kernel-dts: none).

[banks]
# Stated only where the vendor dtsi gives the supply of a bank's pins.
[banks.gpio2]
pins = "sdmmc0 data, command and clock: <2 RK_PA0>..<2 RK_PA5> (rv1126b-pinctrl.dtsi sdmmc0_bus4/clk/cmd, bank 2)"
supply = "vccio_sd"
voltage_v = 3.3
basis = "vqmmc-supply = <&vccio_sd> on &sdmmc0 (rv1126b-luckfox-aura.dts:88-89); vccio_sd is a fixed 3.3 V regulator (rv1126b-luckfox-aura.dtsi:111-120), vin-supply vcc3v3_sys"
upstream = "vcc3v3_sys = RK801 DCDC_REG2, 3.3 V (rv1126b-luckfox-aura.dtsi:381-393)"

# Not stated (the vendor dtsi gives no supply for these; the image is refused until stated):
#   GPIO0 (sdmmc0_detn, sdmmc0_pwren, PMIC pins, the USB and host enables), GPIO1, GPIO3, GPIO4-GPIO7 (incl. the
#   GMAC pins on GPIO6 and the eth_clk output on GPIO6), the FSPI and the emmc (not used in this image).
#   The PHY I/O rail VCCIO_PHY1 (schematic ETHER sheet; no vendor dtsi regulator for it).
#   saradc0 vref is vcc_1v8 (rv1126b-luckfox-aura.dtsi:458): an analog reference, not a bank supply, so not a bank entry.

[io_domains]
# (empty: the vendor kernel dts has no io-domain node and U-Boot writes no VSEL register)
