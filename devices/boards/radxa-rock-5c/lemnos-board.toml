[board]
id = "radxa-rock-5c"

# The ROCK 5C's Lemnos board file for the bench slot image (R1): the USB device port (the upper USB 3.0 Type-A, DRD0), the
# identity, the hardware watchdog, the reboot and the U-Boot slot record (record = "uboot", Lemnos BB1b). Installed by
# rock-5c-bench as /etc/lemnos/board.toml (through the board's [descriptions]). Not the whole board file: the buses, the fan
# and the other devices are not written here. Untested on board.
#
# Sources (every fact says its source; DERIVED = read from a file, not run; UNVERIFIED = no source read here):
# - Lemnos socs/rk3588.toml at pr/BB1b 31e0f736 (the pin the ZERO 3E uses; Lemnos is the file's owner):
#   [controllers.usb-otg0] (path /usb@fc000000, sysfs fc000000.usb, usb-peripheral; USB 2 PHY 0 and USBDP PHY 0 as needs),
#   [controllers.watchdog] (/watchdog@feaf0000, rockchip,rk3588-wdt). Both DERIVED from Lemnos's v6.12 base read.
# - Lemnos rk3566-slots.toml form (testing/boards/rk3566-slots.toml at 31e0f736), the RK3588 values as below.
# - The U-Boot mmc order (SD = mmc 1): research/radxa-u-boot dts/upstream/src/arm64/rockchip/rk3588s-rock-5c.dts lines 20-21
#   (mmc0 = &sdhci, the eMMC; mmc1 = &sdmmc, the microSD, at rk3588-base.dtsi:2200 /mmc@fe2c0000). That is the Radxa U-Boot copy on
#   disk, not U-Boot v2026.10: UNVERIFIED for v2026.10. CONFIG_ENV_MMC_DEVICE_INDEX=1 in the family fragment is the same value.
#
# THE USB PORT (R1; coordinator ruling 2026-11-14): the upper USB 3.0 Type-A port is the bench's gadget port, an A-to-A cable
# to the PC, power over the USB-C. Its VBUS is switched by load switch U9 (SY6280AAC), enabled by GPIO0 PD4 (line 28),
# citing Radxa ROCK 5C V2.10 schematic sheets 5 and 14 (PDF not re-read; record: docs/prs/B21.md on origin/pr/A16 9174ecd6).
# The hold: the U-Boot gpio-hog (assets/patches/u-boot) and the kernel's phy-supply removal (assets/dts) are the boot-time
# parts; see docs/prs/R1-rock-5c-bench.md, "VBUS: the hold". Lemnos's own boot hold (Q2g) is not merged.

# The identity: the board's serial from the device tree (the Raze's way; docs/identity.md). name and revision are the board's own facts.
[[devices]]
id = "identity"
driver = "system-identity"
config = { serial = "device-tree", name = "Radxa ROCK 5C", revision = "bench" }

[boot]
# The payload bays of the U-Boot form (Lemnos docs/slots.md "the boot partition"). The sizes are the ZERO 3E's (Z2) and are
# UNVERIFIED for this board: Gaia's boot-report gives the fit on the first build, and a larger payload is refused by name.
bay_kernel_bytes = 33554432
bay_initramfs_bytes = 1048576
bay_device_tree_bytes = 262144
bay_cmdline_bytes = 4096
bay_overlay_bytes = 16384

# The hardware the devices use: the watchdog (socs/rk3588.toml [controllers.watchdog], /watchdog@feaf0000).
[[hardware]]
controller = "watchdog"

# The USB device port (DRD0, the upper USB 3.0 Type-A). vbus names the VBUS line this board switches: GPIO0 PD4 = gpio0 line 28;
# vbus_off = "low": driving it low switches the load switch off (the enable is active-high, rk3588s-rock-5c.dts
# vcc5v0_usb_otg0). options "usb3": the port's SuperSpeed lanes are wired to J4 (schematic sheet 14, DERIVED from the
# schematic text in B21; the DP lane sharing is a PHY mode choice, not checked on a board).
# No base: the map's usb-gpio-vbus base is GPIO4 line 11 (a different line), so naming it would be refused.
[[hardware]]
name = "udc:fc000000.usb"
controller = "usb-otg0"
role = "peripheral"
options = ["usb3"]
vbus = "gpio:gpio0:28"
vbus_off = "low"
vbus_reason = "the upper USB 3.0 port's 5 V (VCC5V0_USB_OTG0) is the output of load switch U9 (SY6280AAC), enabled by GPIO0 PD4 (line 28) through R82 (1K); low is off. Radxa ROCK 5C V2.10 schematic sheets 5 and 14 (PDF not re-read; record B21, 9174ecd6). R83 (EN pull-down) is NC: the EN floats until PD4 is driven."

# The system: identity, the slot store (the U-Boot record), reboot and the watchdog.
[[devices]]
id = "reboot"
driver = "system-reboot"

[[devices]]
id = "watchdog"
driver = "hw-watchdog"
keepalive = true
uses = { watchdog = "watchdog:/watchdog@feaf0000" }
config = { timeout_s = 15 }

# keep = 2 and reserve_mb = 128 (MiB) are set here, with the arithmetic in board.toml [[partitions]] data.
# grow_data = false: GPT: Lemnos's grow is MBR-only until Lemnos GROW; stops its 8 s refusal loop; remove when Lemnos says.
#   (Key: drivers/system-slots/src/lib.rs:1344 at Lemnos 31e0f736; the switch is read at :1666; grow.rs:61.)
# The slots: the boot partition holds the bays (FAT), the data partition the slot file (/data). record = "uboot": U-Boot's own
# redundant environment (the GPT partition of type 3de21764..., 128 KiB, copies of uboot_env_size 0x10000) holds the record.
# The SD is U-Boot's mmc 1 (uboot_env_mmc_index = 1). boot_sources names the SD controller's device-tree path (sdmmc, /mmc@fe2c0000).
[[devices]]
id = "slots"
driver = "system-slots"
config = { data = "/data", boot = "/boot", record = "uboot", boot_args = "os", boot_sources = ["/mmc@fe2c0000=/mmc@fe2c0000"], uboot_env_size = 0x10000, uboot_env_mmc_index = 1, uboot_usb_vendor = 0x1209, uboot_usb_product = 0x0001, keep = 2, reserve_mb = 128, grow_data = false }

# The gadget (Lemnos usb-gadget): the default composition (the orion link, NCM derived from the board serial, one ACM console) on
# the port above; the NCM interface is lemnos<N>, addressed by the lemnos0-addressing component (serial-hash-v1).
[[devices]]
id = "gadget"
driver = "usb-gadget"
uses = { function = "udc:fc000000.usb" }
config = { vendor = 0x1d6b, product = 0x0104, identity = "identity" }

# The security switch OFF: no record is kept, Orion does not ship here, so nothing is authenticated (docs/slots.md).
[security]
record = "/var/lib/lemnos/security.rec"
orion = false
