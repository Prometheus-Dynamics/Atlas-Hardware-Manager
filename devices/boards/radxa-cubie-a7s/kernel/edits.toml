[[edit]]
id = "E8"
file = "arch/arm64/boot/dts/allwinner/sun60i-a733-cubie-a7s.dts"
node = "&pio vcc-pd-supply, vcc-pj-supply"
series = "a733-a7s-bank-supplies/arm64-dts-allwinner-a733-cubie-a7s-add-the-pin-bank-supplies.patch:38 (vcc-pd-supply = <&reg_swout1>); a733-a7s-bank-supplies-2/...add-the-remaining-pin-bank-supplies.patch:50 (vcc-pj-supply = <&reg_swout1>)"
maker = "Radxa U-Boot 9da4b3e8 dts:185-190 (bldo2 named vcc-pd, always-on 1.8V); schematic sheet 4 puts VCC-PD and VCC-PJ on the BLDO2 bus; schematic sheet 7 R251 puts VCC-PD on VCC33-LCD (SWOUT1). Radxa's own files name no vcc-pd or vcc-pj supply in the kernel dts (RK6, RK5 grep)"
change = "both lines removed from &pio. Banks PD and PJ then have no supply: the driver's request path finds the dummy regulator (drivers/regulator/core.c:2453-2458, full constraints), reads 0 V and writes nothing (pinctrl-sunxi.c:870-871)"
reason = "the sources conflict on the rail (BLDO2 or SWOUT1), so neither may be named as the bank's supply in our dts. Statements for PD and PJ are then 'left as the PMIC powers it up', checked mechanically (kernel/post-patch-facts.txt)"
