maker = "Radxa 7b63c9ec board.dts:1280-1288: range 1000000-3800000, boot-on and always-on. Radxa U-Boot 9da4b3e8 sun60i-a733-cubie-a7s.dts:151-156: range 1000000-3400000, always-on"
change = "min = 1000000, max = 3400000 (the intersection of both maker ranges, the narrower upper bound); regulator-boot-on added"
