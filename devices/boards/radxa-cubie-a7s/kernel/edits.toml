# Recorded edits to the DockSeed A7S series (fe0a8ed, 379 patches, applied in patches/series order), applied AFTER the series
# by kernel/a7s-rails.patch. Each entry: the series' change, the board maker's source (Radxa allwinner-device 7b63c9ec, and
# Radxa U-Boot 9da4b3e8), and what this edit does. Reason: the series pins PMIC rails to fixed voltages that no Radxa file
# programs in the kernel. Facts only; the voltages are the board maker's, not measured (see docs/research/a7s-rail-voltages.md).
# Line numbers are into the post-series dts rebuilt from the series (dts-series, 680 lines) and the Radxa files at the commits named.
#
# FOR GAIA's unprogrammed_rails CHECK, to be added when Gaia's rev with the key is pinned (NOT in board.toml yet: the pinned Gaia
# would refuse the unknown key). Node names as they appear under the PMIC in the BUILT kernel dtb:
#   unprogrammed_rails = ["aldo1", "bldo1", "dcdc1", "dcdc4"]
# (cldo5 stays a fixed 1.8 V and is not listed. dcdc3 and dcdc5 are ranges in the series and are unchanged.)

[[edit]]
id = "E1"
file = "arch/arm64/boot/dts/allwinner/sun60i-a733-cubie-a7s.dts"
node = "aldo1"          # reg_aldo1, regulator-name "vcc-pl" (banks PL, PG and PM; r_pio vcc-pm-supply)
series = "a733-eeprom-a7s/arm64-dts-allwinner-a733-cubie-a7s-describe-aldo1-as.patch:61-66: min = max = 3300000, always-on"
maker = "Radxa 7b63c9ec configs/cubie_a7s/linux-6.6/board.dts:1369-1375: range 500000-3400000, boot-on and always-on, no value. Radxa U-Boot 9da4b3e8 arch/arm/dts/sun60i-a733-cubie-a7s.dts:172-176: 1800000 fixed, NO always-on or boot-on, and no consumer, so U-Boot does not program it (drivers/power/regulator/regulator-uclass.c: autoset only for boot-on/always-on or a probing consumer)"
change = "min = 500000, max = 3400000 (the kernel dts range); regulator-boot-on added; always-on kept"
reason = "the series' 3.3 V is not the maker's value; nothing in the maker's files fixes ALDO1"

[[edit]]
