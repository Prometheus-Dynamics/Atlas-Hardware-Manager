[[edit]]
id = "E3"
file = "arch/arm64/boot/dts/allwinner/sun60i-a733-cubie-a7s.dts"
node = "bldo1"         # reg_bldo1, regulator-name "vcc-pe-pk-mcsi" (banks PE and PK, VCC-MCSI)
series = "a733-a7s-bank-supplies-2/arm64-dts-allwinner-a733-cubie-a7s-add-the-remaining-pin-bank-supplies.patch:102-105: min = max = 1800000, always-on"
maker = "Radxa U-Boot 9da4b3e8 sun60i-a733-cubie-a7s.dts:178-183: 1800000 fixed, always-on: U-Boot PROGRAMS it to 1.8 V at probe (regulator-uclass.c: AUTOSET_UV path). Radxa 7b63c9ec board.dts:1407-1412: range 500000-3400000, no always-on. The schematic (sheet 4) names the net VCC-PE from BLDO1 with no voltage"
change = "min = 500000, max = 3400000; always-on kept. The 1.8 V is then the BOOTLOADER's value (U-Boot), not the kernel's"
reason = "the kernel fixed value is the bootloader's to set; the kernel must not write it. The bank mode for PE and PK is no longer written by the driver (E5)"

[[edit]]
id = "E4"
file = "arch/arm64/boot/dts/allwinner/sun60i-a733-cubie-a7s.dts"
node = "dcdc4"         # reg_dcdc4, regulator-name "vdd-gpu"; the GPU's gpu-supply (series a733-gpu/...enable-the-gpu.patch:68-)
series = "a733-gpu/arm64-dts-allwinner-a733-cubie-a7s-enable-the-gpu.patch:68-: min = max = 960000 (\"fixed at the 1008 MHz operating point\"), always-on"
maker = "Radxa 7b63c9ec board.dts:1307-1313: range 500000-1540000, boot-on and always-on; board.dts:1956-1957 &gpu { gpu-supply = <&reg_dcdc4>; } (no OPP in the board dts; Radxa's A733 SoC dtsi is not on disk, so its GPU OPP table is UNVERIFIED). Radxa U-Boot 9da4b3e8: no dcdc4 node"
change = "min = 500000, max = 1540000 (the kernel dts range); regulator-boot-on added"
reason = "GPU CASE (coordinator's rule 3, case 1): the consumer exists in our dts (&gpu gpu-supply = dcdc4, series dts:347, GPU enabled status okay) and the operating point exists in our SoC dtsi (sun60i-a733.dtsi:379-385, opp-1008000000 at opp-microvolt 960000, operating-points-v2 on the GPU node). The GPU driver scales the supply to the OPP's 960 mV when it runs, so the voltage is set by the GPU's OPP path and not by a probe-time fixed value. Radxa has a range and the same consumer, so the range is the maker's form. dcdc4 stays in the unprogrammed_rails list: it must remain a range, and the 960 mV comes from the OPP when the GPU runs."

[[edit]]
id = "E5"
file = "drivers/pinctrl/sunxi/pinctrl-sun60i-a733.c"
node = "a733_pinctrl_data.io_bias_banks"
series = "a733-pinctrl-pow-mod-sel-2bit/pinctrl-sunxi-a733-set-the-withstand-voltage-of-the-banks-with-a-supply.patch:+ (io_bias_banks = BIT(2) BIT(3) BIT(4) BIT(6) BIT(7) BIT(9) BIT(10): PC PD PE PG PH PJ PK)"
change = "io_bias_banks = BIT(2) | BIT(7): only PC and PH keep a driver-written withstand mode. PD (BIT 3), PE (BIT 4), PG (BIT 6), PJ (BIT 9) and PK (BIT 10) are removed from the driver's programmed set"
reason = "the 2-bit variant writes 11 (1.8 V) when regulator_get_voltage() of the bank supply reads <= 1.8 V (series pinctrl-sunxi.c hunk, the sunxi_pinctrl_set_io_bias_cfg 2BIT case; the read-back of a rail the maker leaves unprogrammed is a power-up value, and the schematic does not settle PD or PJ). A bank out of the set keeps the mode the SoC sets: U-Boot SPL gpio_init copies POW_MOD_VAL into POW_MOD_SEL (arch/arm/mach-sunxi/board.c:204-207, MACH_SUN60I_A733 selects SUNXI_GEN_NCAT2). The series' own reset value 0x022aaaa0 is 3.3 V for every bank (commit text)"

[[edit]]
