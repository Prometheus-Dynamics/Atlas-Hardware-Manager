maker = "Radxa U-Boot 9da4b3e8 arch/arm/dts/sun60i-a733-cubie-a7s.dts:240-244 (1.8 V fixed; programmed when its consumer probes: mmc2 vmmc-supply, line 73); Radxa 7b63c9ec board.dts:1465-1471 range. Schematic sheet 4 annotates VCC-PC from CLDO5 as 1.8 V; sheet 9 ties eMMC VCCQ1-5 to VCC-PC"
change = "none. The fixed 1.8 V is kept because the schematic's consumers prove it (sheet 4 annotation and the eMMC VCCQ), and the series tested PC in 1.8 V mode on the A7S"
reason = "the ruling: a fixed voltage stays only where the schematic's consumers prove it"

[[edit]]
