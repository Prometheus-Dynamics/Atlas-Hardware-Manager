# Pad-table statement for the Cubie A7S (read by scripts/check-devices.sh pads_rule; Gaia does not read this file).
# soc = "a733": the banks PA PB PC PD PE PF PG PH PI PJ PK PL PM (family sun60i, [banks.a733]).
#
# SOURCES (all read from disk; no board was touched):
#   S   = DockSeed A7S series fe0a8ed, /mnt/ssd-samsung/gaia/bsp/a733/a7s-linux-mainline/patches (the patch files cited below)
#   RK  = Radxa allwinner-device 7b63c9ec, configs/cubie_a7s/linux-6.6/board.dts (kernel)
#   RU  = Radxa U-Boot 9da4b3e8, research/radxa-u-boot/arch/arm/dts/sun60i-a733-cubie-a7s.dts (the bootloader our image builds)
#   Sch = schematic V1.10 (dl-a7s-schematic/radxa_cubie_a7s_schematic_v1.10.pdf), sheets 4, 7, 9
# The correcting kernel patch (kernel/a7s-rails.patch, recorded edits in kernel/edits.toml) is applied AFTER S. It makes the
# rails below that no maker file programs into ranges, so the kernel does not write them. PMIC facts: docs/research/a7s-rail-voltages.md.
soc = "a733"
source = "DockSeed A7S series fe0a8ed (patches cited per bank), Radxa U-Boot dts 9da4b3e8, Radxa kernel dts 7b63c9ec, schematic V1.10 sheets 4, 7 and 9"
derived_from_board = ""
# The correcting patch, relative to this directory. The check reads its post-image: a rail named in bank_rails must be a range.
correction = "kernel/a7s-rails.patch"
# The rail each bank's supply is (for the two rail statement forms). Only a rail the patch leaves a range can be named.
bank_rails = { PE = "bldo1", PG = "aldo1", PK = "bldo1", PL = "aldo1", PM = "aldo1" }
# Per bank:
#  PA  no pins: the series' pinctrl-sun60i-a733.c gives PA 0 pins (a733_nr_bank_pins, first entry).
#  PB  3.3V: SWOUT2 (Sch sheet 4 net VCC-IO; RU swout2 3.3 V fixed, always-on, dts:165-170). The kernel does not write PB's mode.
#  PC  1.8V: CLDO5 (Sch sheet 4 annotation 1.8V; sheet 9 eMMC VCCQ = VCC-PC; RU cldo5 1.8 V fixed, dts:240-244). Kernel keeps it fixed (edits E6).
#      The driver writes 11 (1.8 V mode) from the read-back, tested on the A7S by S (eMMC HS400, commit text).
#  PD  UNSTATED, REFUSED: S says VCC-PD is SWOUT1 (3.3 V, via R251); RU names BLDO2 1.8 V as "vcc-pd"; Sch sheet 4 labels the BLDO2
#      bus VCC-PD. Two drivers under one net name. Not settled by any source.
#  PE  set by the bootloader: RU bldo1 "vcc-pe" 1.8 V fixed, always-on (dts:178-183). RU's U-Boot programs it at probe (regulator-uclass.c).
#      The kernel does not write it (edits E3; the driver no longer writes PE's mode, E5). Sch: VCC-PE from BLDO1, no voltage annotated.
#  PF  a range switched by the pin controller's power-source bit (S, a733-a7s-bank-supplies-2 PF comment and sunxi-pinctrl-power-source).
#  PG  left as the PMIC powers it up: rail ALDO1 (S vcc-pg-supply; Sch sheet 7 net VCC-PL via RA3). Neither RU nor RK programs ALDO1
#      (RU aldo1 has no always-on and no consumer; RK gives a range). The rail's value is the PMIC's power-up value, UNVERIFIED.
#  PH  3.3V: SWOUT2 (Sch sheet 4 VCC-PH from SWOUT2; sheet 7 ball VCC-PH; RU swout2 3.3 V). The driver writes 10 (3.3 V mode) from the switch.
#  PI  UNSTATED, REFUSED: no supply in any source. S's table gives PI 17 pins and no PI field; no PI pad name in the schematic text layer.
#  PJ  UNSTATED, REFUSED: S says PJ runs from SWOUT1 (3.3 V); Sch sheet 4 puts VCC-PJ on BLDO2 (1.8 V); sheet 7 names the ball VCC33-LCD.
#  PK  set by the bootloader: RU bldo1 1.8 V fixed (as PE). Edits E3, E5.
#  PL  left as the PMIC powers it up: rail ALDO1 (Sch sheet 7 ball 1M23 VCC-PL; S r_pio has no vcc-pl-supply). As PG, not programmed.
#  PM  left as the PMIC powers it up: rail ALDO1 via RA13 (Sch sheet 7) or CLDO1 (Sch sheet 4 label; RU cldo1 1.8 V fixed, NOT always-on,
#      no consumer, so RU does not program it). S: vcc-pm-supply = aldo1 (r_pio). Not programmed by the bootloader or kernel either way.
bank_voltages = { PA = "no pads: series pinctrl-sun60i-a733.c a733_nr_bank_pins gives 0 pins", PB = "3.3V", PC = "1.8V", PD = "UNSTATED: REFUSED, SWOUT1 3.3 V or BLDO2 1.8 V, unresolved", PE = "set by the bootloader u-boot@9da4b3e8 to 1.8V per arch/arm/dts/sun60i-a733-cubie-a7s.dts:178-183; not re-programmed by the kernel", PF = "1.8V to 3.3V (pin-controller power-source select; reset to 3.3V VCC-IO)", PG = "left as the PMIC powers it up; not programmed by our bootloader or kernel; source: Radxa allwinner-device 7b63c9ec configs/cubie_a7s/linux-6.6/board.dts line 1369", PH = "3.3V", PI = "UNSTATED: REFUSED, no supply in any source", PJ = "UNSTATED: REFUSED, SWOUT1 3.3 V or BLDO2 1.8 V, unresolved", PK = "set by the bootloader u-boot@9da4b3e8 to 1.8V per arch/arm/dts/sun60i-a733-cubie-a7s.dts:178-183; not re-programmed by the kernel", PL = "left as the PMIC powers it up; not programmed by our bootloader or kernel; source: Radxa allwinner-device 7b63c9ec configs/cubie_a7s/linux-6.6/board.dts line 1369", PM = "left as the PMIC powers it up; not programmed by our bootloader or kernel; source: Radxa allwinner-device 7b63c9ec configs/cubie_a7s/linux-6.6/board.dts line 1369" }
switched_by = "PF: the pin controller's power-source select (DockSeed series, a733-a7s-bank-supplies-2 patch, the PF comment), 1.8V (CLDO5, VCC18-PF) or 3.3V (SWOUT2, VCC-IO) after reset"
