# Radxa Cubie A7S on the Allwinner A733 (sun60i) family. CANDIDATE, UNVERIFIED, NEVER BOOTED.
# Only what differs from the family is kept here. The A7S is the one A733 board with a kernel device
# tree in a public source (DockSeed's series, on Linux 7.3.4 with the family's pins).
version = 1
extends = "../../families/sun60i/family.toml"
name = "radxa-cubie-a7s"
description = "Radxa Cubie A7S (Allwinner A733), candidate sources, untested on board"

# Kernel device tree: the A7S board dts of DockSeed's series (the name in the upstream posting of 2026-06-13).
# The series' dts carries the board's LEDs (gpio-leds: power on PM2 green, status on PJ26 blue, no trigger) and
# the USB-C ports (see the notes below). candidate, UNVERIFIED.
[kernel]
device_tree = "allwinner/sun60i-a733-cubie-a7s"

# U-Boot defconfig: radxa-cubie-a7s_defconfig in radxa/u-boot @ 9da4b3e8 (its CONFIG_DEFAULT_DEVICE_TREE is
# sun60i-a733-cubie-a7s). UNVERIFIED, never booted.
[bootloader]
defconfig = "radxa-cubie-a7s_defconfig"

# The vendor DRAM init, built into the SPL. Its file is awbin/a733/ddr.bin in radxa-pkg/u-boot-dlan17 @ b1cec0a9
# (sha256 d89804f4...). Known to boot this board: NO (never booted). CLOSED vendor code: see the family's LICENCE
# note. Not published in any image. F8? the key form.
[bootloader.blobs]
SUNXI_LIBDRAM = { source = "dlan17-pkg", path = "awbin/a733/ddr.bin" }

# Ports (Radxa's interface page and DockSeed's series, read 2026-11-13):
#   USB-C 1 (Radxa: "USB 2.0, 5V power input and OTG"): the DEVICE-CAPABLE port. In DockSeed's dts it is the
#     "J16" 5 V input, on the MUSB controller usb_otg (PHY index 0), with dr_mode "peripheral" in its gadget patch.
#     It has NO VBUS regulator: the PHY's VBUS supply is named per index (usb0_vbus for PHY 0, phy-sun4i-usb.c:819),
#     and the dts sets only usb1_vbus. So device mode on this port sources no 5 V. The GMAC's phy-supply is its own
#     PHY rail, not USB. Evidence: compiled dtb of the bring-up board (B19), usb@4100000 dr_mode peripheral, no supply.
#   USB-C 2 (Radxa: "USB 3.2, DisplayPort Alt Mode and OTG"): the "J4" host port on the USB 3 controller, sourcing
#     VBUS from DRVVBUS (PL2) through its own regulator (usbc-vbus). Host only in DockSeed's dts. Not a device port.
#   USB Type-A (host). Not device.
# The J16/J4 labels are DockSeed's; the match to Radxa's "USB-C 1" and "USB-C 2" is by function (5 V input and
# OTG on USB 2; USB 3 and DisplayPort). The schematic was NOT read. OPEN: the schematic's port names (Radxa A7S
# schematic, the USB-C page) to confirm the match. Nothing here is a board run.
#
# Ethernet: the gigabit GMAC (gmac210, its PHY is named MAE0621A-Q3C in B12's notes), built in by the family fragment.
#
# LED: the blue status LED is PJ26 (the series' gpio-leds; "PJ26" is in its comment). Radxa's page says it blinks
# during a normal boot. The bring-up board's dts sets it to the heartbeat trigger (pending/cubie-a7-bringup/board).
