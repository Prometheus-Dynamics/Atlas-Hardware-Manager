# Raze: Raspberry Pi CM5 with an OV9782 global-shutter camera, a 16 GB eMMC (written over USB boot).
# Board fact: keeps pstore: required. There is no wired console until Gaia can mask a unit, so the kernel
# log of an early boot and the previous boot's log live in pstore (ramoops-pi5 overlay, boot/raze-device.txt;
# PSTORE, PSTORE_RAM, PSTORE_CONSOLE, PSTORE_PMSG built in, raze.config).
# Extends the BCM2712 family and keeps what the Raze adds: its kernel fragments, the eMMC disk and
# the USB-boot flasher. The Raze's overlays are pending Lemnos's minimal list (PR text). Ported from
# dev devices/raze/gaia. Untested on board.
version = 1
extends = "../../families/bcm2712/family.toml"
name = "raze"
description = "Raze (CM5 + OV9782): Raspberry Pi CM5 vision device"

# raze.config: the Raze's kernel decisions, each with its reason in the file. raze-trim.config is
# applied after it: the install-size trim.
# No device-tree overlay of ours. The board's devices (I2C, fan PWM, CSI receiver, USB device
# controller) come from ONE overlay Lemnos generates from the Lemnos board file: a placeholder until it
# exists (boards/raze/overlay/README.txt). The board has no fan control, I2C, camera receiver or USB
# gadget from the device tree until then. Provisional.
[kernel]
device_tree = "broadcom/bcm2712-rpi-cm5-cm5io"
# Lists replace the family's, so the family fragment is named here too (the flasher's built-in options).
# The in-tree device tree this board boots (PR B16). The kernel build makes it, from the same tree as the
# Image (raspberrypi/linux 53679a5), built with symbols (-@), so the generated overlay applies to it. The
# firmware package's dtbs (rpi-firmware) are NOT the ones booted: they come from another kernel build.
# bcm2712-rpi-cm5-cm5io: the CM5 with eMMC (the Raze's 16 GB eMMC), not the CM5 Lite (cm5l: no eMMC). Its
# sha256 is f773b476... on Raze #2, the bench dtb (checked: the dtb built from this tree matches it).
fragments = ["../../families/bcm2712/assets/linux.fragment", "kernel/raze.config", "kernel/raze-trim.config"]


# The eMMC: 30,535,680 sectors (14,910 MiB), the "16 GB" module. MBR, as the slot disk is.
[disk]
scheme = "mbr"
first = "1M"
alignment = "1M"
size = "14910M"

# Written over USB boot: the boot ROM takes the family's bootfiles and Atlas's loader writes the eMMC.
[flash]
methods = ["usb-boot"]

# The board's boot firmware: the Raspberry Pi boot ROM, which reads config.txt, default.txt and trial.txt from the
# boot partition and restarts into a slot by tryboot. Gaia reads it for the kernel contract (the mailbox and firmware
# drivers built in, families' kernel contract version 2) and the Lemnos board file's system-slots `record` must agree
# (scripts/check-devices.sh, firmware_rule: rpi-tryboot is record "tryboot"). PR B32.
[boot]
firmware = "rpi-tryboot"

# The Lemnos board file: lemnosd's /etc/lemnos/board.toml, written to Lemnos Q2d (lemnos-board.toml beside this
# file). raze-lemnos-board installs it by this name, and check-devices.sh requires it of every product that
# carries lemnosd.
[descriptions]
lemnos = "lemnos-board.toml"
