# Raze: Raspberry Pi CM5 with an OV9782 global-shutter camera, a 16 GB eMMC (written over USB boot).
# Board fact: keeps pstore: required. There is no wired console until Gaia can mask a unit, so the kernel
# log of an early boot and the previous boot's log live in pstore (ramoops-pi5 overlay, boot/raze-device.txt;
# PSTORE, PSTORE_RAM, PSTORE_CONSOLE built in, raze.config).
# Extends the BCM2712 family and keeps what the Raze adds: its kernel fragments, the eMMC disk and
# the USB-boot flasher, and the two firmware overlays its config.txt names ([kernel] overlays). Ported from
# dev devices/raze/gaia. Untested on board.
version = 1
extends = "../../families/bcm2712/family.toml"
name = "raze"
description = "Raze (CM5 + OV9782): Raspberry Pi CM5 vision device"

# raze.config: the Raze's kernel decisions, each with its reason in the file. raze-trim.config is
# applied after it: the install-size trim.
# No device-tree overlay of ours. The board's devices (I2C, fan PWM, CSI receiver, USB device
# controller) come from ONE overlay Lemnos generates from the Lemnos board file: a placeholder until it
# exists (boards/raze/overlay/README.txt). The board has no fan control, I2C, camera receiver or USB
# gadget from the device tree until then. Provisional.
[kernel]
# The Raze's kernel is built with LLVM (Gaia's [kernel] toolchain, coordinator's ruling 2026-11-18: on this board, not the
# bcm2712 family, until another board of the family needs it): lemnos.ko is Rust, and a Rust kernel is built with clang,
# the pinned LLVM 23.1.5, rustc 1.99.0 + rust-src and bindgen 0.73.2 (Gaia's pins = scripts/kernel-llvm-tools.sh's).
# scripts/check-kernel-fragments.sh resolves this board the same way.
toolchain = "llvm"
device_tree = "broadcom/bcm2712-rpi-cm5-cm5io"
# The kernel form the payload's `kernel` role takes (L2d): gzip, as the Pi firmware boots it (the 993 slot's kernel8.img
# is gzip and boots daily). The bay is sized for the stored file (lemnos-board.toml [boot] bay_kernel_bytes).
image = "Image.gz"
# The kernel command line's BASE words (L2d): the hash-table sizes dev measured on Raze #1 (docs/prs/B20.md, "Command
# line"). Gaia adds the generator's words, the components', the recipe's and the per-slot os.slot / os.roothash / os.data
# and panic=5 (the cmdline-slot words); a console= is NOT here (B20 and the coordinator's 6aebe13b ruling: no console
# until Gaia has the unit mask; kernel messages and pstore are the board's own way to read a boot).
cmdline = "dhash_entries=16384 ihash_entries=8192 thash_entries=4096 uhash_entries=1024"
# Lists replace the family's, so the family fragment is named here too (the flasher's built-in options).
# The in-tree device tree this board boots (PR B16). The kernel build makes it, from the same tree as the
# Image (raspberrypi/linux b005af66), built with symbols (-@), so the generated overlay applies to it. The
# firmware package's dtbs (rpi-firmware) are NOT the ones booted: they come from another kernel build.
# bcm2712-rpi-cm5-cm5io: the CM5 with eMMC (the Raze's 16 GB eMMC), not the CM5 Lite (cm5l: no eMMC). Its
# sha256 is f773b476... on Raze #2, the bench dtb (checked: the dtb built from this tree matches it).
fragments = ["../../families/bcm2712/assets/linux.fragment", "kernel/raze.config", "kernel/raze-trim.config"]
# The firmware overlays the Raze's config.txt names (raze-device.txt today, lemnos-board.toml [boot] once Lemnos's key
# lands with M36): ramoops-pi5 (pstore in RAM, the board's only early-boot log) and vc4-kms-v3d-pi5. Reason: the
# kernel build made no .dtbo, so the boot partition had neither and the firmware dropped both lines (M2 link 1's
# image gap). Built in-tree from the same tree as the dtb (Gaia emits BR2_LINUX_KERNEL_INTREE_DTSO_NAMES;
# arch/arm64/boot/dts/overlays links to arm's at b005af66), installed into device-trees, fed to Lemnos's
# boot-partition --firmware through Gaia's @firmware@.
overlays = ["overlays/ramoops-pi5", "overlays/vc4-kms-v3d-pi5", "overlays/bcm2712d0"]
# The firmware files each bay set carries (lemnos-board.toml [boot] firmware_files), built as device trees beside the
# board's own (Gaia 073a2f6e: no extension; the main tree stays first, the one Buildroot boots) into @firmware@.
extra_device_trees = ["overlays/overlay_map", "overlays/hat_map"]


# The eMMC: 30,535,680 sectors (14,910 MiB), the "16 GB" module. MBR, as the slot disk is.
[disk]
scheme = "mbr"
first = "1M"
alignment = "1M"
size = "14910M"

# The partitions, in table order (L2-partition-requirements 8.4; Gaia's image_disk reads [disk] and these).
# p1, the boot partition: FAT (MBR type 0x0c, FAT32 LBA, the type dev's slot disk used), which the boot ROM reads
# config.txt, the pointers and the slot bays from. Exactly the slot-boot product's `boot_size` (82,837,504 =
# 79 MiB, 8.4: three bay sets with a gzip kernel); check-devices requires the two to agree. Its content is
# `lemnos-ctl boot-partition`'s image.
# Not carried from dev: the MBR active flag (the Pi boot ROM finds the FAT partition without it, and Gaia's board
# schema has no such field) and dev's disk signature 0x5056525a (nothing names a partition by PARTUUID: the slot
# words name the eMMC by its device-tree path, os.src.rpi-boot-mode-1).
[[partitions]]
name = "boot"
role = "boot"
type = "0x0c"
size = "82837504"

# p2, the data partition: Linux (0x83), the slots and the slot state. The LAST partition. Its size is an explicit
# initial size (D1 ruling, 2026-11-14), not the content's: the installed first slot and the ext4 overhead, rounded UP
# to 1 MiB. 39,845,888 B = 38 MiB. There is NO room for a second slot here, on purpose: the grow covers it, and the
# live-install reserve (reserve_mb, lemnos-board.toml) is the rule for updates. Lemnos's offline writer checks only that
# the first slot fits (no reserve), and Lemnos grows p2 to the disk's end at the first start, before any update can
# happen (Lemnos M36b, its boot-side commits). If that grow fails, installs are refused with words.
# Arithmetic (each term from its source; blocks are 4,096 B, the mke2fs block):
#   installed slot, 34,578,432 B:
#     slots/<id>.erofs      27,058,176  the bundle's rootfs.erofs, verity appended (slot.json image.size; the 6,606 blocks exact)
#     slots/<id>.json           4,096  slot.json 967 B (its bundle entry), one block
#     slots/<id>.boot           4,096  the boot list: 483 B of `<sha256>  <path>` lines for the six boot files (sizes of the bundle)
#     slots/bootfiles/*     7,471,104  each boot file by content, rounded up: kernel8.img 6,773,269 -> 6,774,784;
#                                      initramfs.cpio 599,304 -> 602,112; board.dtb 79,751 -> 81,920; cmdline.txt 335 -> 4,096;
#                                      overlays/lemnos-board.dtbo 1,823 -> 4,096; slot.json 967 -> 4,096 (tar tvf of the bundle)
#     board/slots/*            24,576  six state files (state.env, state.json, X.meta, seq, fallbacks, resolved.env), one block each (upper bound)
#     directories              16,384  slots, slots/bootfiles, board, board/slots, one block each
#   root directory              4,096  (the filesystem's /)
#   ext4 overhead, measured (Gaia e9684c5 gaia.fs.ext4 options on a 38 MiB file, mke2fs 1.47.3, dumpe2fs; 37 MiB is refused):
#     lost+found             16,384  4 blocks (debugfs stat)
#     journal             4,194,304  Gaia's journal: clamp(size/64, 4..128 MiB) = 4 MiB (1,024 blocks)
#     inode table            28,672  112 inodes (paths*2+64 = 102, Gaia; the group rounds to 112): 7 blocks
#     superblock, GDT, 4 reserved GDT, 2 bitmaps (one group)   32,768  8 blocks
#     reserved blocks             0  -m 0 (Gaia)
#     residual               135,168  33 blocks, not itemised (directory and extent blocks; the same 33 as the 71 MiB run)
#   total needed: 34,578,432 + 4,096 + 16,384 + 4,194,304 + 28,672 + 32,768 + 135,168 = 38,989,824 B
#   the smallest size mke2fs accepts with those options is 38 MiB; it leaves 209 free blocks (856,064 B).
# Recompute from the M2 build's lzma root when that exists: the slot here is f8e7a2c6's, before B40's lzma settings
# (B40 measured an 18,178,048 B root, against 26,841,088 here; the verity tree is 217,088 B on top of either).
# The one place for this number: Gaia (498873cf) takes the size from this partition. The [generate.data] run's @data-size@
# and the ext4 are both this size; product.toml has no data_size, and check-devices has no rule for it.
[[partitions]]
name = "data"
role = "data"
type = "0x83"
size = "39845888"

# Written over USB boot: the boot ROM takes the family's bootfiles and Atlas's loader writes the eMMC.
[flash]
methods = ["usb-boot"]
# What the image is written to: the CM5's eMMC (Gaia's @medium@; slot.json's medium rides in pin move 2).
medium = "emmc"

# The board's boot firmware: the Raspberry Pi boot ROM, which reads config.txt, default.txt and trial.txt from the
# boot partition and restarts into a slot by tryboot. Gaia reads it for the kernel contract (the mailbox and firmware
# drivers built in, families' kernel contract version 2) and the Lemnos board file's system-slots `record` must agree
# (scripts/check-devices.sh, firmware_rule: rpi-tryboot is record "tryboot"). PR B32.
[boot]
firmware = "rpi-tryboot"

# The Lemnos board file: lemnosd's /etc/lemnos/board.toml, written to Lemnos Q2d (lemnos-board.toml beside this
# file). raze-lemnos-board installs it by this name, and check-devices.sh requires it of every product that
# carries lemnosd.
[descriptions]
lemnos = "lemnos-board.toml"
# The flasher's board file (products/flasher-bcm2712, D6): Lemnos bcm2712-flasher.toml with the Raze's id.
flasher-lemnos = "flasher-lemnos-board.toml"
