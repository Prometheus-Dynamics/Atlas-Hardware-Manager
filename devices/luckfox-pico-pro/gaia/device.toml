# Luckfox Pico Pro device support from Atlas: everything an OS imports, so a
# later addition here needs no change there. Import it from a source named
# `atlas`:
#
#   imports = [
#     { source = "atlas", path = "devices/luckfox-pico-pro/gaia/device.toml" },
#   ]
# Written from Atlas's contract; untested on a board.
config = 3
gaia_version = ">=2.0.0"

imports = ["../../families/rockchip-maskrom/gaia/rv1106-nand-slot.toml", "../../common/board-lite/gaia/armv7.toml"]

[inputs.board_lite_model]
description = "The model board-lite reports"
kind = "string"
default = "luckfox-pico-pro"
