# One Lemnos cargo package: lemnos-ctl, built from Lemnos next e9224a53 (BB1b; with Orion 8eaf3b8).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-ctl --profile service`.
version = 1
name = "lemnos-ctl"
description = "the Lemnos command-line client, lemnos-ctl (service profile; the board-file tool)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "e9224a5378f772bab4c4beee3703beee9dd8a166"  # Lemnos next (I5j merged, PR #371), the L2 rev for the Raze image

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-ctl"
profile = "service"

[[install]]
from = "bin/lemnos-ctl"
to = "/usr/bin/lemnos-ctl"
mode = "0755"
