# One Lemnos cargo package: lemnos-ctl, built from Lemnos next d6b9361d (the rev with Cargo.lock).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-ctl --profile service`.
version = 1
name = "lemnos-ctl"
description = "the Lemnos command-line client, lemnos-ctl (service profile; the board-file tool)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "7d7fababf43fa20a53a6eea2daf4bec209e78ad6"  # PLUMBING PIN (origin/pr/I5j, coordinator 2026-11-14): replaced by I5j's merged rev; never merged while it stands

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-ctl"
profile = "service"

[[install]]
from = "bin/lemnos-ctl"
to = "/usr/bin/lemnos-ctl"
mode = "0755"
