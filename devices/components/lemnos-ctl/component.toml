# One Lemnos cargo package: lemnos-ctl, built from Lemnos 7d91d645 (next head, OWNER-PROBE-ACCESS: the daemon's slot and security writes work under its real unit; coordinator 2026-11-21, F3-1).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-ctl --profile service`.
version = 1
name = "lemnos-ctl"
description = "the Lemnos command-line client, lemnos-ctl (service profile; the board-file tool)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "7b4fdb255826fe2c00caadd5716e807c31364b12"  # Lemnos 7b4fdb25 (next: everything of pr/RAZE2-PIOJMP-0d37 forward-ported, plus RESTART-UNIT, reboot_to, the count clear, call outcomes, the install split, grow in slot-init, per-board udev grants, JOB-RESULT and OUT-FORM), coordinator 2026-11-22, pin move 10

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-ctl"
profile = "service"

[[install]]
from = "bin/lemnos-ctl"
to = "/usr/bin/lemnos-ctl"
mode = "0755"
