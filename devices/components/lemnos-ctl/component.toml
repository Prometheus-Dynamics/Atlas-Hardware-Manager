# One Lemnos cargo package: lemnos-ctl, built from Lemnos b78e5317 (pr/ROUTE-A-WRITES-D1: b210934d, which is next c215f575 plus the RUNDIR fix, plus ROUTE-A-WRITES: route A writes nothing under the other system's /data/board/slots; coordinator 2026-11-20; with Orion 671d29d).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-ctl --profile service`.
version = 1
name = "lemnos-ctl"
description = "the Lemnos command-line client, lemnos-ctl (service profile; the board-file tool)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "b78e5317a3d7151f3e2e923041e7169e79b0ff08"  # Lemnos b78e5317 (pr/ROUTE-A-WRITES-D1: b210934d + ROUTE-A-WRITES), coordinator 2026-11-20

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-ctl"
profile = "service"

[[install]]
from = "bin/lemnos-ctl"
to = "/usr/bin/lemnos-ctl"
mode = "0755"
