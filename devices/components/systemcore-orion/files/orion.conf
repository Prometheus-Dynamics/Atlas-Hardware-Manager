# /etc/orion/orion.conf on the SystemCore: the settings both Orion services read
# (orion-comm and orion-node). Installed by the systemcore-orion component.
# Orion's own example is packaging/systemd/orion.conf.example at the pinned commit; this
# is that file with the peer port set, so Atlas can find the node by Identify.

# The port Orion answers peers on. Atlas's robot discovery connects here and asks Identify.
# Orion's documented default is 9200 (crates/client/connect DEFAULT_PORT). Once Atlas's
# catalog carries this value, Atlas reads it from there too: keep the two the same.
peer.listen = 0.0.0.0:9200

# Node logic runs as the orion user (uid 901, from orion.sysusers): let it in as node logic.
socket.node_uids = 901
