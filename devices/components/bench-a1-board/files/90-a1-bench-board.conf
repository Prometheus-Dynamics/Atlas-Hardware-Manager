# BENCH ONLY (components/bench-a1-board): lemnosd reads the A1 bench board file. The ExecStart line is Lemnos c215f575's
# packaging/systemd/lemnosd.service line with only --board changed (read by hand at c215f575, re-read at b210934d and b78e5317: unchanged; re-read it at every Lemnos pin move).
[Service]
ExecStart=
ExecStart=/usr/bin/lemnosd --board /etc/lemnos/board.A1-BENCH-grow-off.toml --user lemnos --group lemnos
