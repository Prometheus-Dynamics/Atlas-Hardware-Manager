# The ROCK 4D's extlinux.conf for U-Boot's distro boot: the root partition by
# its label, with the board's device tree. Bring-up form only. The console is
# UART0 at 1500000 (Gaia's ROCK 4D example, not checked on the board).
default rootfs
label rootfs
  kernel /boot/Image
  devicetree /boot/rk3576-rock-4d-loader.dtb
  append root=PARTLABEL=rootfs rootwait console=ttyS0,1500000 earlycon
