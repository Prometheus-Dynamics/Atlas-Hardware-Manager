# Atlas: the comm core's TCP way in on the board's own USB address (lemnos0-address writes ORION_PEER_LISTEN to
# /run/lemnos0/orion-peer.env at boot). Wants, not Requires: if the address program fails the comm core still starts
# and serves the USB link only. The leading "-" on EnvironmentFile: an absent file is not an error, it means no TCP
# way in. After: the bind follows the address program. Interim, with net.ipv4.ip_nonlocal_bind = 1 (raze-base-files
# 60-raze-lemnos0.conf): the bind may run before the address is up, because lemnosd builds the gadget later.
[Unit]
Wants=lemnos0-address.service
After=lemnos0-address.service

[Service]
EnvironmentFile=-/run/lemnos0/orion-peer.env
