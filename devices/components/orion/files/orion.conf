# /etc/orion/orion.conf on a board: Orion's packaging/systemd/orion.conf.example (c0187f4) with the state lines
# a board needs. Both services read it; ORION_* in the environment overrides a key.

# This board's name.
node.name = board

# Node logic runs as the orion user (uid 901): let it in as node logic.
socket.node_uids = 901

# The comm core's state (identity, trust store, SSH host key, saved time) is on the data partition. Orion's
# default is /var/lib/orion: /var is RAM on the bring-up layout and inside the slot root on a managed board, so
# a key there changes at a reflash or a slot change. The data partition is the same for every slot.
state.dir = /data/orion
# The node's identity and its trust file. Orion's default is <state.dir>; written out so that moving
# state.dir can never leave the keys behind inside a slot. Nothing is installed here by any image: the
# identity is made on the board at the first start, so no two boards share one.
keys.dir = /data/orion
# The SSH host key, named here (Orion's default is <state.dir>/ssh_host_ed25519_key, the same file).
ssh.host_key = /data/orion/ssh_host_ed25519_key

# The way in over SSH: off until the board's network is set (Orion's default is off).
# ssh.listen = 0.0.0.0:22

# Other nodes.
# peer.listen = 0.0.0.0:9200
# peer.connect = 192.168.1.20:9200

# Who may do what. Off: anyone who can reach the socket may do anything.
# security = on
