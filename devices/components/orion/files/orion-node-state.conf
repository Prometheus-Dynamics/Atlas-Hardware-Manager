# Atlas: node logic's state and the comm core's key on the data partition. Orion's unit (orion-node.service)
# sets both directories to /var/lib/orion (ORION_STATE_DIR, ORION_KEYS_DIR): this drop-in points them at
# /data, where orion.conf's state.dir puts the comm core's key. The environment lines later in the drop-in
# win over the unit's own.
# ProtectSystem=strict keeps /data read-only for this unit, so its own directory is listed as writable.
# It is made here first, as root (the + prefix), with the orion user as owner.
[Unit]
RequiresMountsFor=/data

[Service]
ExecStartPre=+/bin/sh -c 'install -d -m 0750 -o orion -g orion /data/orion/node'
Environment=ORION_STATE_DIR=/data/orion/node
Environment=ORION_KEYS_DIR=/data/orion
ReadWritePaths=/data/orion/node
