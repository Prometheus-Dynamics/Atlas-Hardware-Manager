# Atlas: the comm core's state on the data partition (orion.conf sets state.dir = /data/orion). Orion's unit
# (packaging/systemd/orion-comm.service) has no mount ordering for it: this drop-in adds it, so the comm core
# does not start before /data is mounted (a missing state directory ends in Orion's recovery mode).
# The directory is root's, group orion, so node logic (orion user) can read the keys in it.
[Unit]
RequiresMountsFor=/data

[Service]
ExecStartPre=/bin/sh -c 'install -d -m 0750 -o root -g orion /data/orion'
