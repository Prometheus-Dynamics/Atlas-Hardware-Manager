# Atlas: the comm core's state on the data partition. orion.conf sets state.dir = /data/orion (and keys.dir and
# ssh.host_key with it), so the comm core's identity, trust store, SSH host key and saved time are there.
#
# Why the override stays: Orion's default is /var/lib/orion. /var is inside the slot root on a managed board, so a
# key there changes at a reflash or a slot change; /data is the same for every slot (orion.conf says the same).
#
# Why StateDirectory= is cleared here: the unit's StateDirectory=orion (packaging/systemd/orion-comm.service) would
# make /var/lib/orion, which nothing would use. The override still works with the directory cleared, because this
# drop-in makes /data/orion instead, owned by the comm core's user (orion-comm, which runs the unit), with group orion
# so that node logic can read the keys in it. RuntimeDirectory=orion (/run/orion, the socket) is kept: that one is
# the comm core's, and is made fresh by the unit.
#
# Mount ordering: Orion's unit has none for /data, so RequiresMountsFor=/data is added. A missing state directory ends
# in Orion's recovery mode.
[Unit]
RequiresMountsFor=/data

[Service]
StateDirectory=
# The + prefix runs this step as root (chown needs it); the comm core itself runs as orion-comm.
ExecStartPre=+/bin/sh -c 'install -d -m 0750 -o orion-comm -g orion /data/orion'
