# Atlas: the comm core's state on the data partition (orion.conf sets state.dir = /data/orion). Orion's unit
# (packaging/systemd/orion-comm.service) has no mount ordering for it: this drop-in adds it, so the comm core
# does not start before /data is mounted (a missing state directory ends in Orion's recovery mode).
# The directory is root's, group orion, so node logic (orion user) can read the keys in it.
# It also makes node logic's own directory, /data/orion/node (orion:orion 0750), before node logic starts
# (orion-node.service: Wants= and After=orion-comm.service). Node logic cannot make it itself: its drop-in lists
# the directory in ReadWritePaths=, and systemd sets up that mount namespace before any of the unit's commands,
# its `+` ExecStartPre included, so a missing directory fails the unit at NAMESPACE (226) on every start (the
# D1 rehearsal, build 12, 2026-11-20). scripts/check-slot-users.sh refuses a /data path in ReadWritePaths= or
# BindPaths= that no unit ordered before it makes.
[Unit]
RequiresMountsFor=/data

[Service]
ExecStartPre=/bin/sh -c 'install -d -m 0750 -o root -g orion /data/orion'
ExecStartPre=/bin/sh -c 'install -d -m 0750 -o orion -g orion /data/orion/node'
