# Atlas: the comm core's state on the data partition (orion.conf sets state.dir = /data/orion). Orion's unit
# (packaging/systemd/orion-comm.service) has no mount ordering for it: this drop-in adds it, so the comm core
# does not start before /data is mounted (a missing state directory ends in Orion's recovery mode).
# The directory is root's, group orion, so node logic (orion user) can read the keys in it.
# It also makes node logic's own directory, /data/orion/node (orion:orion 0750), before node logic starts
# (orion-node.service: Wants= and After=orion-comm.service). Node logic cannot make it itself: its drop-in lists
# the directory in ReadWritePaths=, and systemd sets up that mount namespace before any of the unit's commands,
# its `+` ExecStartPre included, so a missing directory fails the unit at NAMESPACE (226) on every start (the
# D1 rehearsal, build 12, 2026-11-20). scripts/check-slot-users.sh refuses a /data path in ReadWritePaths= or
# BindPaths= that no unit ordered before it makes.
# Each directory is made only when it is absent (F3-7, the coordinator's follow-up after D1): an existing one is never
# re-owned or re-moded. One that is there with another owner, or with a mode other than exactly 0750 (drwxr-x---, so
# others never read Orion's state), or a path that is not a directory (a link included), is refused by name and the
# unit does not start (it restarts as Orion's unit says, and refuses again each time). Owner and mode are read with
# `ls -ld` (the image's busybox has no stat). `$$` is systemd's escape for a `$` the shell sees.
[Unit]
RequiresMountsFor=/data

[Service]
ExecStartPre=/bin/sh -c 'p=/data/orion; if [ -L "$$p" ] || { [ -e "$$p" ] && [ ! -d "$$p" ]; }; then echo "$$p is not a directory; refusing to start" >&2; exit 1; fi; [ -d "$$p" ] || install -d -m 0750 -o root -g orion "$$p" || exit; set -- $$(ls -ld "$$p"); [ "$$3:$$4" = root:orion ] || { echo "$$p is owned by $$3:$$4, not root:orion; refusing to start" >&2; exit 1; }; [ "$$1" = drwxr-x--- ] || { echo "$$p is mode $$1, not 0750 (drwxr-x---); refusing to start" >&2; exit 1; }'
ExecStartPre=/bin/sh -c 'p=/data/orion/node; if [ -L "$$p" ] || { [ -e "$$p" ] && [ ! -d "$$p" ]; }; then echo "$$p is not a directory; refusing to start" >&2; exit 1; fi; [ -d "$$p" ] || install -d -m 0750 -o orion -g orion "$$p" || exit; set -- $$(ls -ld "$$p"); [ "$$3:$$4" = orion:orion ] || { echo "$$p is owned by $$3:$$4, not orion:orion; refusing to start" >&2; exit 1; }; [ "$$1" = drwxr-x--- ] || { echo "$$p is mode $$1, not 0750 (drwxr-x---); refusing to start" >&2; exit 1; }'
