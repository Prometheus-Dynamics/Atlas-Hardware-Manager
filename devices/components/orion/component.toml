# Orion's board image: package orion-bin (binary orion), run as three units from Orion's packaging at
# 3dde304e396f5769d3aa25884b5a9ff5bd4b9180 (C54; the rev the workspace pins, provisional until the second
# pin pair is announced: docs/prs/PINS-2.md). The comm core runs as orion-comm with group orion, never root
# (orion-comm.service); node logic as orion (orion-node.service); each login is started by the login helper
# (orion-login.socket and orion-login.service, which runs as root and is the only process that becomes another
# user). Board-neutral.
#
# Built by Gaia for aarch64 at its pin: bin/orion, static and stripped (profile service). Its cc and env need zig:
# the [sources.tools] below is Gaia's pinned zig 0.15.2, which Gaia puts on PATH after the toolchain. x86_64 build
# hosts only (the zig download is x86_64). The Orion's size-gate wrappers (scripts/zigcc) are its own.
#
# The units and users are Orion's packaging files, installed at the paths its packaging README gives, unrewritten
# except by the drop-ins in files/ (the state on /data, and the comm core's TCP address); the settings are the
# board's own (files/orion.conf). The users are made at build time too: the image's root is read-only.
version = 1
name = "orion"
description = "Orion: the orion binary as the board's comm core and node logic (orion-bin), its three units, settings, and the orion and orion-comm users"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Orion.git"
ref = "3dde304e396f5769d3aa25884b5a9ff5bd4b9180"

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

# The zig 0.15.2 that cc (scripts/zigcc) runs: Gaia's build tools source, read-only at /tools on the build's PATH.
[sources.tools]
download = "https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "orion-bin"
profile = "service"
cc = "/src/scripts/zigcc"
env = "ZIG_GLOBAL_CACHE_DIR=/build/zig-cache\nZIG_LOCAL_CACHE_DIR=/build/zig-cache"

[[install]]
from = "bin/orion"
to = "/usr/bin/orion"
mode = "0755"

# Orion's units, as they are at this rev. Nothing here creates /run/orion or /var/lib/orion: the comm core's unit
# makes /run/orion itself (RuntimeDirectory=); /var/lib/orion is not used (the state is /data, see the drop-ins).
[[install]]
from = { source = "src", path = "packaging/systemd/orion-comm.service" }
to = "/usr/lib/systemd/system/orion-comm.service"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion-node.service" }
to = "/usr/lib/systemd/system/orion-node.service"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion-login.socket" }
to = "/usr/lib/systemd/system/orion-login.socket"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion-login.service" }
to = "/usr/lib/systemd/system/orion-login.service"
mode = "0644"

# The settings: Orion's example with the board's state on /data (files/orion.conf; the reasons are in that file).
# Replaces the example install, which keeps the state in /var/lib/orion.
[[install]]
from = { file = "files/orion.conf" }
to = "/etc/orion/orion.conf"
mode = "0644"

# The drop-ins on Orion's own units (Orion's packaging/README: change a unit with a drop-in, not an edited copy).
# The comm core's state on /data, owned by its own user (see the file).
[[install]]
from = { file = "files/orion-comm-state.conf" }
to = "/etc/systemd/system/orion-comm.service.d/10-board-state.conf"
mode = "0644"

# The comm core's TCP way in on the board's USB address: the environment file the address program writes (ORION_PEER_LISTEN),
# read with EnvironmentFile=- and ordered After=/Wants= lemnos0-address.service (not Requires: a failed address program must not stop the comm core).
[[install]]
from = { file = "files/orion-comm-peer.conf" }
to = "/etc/systemd/system/orion-comm.service.d/20-raze-peer.conf"
mode = "0644"

[[install]]
from = { file = "files/orion-node-state.conf" }
to = "/etc/systemd/system/orion-node.service.d/10-board-state.conf"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion.sysusers" }
to = "/usr/lib/sysusers.d/orion.conf"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion.preset" }
to = "/usr/lib/systemd/system-preset/80-orion.preset"
mode = "0644"

# The accounts: the orion group and its two users, as Orion's sysusers file has them (orion.sysusers): uid and gid
# 901 for node logic, and 902 for the comm core, which is named as login.comm_user (its default) and is the only
# user the login helper answers. Both are declared here and nowhere else (a second statement is refused).
# orion-comm is in dialout for serial links and in orion, the group its socket is for.
# socket.node_uids = 901 in the settings: keep the two the same.
[[groups]]
name = "orion"
gid = 901

[[users]]
name = "orion"
uid = 901
group = "orion"
groups = ["dialout"]
home = "/var/lib/orion"

[[users]]
name = "orion-comm"
uid = 902
group = "orion"
groups = ["dialout"]
home = "/var/lib/orion"

[[services]]
unit = "orion-comm.service"
enable = true

[[services]]
unit = "orion-node.service"
enable = true

# The login helper's socket starts orion-login.service on the first question (the service has no [Install] of its own).
[[services]]
unit = "orion-login.socket"
enable = true
