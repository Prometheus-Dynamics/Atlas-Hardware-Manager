# Orion's board image: package orion-bin (binary orion), run as Orion's packaging runs it (C52, in the pin since
# 19be7e04): orion comm as orion-comm (uid 902, group orion, CAP_SYS_TIME and CAP_NET_BIND_SERVICE only), orion node as
# orion, and the login helper (orion-login.socket, root, socket-activated), the one process that becomes another user. Board-neutral. Built from Orion at
# d361b592009dae9533dbfcdb7378d66588bb655a (Orion next: I140, its shm crates pinned at Lemnos 98fbe0c2, the image's own Lemnos; on ae6eb669; pin move 16). The
# workspace pins the same rev (Cargo.toml), so the board's Orion and the PC's speak one ring layout.
# The shm exception of pin moves 2-9 is closed (pin move 10): Orion's shm crates and the rest of the image are on one
# Lemnos rev, 98fbe0c2 (pin move 16; 214c0ca7 at pin move 15).
#
# Built by Gaia at its pin (3f6e561) for aarch64: bin/orion 5,072,904 bytes, static and stripped (Orion
# 455a956e, profile service; the Orion's second build was byte-identical). Its cc and env need zig: the
# [sources.tools] below is Gaia's pinned zig 0.15.2, which Gaia puts on PATH after the toolchain. x86_64
# build hosts only (the zig download is x86_64). The Orion's size-gate wrappers (scripts/zigcc) are its own.
#
# The units and user are Orion's packaging/systemd files, installed at the paths its packaging README
# gives, unrewritten; the settings are the board's own (files/orion.conf), and the drop-ins in files/ point
# the state at /data. The user is made at build time too: the image's root is read-only.
version = 1
name = "orion"
description = "Orion: the orion binary as the board's comm core and node logic (orion-bin), its two units, settings, and the orion user"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Orion.git"
ref = "d361b592009dae9533dbfcdb7378d66588bb655a"  # Orion d361b592 (next: I140 shm-fdpass at Lemnos 98fbe0c2, the image's own Lemnos; I138 a program that dies inside a frame is seen gone and the comm core goes on; I104 a lease is taken only after its holder was quiet; I132 a board away keeps its port; I109 to I137 and I139 gate work; on ae6eb669), coordinator 2026-11-27, pin move 16; before: ae6eb669

# The Rust release the build uses (Gaia 08e71181): rustc, cargo and each target's std, the official files pinned by the
# lock. The build machine's rustup is never read. Every board here is aarch64 (static musl).
[sources.toolchain]
rust = "1.99.0"
targets = ["aarch64-unknown-linux-musl"]

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

# The zig 0.15.2 that cc (scripts/zigcc) runs: Gaia's build tools source, read-only at /tools on the build's PATH.
[sources.tools]
download = "https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "orion-bin"
profile = "service"
cc = "/src/scripts/zigcc"
env = "ZIG_GLOBAL_CACHE_DIR=/build/zig-cache\nZIG_LOCAL_CACHE_DIR=/build/zig-cache"

[[install]]
from = "bin/orion"
to = "/usr/bin/orion"
mode = "0755"

[[install]]
from = { source = "src", path = "packaging/systemd/orion-comm.service" }
to = "/usr/lib/systemd/system/orion-comm.service"
mode = "0644"

# The login helper (Orion C52): its socket (orion-comm's alone, mode 0600) and the service it starts.
[[install]]
from = { source = "src", path = "packaging/systemd/orion-login.socket" }
to = "/usr/lib/systemd/system/orion-login.socket"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion-login.service" }
to = "/usr/lib/systemd/system/orion-login.service"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion-node.service" }
to = "/usr/lib/systemd/system/orion-node.service"
mode = "0644"

# The settings: Orion's example with the board's state on /data (files/orion.conf; the reasons are in that file).
# Replaces the example install, which keeps the state in /var/lib/orion.
[[install]]
from = { file = "files/orion.conf" }
to = "/etc/orion/orion.conf"
mode = "0644"

# The two units, with drop-ins on Orion's own (Orion's packaging/README: change a unit with a drop-in).
[[install]]
from = { file = "files/orion-comm-state.conf" }
to = "/etc/systemd/system/orion-comm.service.d/10-board-state.conf"
mode = "0644"

# The comm core's TCP way in on the board's USB address: the environment file the address program writes (ORION_PEER_LISTEN),
# read with EnvironmentFile=- and ordered After=/Wants= lemnos0-address.service (not Requires: a failed address program must not stop the comm core).
[[install]]
from = { file = "files/orion-comm-peer.conf" }
to = "/etc/systemd/system/orion-comm.service.d/20-raze-peer.conf"
mode = "0644"

[[install]]
from = { file = "files/orion-node-state.conf" }
to = "/etc/systemd/system/orion-node.service.d/10-board-state.conf"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion.sysusers" }
to = "/usr/lib/sysusers.d/orion.conf"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion.preset" }
to = "/usr/lib/systemd/system-preset/80-orion.preset"
mode = "0644"

# The orion user and group, uid and gid 901 (Orion's sysusers file; socket.node_uids = 901 in the
# settings: keep the two the same). The user also in dialout, for serial links.
[[groups]]
name = "orion"
gid = 901

[[users]]
name = "orion"
uid = 901
group = "orion"
groups = ["dialout"]
home = "/var/lib/orion"

# The comm core's user, uid and gid 902 (Orion's sysusers file since C52: `u orion-comm 902`, `m orion-comm orion`,
# `m orion-comm dialout`). 902 is login.comm_user's default, the one uid the login helper answers.
[[groups]]
name = "orion-comm"
gid = 902

[[users]]
name = "orion-comm"
uid = 902
group = "orion-comm"
groups = ["orion", "dialout"]
home = "/var/lib/orion"

[[services]]
unit = "orion-comm.service"
enable = true

[[services]]
unit = "orion-node.service"
enable = true

[[services]]
unit = "orion-login.socket"
enable = true
