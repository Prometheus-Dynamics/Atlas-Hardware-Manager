# Orion's board image: package orion-bin (binary orion), run as two services from Orion's packaging
# (orion comm: root with group orion; orion node: user orion). Board-neutral. Built from Orion at
# 455a956e13e62c97081d66e0e8f3bf2aced1eac8 (the rev the workspace pins; Cargo.lock is committed there).
#
# NOT YET BUILDABLE. Its cc and env need Gaia's pinned build root with zig (Orion's size-gate
# wrappers, scripts/zigcc, and the zig cache); the public rust image has no zig. The next Gaia PR
# pins that root. Until then this component plans and does not build.
#
# The units and user are Orion's packaging/systemd files, installed at the paths its packaging README
# gives, unrewritten; the settings are the board's own (files/orion.conf), and the drop-ins in files/ point
# the state at /data. The user is made at build time too: the image's root is read-only.
version = 1
name = "orion"
description = "Orion: the orion binary as the board's comm core and node logic (orion-bin), its two units, settings, and the orion user"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Orion.git"
ref = "455a956e13e62c97081d66e0e8f3bf2aced1eac8"

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "orion-bin"
profile = "service"
cc = "/src/scripts/zigcc"
env = "ZIG_GLOBAL_CACHE_DIR=/build/zig-cache\nZIG_LOCAL_CACHE_DIR=/build/zig-cache"

[[install]]
from = "bin/orion"
to = "/usr/bin/orion"
mode = "0755"

[[install]]
from = { source = "src", path = "packaging/systemd/orion-comm.service" }
to = "/usr/lib/systemd/system/orion-comm.service"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion-node.service" }
to = "/usr/lib/systemd/system/orion-node.service"
mode = "0644"

# The settings: Orion's example with the board's state on /data (files/orion.conf; the reasons are in that file).
# Replaces the example install, which keeps the state in /var/lib/orion.
[[install]]
from = { file = "files/orion.conf" }
to = "/etc/orion/orion.conf"
mode = "0644"

# The two units, with drop-ins on Orion's own (Orion's packaging/README: change a unit with a drop-in).
[[install]]
from = { file = "files/orion-comm-state.conf" }
to = "/etc/systemd/system/orion-comm.service.d/10-board-state.conf"
mode = "0644"

[[install]]
from = { file = "files/orion-node-state.conf" }
to = "/etc/systemd/system/orion-node.service.d/10-board-state.conf"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion.sysusers" }
to = "/usr/lib/sysusers.d/orion.conf"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/orion.preset" }
to = "/usr/lib/systemd/system-preset/80-orion.preset"
mode = "0644"

# The orion user and group, uid and gid 901 (Orion's sysusers file; socket.node_uids = 901 in the
# settings: keep the two the same). The user also in dialout, for serial links.
[[groups]]
name = "orion"
gid = 901

[[users]]
name = "orion"
uid = 901
group = "orion"
groups = ["dialout"]
home = "/var/lib/orion"

[[services]]
unit = "orion-comm.service"
enable = true

[[services]]
unit = "orion-node.service"
enable = true
