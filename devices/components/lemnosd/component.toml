# One Lemnos cargo package: lemnosd, built from Lemnos next f4a295c6 (I5j merged; the L2 rev for the Raze image).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnosd --profile service`.
version = 1
name = "lemnosd"
description = "the Lemnos hardware daemon, lemnosd (service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "f4a295c611972ba422df20a78112b9fb409c47d0"  # Lemnos next (I5j merged, PR #371), the L2 rev for the Raze image

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnosd"
profile = "service"

[[install]]
from = "bin/lemnosd"
to = "/usr/bin/lemnosd"
mode = "0755"
