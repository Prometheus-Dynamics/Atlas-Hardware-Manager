# One Lemnos cargo package: lemnosd, built from Lemnos next fe8beb7c (M36 merged; the rev for the Raze image).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnosd --profile service`.
version = 1
name = "lemnosd"
description = "the Lemnos hardware daemon, lemnosd (service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "fe8beb7cc966392b22be138a5e51d742331ac2ad"  # Lemnos next (M36 merged), the rev for the Raze image

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnosd"
profile = "service"

[[install]]
from = "bin/lemnosd"
to = "/usr/bin/lemnosd"
mode = "0755"
