# The ROCK 5C's extlinux.conf for U-Boot's distro boot: the root partition by
# its label, with the board's device tree. Bring-up form only. The console is
# the RK35xx default (UART2 at 1500000, the family's), not checked on the board.
default rootfs
label rootfs
  kernel /boot/Image
  devicetree /boot/rk3588s-rock-5c-loader.dtb
  append root=PARTLABEL=rootfs rootwait console=ttyS2,1500000 earlycon
