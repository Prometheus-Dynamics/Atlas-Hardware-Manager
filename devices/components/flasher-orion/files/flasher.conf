# /etc/orion/flasher.conf, the bcm2712 flasher's fixed Orion settings (S39flasher-net adds peer.listen and writes
# the whole as /run/orion/orion.conf, which /etc/orion/orion.conf links to): Orion's packaging/busybox/orion-recovery.conf.example (3f60576c),
# run by orion-comm and orion-node rather than orion-recovery. The recovery comm core alone refuses file pushes and
# actions, so the flasher could not take the image (Orion's answer, docs/prs/D6.md). Differences from the example:
#   - links.usb is `orion-link`, the gadget's default composition's link name (flasher-lemnos-busybox's
#     LEMNOS_ORION_LINKS names the same).
#   - No SSH. Atlas reaches the flasher through Orion (orion+tcp on lemnos0), and a person through the console getty
#     on ttyGS0, so a second way in has no reason here.

# This board's name while it is in the flasher.
node.name = flasher

# The hello says the board is a flasher. Only the settings can say so: no program can publish hello.state.
hello.state = flasher

# The USB link: the gadget's FunctionFS endpoints, handed over by lemnosd at run time (a LinkOffer). It is a link to a
# device, not the PC's way in (that is peer.listen, added at boot); it is named so lemnosd's offer is taken.
links.usb = orion-link

# Node logic runs as the orion user (uid 901): let it in as node logic.
socket.node_uids = 901

# Security off: the image has no /etc/board/security, and the cable is the only way in: peer.listen is the board's
# address on lemnos0, the USB network. Safe only while the flasher brings up no other network Orion listens on.

# The state is in RAM: the node key and host key last one boot. The flow knows the board by its serial, not
# by a pinned key.
state.dir = /var/lib/orion
