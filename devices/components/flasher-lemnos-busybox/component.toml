# Lemnos's packaging for the bcm2712 flasher, a RAM-only initramfs with BusyBox init. These are the files
# Lemnos's packaging/files.txt (da86d0b3) marks busybox, orion, always and soc: the three init scripts, the
# environment files, the bcm2712 SoC map, and the users. It supersedes B9's unlanded lemnos-busybox (b0bf0101).
#
# init/mdev.conf.fragment (files.txt: append to /etc/mdev.conf) is a fragment of the assembled /etc/mdev.conf (Gaia
# F12, [[fragments]] below), first in the product's order, before the board's rules and the OS's file.
#
# Not installed, and why:
#   - The systemd, udev and kmod files: the image has none of the three.
version = 1
name = "flasher-lemnos-busybox"
description = "Lemnos for the bcm2712 flasher's BusyBox init: the restart helper, lemnosd and bridge init scripts, their environment files, the SoC map, and the lemnos users"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "da86d0b38903853cdd40093da1ab1618ac4b5e55"  # Lemnos next, FLASH-ANSWERS: the flasher's one Lemnos rev

[[install]]
from = { source = "src", path = "packaging/init/S49lemnos-restart" }
to = "/etc/init.d/S49lemnos-restart"
mode = "0755"

[[install]]
from = { source = "src", path = "packaging/init/S50lemnosd" }
to = "/etc/init.d/S50lemnosd"
mode = "0755"

[[install]]
from = { source = "src", path = "packaging/init/S51lemnos-orion" }
to = "/etc/init.d/S51lemnos-orion"
mode = "0755"

[[install]]
from = { source = "src", path = "packaging/systemd/lemnosd.env.example" }
to = "/etc/lemnos/lemnosd.env"
mode = "0644"

[[install]]
from = { file = "files/lemnos-orion.env" }
to = "/etc/lemnos/lemnos-orion.env"
mode = "0644"

[[install]]
from = { source = "src", path = "socs/bcm2712-rp1.toml" }
to = "/usr/share/lemnos/socs/bcm2712-rp1.toml"
mode = "0644"

# Fixed ids (check-devices: a user that can own files has one), the same as raze-base's (components/lemnos: lemnos
# 900, lemnos-orion 903), so the two images agree on owners. orion is flasher-orion's group (gid 901), which the
# bridge joins for the comm core's socket.
[[groups]]
name = "lemnos"
gid = 900

[[groups]]
name = "lemnos-orion"
gid = 903

[[users]]
name = "lemnos"
uid = 900
group = "lemnos"

[[users]]
name = "lemnos-orion"
uid = 903
group = "lemnos-orion"
groups = ["lemnos", "orion"]

# Lemnos's packaged mdev rules (the device kinds lemnosd opens, group lemnos 0660): first in /etc/mdev.conf.
[[fragments]]
from = { source = "src", path = "packaging/init/mdev.conf.fragment" }
to = "/etc/mdev.conf"
