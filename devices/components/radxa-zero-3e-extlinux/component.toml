# The ZERO 3E's extlinux.conf for U-Boot's distro boot: the root partition by
# its label, with the gadget device tree. Bring-up form only: it moves to the
# slot boot (record = "uboot") when Gaia's slot recipe exists.
version = 1
name = "radxa-zero-3e-extlinux"
description = "extlinux.conf for U-Boot's distro boot, root=PARTLABEL=rootfs (bring-up form)."

[[install]]
from = { file = "extlinux.conf" }
to = "/boot/extlinux/extlinux.conf"
mode = "0644"
