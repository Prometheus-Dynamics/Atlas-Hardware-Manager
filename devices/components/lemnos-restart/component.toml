# Lemnos's restart helper, lemnos-restart (Lemnos RESTART-UNIT; packaging/README.md, "The restart helper"): the root
# helper lemnosd asks to restart the board, since its own user cannot. Run by lemnos-restart.service on the socket the
# lemnos component installs and enables. Built from the image's one Lemnos rev, as lemnosd is.
version = 1
name = "lemnos-restart"
description = "the Lemnos restart helper, lemnos-restart (service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "e199fcb934968feeaf72c99628610c1c52096755"  # Lemnos e199fcb9 (next: READ-FLOOR, a subscribed reading is read at a period, 10 ms floor in the daemon and 250 ms from the bridge; STUCK-CALL-CHECK; OV9782-MODE4; on 6c8568d0), coordinator 2026-11-23, pin move 14; before: 6c8568d0

# The Rust release the build uses (Gaia 08e71181): rustc, cargo and each target's std, the official files pinned by the
# lock. The build machine's rustup is never read. Every board here is aarch64 (static musl).
[sources.toolchain]
rust = "1.99.0"
targets = ["aarch64-unknown-linux-musl"]

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-restart"
profile = "service"

[[install]]
from = "bin/lemnos-restart"
to = "/usr/bin/lemnos-restart"
mode = "0755"
