# Lemnos's restart helper, lemnos-restart (Lemnos RESTART-UNIT; packaging/README.md, "The restart helper"): the root
# helper lemnosd asks to restart the board, since its own user cannot. Run by lemnos-restart.service on the socket the
# lemnos component installs and enables. Built from the image's one Lemnos rev, as lemnosd is.
version = 1
name = "lemnos-restart"
description = "the Lemnos restart helper, lemnos-restart (service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "bbb3c42085a5a9afacde7f3c18692a5462c1300f"  # Lemnos bbb3c420 (next: FLASH-TARGET-GRANT, FLASH-BRIDGE-PUMP, FLASH-INFO-NOTFOUND, FLASH-DATA-OFF-CALL, KEEP-SIG, T233 deadline lines naming the call and caller), coordinator 2026-11-22, pin move 12; before: a6251ecf

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-restart"
profile = "service"

[[install]]
from = "bin/lemnos-restart"
to = "/usr/bin/lemnos-restart"
mode = "0755"
