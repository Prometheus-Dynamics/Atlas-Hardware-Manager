# DEV ONLY. Used by zero-3e-bringup, never by zero-3e-base.
# Installs the bench SSH PUBLIC key as root's authorized_keys: dropbear refuses
# blank passwords, so a bring-up board needs a key to log in. Until Orion serves
# SSH on the board, this is the only way in; it goes when Orion does.
# The key file is NOT committed (dev's image took the same from a git-ignored
# board/authorized_keys at build time). Supply `authorized_keys` here, one
# OpenSSH PUBLIC key per line, never a private key. Until it exists, the
# product fails the device check: that is the required input, not a gap.
version = 1
name = "dev-bench-ssh-key"
description = "DEV ONLY: the bench SSH public key as root's authorized_keys (bring-up only)."

[[install]]
from = { file = "authorized_keys" }
to = "/root/.ssh/authorized_keys"
mode = "0600"
