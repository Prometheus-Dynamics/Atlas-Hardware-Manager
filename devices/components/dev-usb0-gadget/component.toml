# DEV ONLY, bring-up product only. Brings the OTG port's USB gadget network up
# at boot: usb0 at 10.55.0.1/24, a DHCP server giving the host 10.55.0.2 (dev's
# addresses). Init is BusyBox's (Buildroot's default: no systemd in this OS), so
# the file is /etc/init.d/S41usb0. The busybox udhcpd option (CONFIG_UDHCPD=y)
# is in the bring-up product's busybox.fragment. Goes when Lemnos's USB driver
# owns the gadget.
version = 1
name = "dev-usb0-gadget"
description = "DEV ONLY: usb0 at 10.55.0.1 with a udhcpd for 10.55.0.2 (bring-up only)."

[[install]]
from = { file = "S41usb0" }
to = "/etc/init.d/S41usb0"
mode = "0755"

[[install]]
from = { file = "udhcpd.usb0.conf" }
to = "/etc/udhcpd.usb0.conf"
mode = "0644"
