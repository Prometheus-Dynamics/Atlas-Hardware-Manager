# BENCH ONLY: components/bench-comm-root/component.toml says why. Every line undoes one of Orion's unit's limits
# (packaging/systemd/orion-comm.service at 8e37a8a4); a line for a limit the pinned unit does not set changes nothing.
[Service]
User=root
# `~` with no names inverts an empty list: the full bounding set (checked with systemd-run, CapBnd 000001ffffffffff).
CapabilityBoundingSet=~
AmbientCapabilities=
NoNewPrivileges=no
ProtectKernelModules=no
ProtectKernelTunables=no
ProtectKernelLogs=no
ProtectControlGroups=no
ProtectHostname=no
RestrictNamespaces=no
RestrictSUIDSGID=no
RestrictRealtime=no
LockPersonality=no
RestrictAddressFamilies=
SystemCallArchitectures=
