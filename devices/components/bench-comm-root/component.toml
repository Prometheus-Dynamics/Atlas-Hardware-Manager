# BENCH ONLY (coordinator's ruling 2026-11-18): Orion's comm core runs as root with no unit hardening, so an SSH login
# through Orion is root, as every Lemnos board check needs (board locks under /run/lock, modprobe and driver rebinds,
# systemctl, systemd-run failsafe timers that outlive the session, writes under /run and /tmp).
# The product's default is Orion's own unit, unchanged: at Orion 455a956 (this image's pin) it already runs as root; from
# Orion 8e37a8a4 it runs as orion-comm with a capability bound, NoNewPrivileges and namespace limits. This drop-in
# undoes all of that for the bench image and is the one place the bench differs; a product image leaves it out.
# Security stays off on the bench image (orion.conf has no `security = on`). Untested on board.
version = 1
name = "bench-comm-root"
description = "BENCH ONLY: Orion's comm core as root without its unit's hardening, so SSH logins are root."

[[install]]
from = { file = "files/90-bench-root.conf" }
to = "/etc/systemd/system/orion-comm.service.d/90-bench-root.conf"
mode = "0644"
