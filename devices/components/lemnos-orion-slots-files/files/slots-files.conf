# Atlas (every image with the bridge and a system-slots device at data = "/data"): the slots device takes the slot bundles sent through Orion. The bridge registers a file sink
# only for the devices LEMNOS_ORION_FILES names (board: Lemnos bbb3c420 service/orion/src/files.rs:3-5, config.rs:78);
# unset, no device takes files (packaging/systemd/lemnos-orion.env.example:20-23), and a push to lemnos/slots/<name>
# never reaches /data/slots/.incoming, so install_file answers NOT_FOUND (bar run 10, 2026-11-23). `slots` is the
# system-slots device id in the board files (raze, radxa-zero-3e); /data/slots/.incoming is its inbox under the board
# file's data = "/data". With ProtectSystem=strict the directory must be writable through a drop-in
# (packaging/systemd/lemnos-orion.service:2-4). "-": where slot-init made no inbox, the bridge still starts.
[Service]
Environment=LEMNOS_ORION_FILES=slots=/data/slots/.incoming
ReadWritePaths=-/data/slots/.incoming
