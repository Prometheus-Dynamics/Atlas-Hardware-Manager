# systemd config the Raze keeps as a file: the journal kept across boots, bounded, so a failed boot
# leaves its logs for the support bundle (Orion).
version = 1
name = "raze-base-files"
description = "Raze base system config: the bounded persistent journal, the console rule, and the product's own Orion lines (ways in, file roots, the appdata group)"

[[install]]
from = { file = "files/60-board-journald.conf" }
to = "/usr/lib/systemd/journald.conf.d/60-board.conf"
mode = "0644"

# The USB network address of lemnos0 (serial-hash-v1) is the lemnos0-addressing component (its files moved there so the
# bench and the Raze share one copy). Raze's product names that component.

# networkd is NOT declared here (coordinator's ruling 2026-11-20): a component declares the units it ships. networkd
# is the OS's (BR2_PACKAGE_SYSTEMD_NETWORKD=y): Buildroot's preset-all enables it (90-systemd.preset) inside the
# fakeroot stage, and scripts/check-slot-users.sh holds the root to the presets. Declared, Gaia would follow its
# Also=systemd-networkd-wait-online.service as `systemctl enable` does and refuse the Raze's deliberate wait-online mask
# (os/post-build.sh). check-slot-users' product mode asserts both by name: networkd linked, wait-online masked.

# No systemd watchdog here: lemnosd feeds the hardware watchdog (15 s by default, from the board file),
# and it is the only opener of the device.

# The console: a getty on the USB gadget's ACM port, ttyGS0 (the gadget's one serial function). systemd runs it.
[[services]]
unit = "serial-getty@ttyGS0.service"
enable = true

# The console follows the board's security switch (LOCK: Lemnos 6c8568d0 drivers/system-security/src/flow.rs:499 renders the view; the Raze runs that driver): the view /etc/board/security says on (or is
# malformed) and no login is offered; off or absent and the getty runs as before. ExecCondition in the three template
# drop-ins (serial-getty for ttyGS0, getty for the other VTs' getty@ units, autovt for the on-demand VTs) runs the check.
[[install]]
from = { file = "files/console-allowed" }
to = "/usr/lib/lemnos/console-allowed"
mode = "0755"

[[install]]
from = { file = "files/30-security-console.conf" }
to = "/etc/systemd/system/serial-getty@.service.d/30-security-console.conf"
mode = "0644"

[[install]]
from = { file = "files/30-security-console.conf" }
to = "/etc/systemd/system/getty@.service.d/30-security-console.conf"
mode = "0644"

[[install]]
from = { file = "files/30-security-console.conf" }
to = "/etc/systemd/system/autovt@.service.d/30-security-console.conf"
mode = "0644"

# The product's Orion name prefix (orion-node-name): every Raze answers as raze-<last 8 serial digits>.
[[install]]
from = { file = "files/orion-node-name.conf" }
to = "/etc/orion/node-name.conf"
mode = "0644"

# The journal on the data partition: the bind of /data/journal onto /var/log/journal, before the flush.
[[install]]
from = { file = "files/board-journal" }
to = "/usr/lib/lemnos/board-journal"
mode = "0755"

[[install]]
from = { file = "files/board-journal.service" }
to = "/etc/systemd/system/board-journal.service"
mode = "0644"

[[services]]
unit = "board-journal.service"
enable = true

# The Raze's own Orion lines (move 13; written against Orion 5b94401): the comm core's ways in (the USB link's network
# and wired Ethernet, mDNS on both) and the application's two data directories; node logic's file roots; and no peer
# address file from lemnos0-address. Each file says why.
[[install]]
from = { file = "files/30-raze-ways-in.conf" }
to = "/etc/systemd/system/orion-comm.service.d/30-raze-ways-in.conf"
mode = "0644"

[[install]]
from = { file = "files/30-raze-file-roots.conf" }
to = "/etc/systemd/system/orion-node.service.d/30-raze-file-roots.conf"
mode = "0644"

[[install]]
from = { file = "files/10-no-peer-env.conf" }
to = "/etc/systemd/system/lemnos0-address.service.d/10-no-peer-env.conf"
mode = "0644"

# The group that owns the application's data on /data (/data/app, /data/calibrations: root:appdata 2770). A fixed id,
# as every owner of files on /data has (os/data-owners). No user of this image has it as its own group: node logic
# takes it as a supplementary group, and the application's user joins it when the HeliOS port defines that user.
[[groups]]
name = "appdata"
gid = 904
