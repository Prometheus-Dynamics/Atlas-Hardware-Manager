# INTERIM (coordinator's RULING, 2026-11-14; Orion's PROBLEM 1). The comm core binds the board's USB address
# (ORION_PEER_LISTEN, written to /run/lemnos0/orion-peer.env) BEFORE lemnos0 exists: lemnosd builds the gadget after
# the comm core may start, and the address appears only when networkd configures lemnos0. At this Orion rev a failed
# TCP bind is not retried: the comm core drops into recovery until it is restarted. ip_nonlocal_bind lets the bind
# succeed before the address is on any interface; the socket then answers once the address is up.
# REMOVE this file when Orion has an interface-bound, waited-for TCP way in (it is on the PARKED list, INPUTS).
net.ipv4.ip_nonlocal_bind = 1
