# Atlas (the Raze image): a login on a console follows the board's security switch (one switch per board).
# ExecCondition runs console-allowed (/usr/lib/lemnos/console-allowed): exit 1 (the view is ON, or it is malformed) makes
# systemd SKIP this getty, with no login offered; exit 0 (the view is off, or absent) starts it as before.
# LOCK: Lemnos S2. Nothing renders /etc/board/security at our Lemnos lock, so the view is absent, the switch reads off,
# and every console opens as it did before. This is inert until the view is rendered.
# Behaviour when the switch changes at run time: a getty already running is NOT stopped by the switch. It is checked again
# when it next starts: at boot, and after the session on it ends (systemd restarts the getty, which runs this check).
# So a login already open stays open until it ends. No path unit: the change is not watched.
# Applied to the template units, so every instance (ttyGS0 and any other console the image starts) is covered.
[Service]
ExecCondition=/usr/lib/lemnos/console-allowed
