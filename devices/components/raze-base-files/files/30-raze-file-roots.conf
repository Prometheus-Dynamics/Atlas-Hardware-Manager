# The Raze's file roots: the directories a client reaches through Orion's files service (node logic), one
# `files.root.<name> = <directory> rw|ro` each (Orion 5b94401, crates/node/file-roots), given through the environment
# so the shared orion.conf stays every product's (coordinator's ruling 2026-11-23). The quotes keep the directory
# and its rw/ro one assignment.
#   app           /data/app            rw  the application's own files;
#   calibrations  /data/calibrations   rw  camera and field calibrations;
#   logs          /var/log             ro  the journal (kept on /data: board-journal.service).
# The two writable ones are root:appdata 2770, made by the comm core's drop-in (30-raze-ways-in.conf). Node logic
# takes appdata as a supplementary group and writes there; ProtectSystem=strict keeps /data read-only for this unit
# otherwise, so both are listed as writable. Orion's unit sets UMask=0007: a file node logic places is 0660 in the
# directory's group, which the application reads and writes.
[Service]
Environment="ORION_FILES_ROOT_APP=/data/app rw"
Environment="ORION_FILES_ROOT_CALIBRATIONS=/data/calibrations rw"
Environment="ORION_FILES_ROOT_LOGS=/var/log ro"
# files.receivers (Orion b01a7fb2, I87): the prefixes that belong to a program that receives files. `lemnos/` is
# the Lemnos bridge's (a slot or a flash image pushed to lemnos/<device>/). A push that arrives before the bridge has
# registered its sink is then refused as not there yet, and sent again, instead of landing in node logic's own store,
# where the device would never find it.
Environment=ORION_FILES_RECEIVERS=lemnos/
SupplementaryGroups=appdata
ReadWritePaths=/data/app /data/calibrations
