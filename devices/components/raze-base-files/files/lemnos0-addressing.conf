# The Raze's USB network addressing, scheme serial-hash-v1: ONE place where the scheme's parameters are written.
# Read by files/lemnos0-address (the board's address and DHCP pool, at boot) and by scripts/check-lemnos0-address.py.
# The host side (parked with the gateway work) reads these same values; it does not get its own copy.
# Source: dev's scheme at 675bd03 (crates/atlas-devices/src/gadget.rs; devices/common/board-os/gaia/assets/rootfs/
# usr/lib/board/lib.sh board_gadget_subnet). The same algorithm, twice there. Parameters are dev's.
#
# The algorithm (scheme serial-hash-v1):
#   1. serial8 = the board serial (/proc/device-tree/serial-number, trimmed, lowercased) normalized to its LAST 8 hex digits.
#   2. hash = the first 4 bytes of SHA-256 over those 8 ASCII characters, as a big-endian u32.
#   3. base split into /prefix subnets (8192 slots for 172.31.0.0/16 at /29); the slots inside `exclude` are dropped
#      (32 slots for 172.31.250.0/24); slot = hash % usable, counted up from the lowest, skipping the excluded range.
#   4. The board takes the subnet's first host address (network + 1); DHCP hands out the rest of the /29 to the host.
scheme=serial-hash-v1
base=172.31.0.0/16
prefix=29
exclude=172.31.250.0/24
# The network interface the board's gadget presents: the default composition's ifname=lemnos%d, first free number.
# Checked against Lemnos contracts/usb-link.toml [network] board_interface when the lock has it (R1i); see
# scripts/check-usb-ifname.py.
interface=lemnos0
# The port of the TCP way in on the board's address (Orion's peer.listen, given at boot through ORION_PEER_LISTEN in
# /run/lemnos0/orion-peer.env). 9200 is Orion's client default (client/connect/src/address.rs:9-10).
peer_port=9200
# The DHCP lease: dev's 2 minutes (dev's board_gadget_dhcp_range: the host renews within about a minute).
lease_seconds=120
