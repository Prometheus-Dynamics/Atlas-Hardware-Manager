# Device package: keep the journal across boots (coordinator-approved values, 2026-11-22). /var/log/journal is a bind
# of /data/journal (board-journal.service, before the flush), so persistent storage lands on the data partition, never
# in the read-only root or RAM. With a transient machine id the bind is not made and the journal stays in /run.
#   SystemMaxUse=256M / SystemMaxFileSize=32M  room for many boots on a 29 GiB /data, in files small to rotate;
#   SystemKeepFree=3G                          the journal never eats the room slots need;
#   RuntimeMaxUse=16M                          the boot's journal in RAM before the flush, or all boot if unbound;
#   RateLimit 2000 per 30 s                    a driver's burst is kept, a loop is still capped;
#   SyncIntervalSec=5m                         eMMC writes batched; a crash still syncs CRIT and above at once.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=256M
SystemMaxFileSize=32M
SystemKeepFree=3G
RuntimeMaxUse=16M
RateLimitIntervalSec=30s
RateLimitBurst=2000
SyncIntervalSec=5m
