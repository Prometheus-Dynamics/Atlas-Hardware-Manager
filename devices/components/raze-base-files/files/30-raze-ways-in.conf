# The Raze's ways in to the comm core, and its two application data directories. Product lines, not the shared
# components/orion's (coordinator's ruling 2026-11-23): interface names and data layout are each product's own.
# Written against Orion 5b94401's settings (the interface lists, mDNS); Orion reads ORION_<KEY> over orion.conf
# (crates/core/config/src/lib.rs: `peer.interface` is ORION_PEER_INTERFACE).
#
# The network way in: port 9200, one listener kept to each named interface (SO_BINDTODEVICE), never every interface.
#   lemnos0  the USB link's network (lemnosd's gadget);
#   end0     wired Ethernet (the CM5's RP1 GEM, as systemd names it).
# An interface that is not there yet is waited for, and a listener kept to an interface opens before the interface has
# its address (shown in a network namespace with ip_nonlocal_bind off, 2026-11-23): so this product has no
# net.ipv4.ip_nonlocal_bind sysctl and reads no address file. lemnos0-address writes none here (10-no-peer-env.conf);
# that matters, because systemd lets an EnvironmentFile= value win over Environment=, and components/orion's
# 20-raze-peer.conf still names that file for the products that use it.
# mDNS: the board is announced by its name on the same two interfaces. Nothing else on the image answers mDNS
# (no systemd-resolved: os/raze.fragment).
# The quotes keep each list one assignment: systemd splits an unquoted Environment= at the space.
[Service]
Environment=ORION_PEER_LISTEN=0.0.0.0:9200
Environment="ORION_PEER_INTERFACE=lemnos0, end0"
Environment=ORION_MDNS=true
Environment="ORION_MDNS_INTERFACE=lemnos0, end0"
# The application's data, which Orion's files service reads and writes beside the application (30-raze-file-roots.conf):
# /data/app and /data/calibrations, each root:appdata 2770 (coordinator's ruling 2026-11-23). Setgid, so what is made
# inside keeps the group; group-writable, so the application (its own user, in appdata, when the HeliOS port defines it)
# and node logic (appdata as a supplementary group) both write. Made here, before node logic starts (orion-node.service
# is ordered after this unit), because node logic's drop-in lists them in ReadWritePaths= and systemd needs those to
# exist before any of that unit's own commands (components/orion's orion-comm-state.conf says the same of
# /data/orion/node). Each is made only when absent; one that is there with another owner or mode, or that is not a
# directory, is refused by name and the unit does not start. `$$` is systemd's escape for a `$` the shell sees; `+`
# runs the line with full privileges (the unit itself is orion-comm).
ExecStartPre=+/bin/sh -c 'p=/data/app; if [ -L "$$p" ] || { [ -e "$$p" ] && [ ! -d "$$p" ]; }; then echo "$$p is not a directory; refusing to start" >&2; exit 1; fi; [ -d "$$p" ] || install -d -m 2770 -o root -g appdata "$$p" || exit; set -- $$(ls -ld "$$p"); [ "$$3:$$4" = root:appdata ] || { echo "$$p is owned by $$3:$$4, not root:appdata; refusing to start" >&2; exit 1; }; [ "$$1" = drwxrws--- ] || { echo "$$p is mode $$1, not 2770 (drwxrws---); refusing to start" >&2; exit 1; }'
ExecStartPre=+/bin/sh -c 'p=/data/calibrations; if [ -L "$$p" ] || { [ -e "$$p" ] && [ ! -d "$$p" ]; }; then echo "$$p is not a directory; refusing to start" >&2; exit 1; fi; [ -d "$$p" ] || install -d -m 2770 -o root -g appdata "$$p" || exit; set -- $$(ls -ld "$$p"); [ "$$3:$$4" = root:appdata ] || { echo "$$p is owned by $$3:$$4, not root:appdata; refusing to start" >&2; exit 1; }; [ "$$1" = drwxrws--- ] || { echo "$$p is mode $$1, not 2770 (drwxrws---); refusing to start" >&2; exit 1; }'
