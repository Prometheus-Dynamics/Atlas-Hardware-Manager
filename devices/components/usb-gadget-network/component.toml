# The bring-up's USB network: Gaia's usb-gadget-network component (CDC NCM through configfs, stable Ethernet
# addresses from the board id and serial, usb0 at 10.55.0.1, udhcpd handing 10.55.0.2), taken from its own
# file in the PINNED Gaia checkout. No copy of its files is carried here: the two [[install]] entries read
# them from the source below. Only the unit that runs its init script is ours (files/).
#
# Why a wrapper: a product names a component by a path inside Atlas's own tree, so Gaia's example component
# cannot be named from a product directly by its own path; a component may install a file from a source, and
# that is the form used here. The pin is Gaia 3f6e561 (the commit devices/gaia.lock names; PR B32 moved it from 7177d72,
# and the script is unchanged: it still presents 1d6b:0103 with bcdDevice 0x0b00).
#
# At e1cc295 (and at 7177d72) the script presents Gaia's bring-up identity, 1d6b:0103 with bcdDevice 0x0b00 (Gaia 9b673f6, #94 gadget-identity). At
# 4509f6b it presented 1d6b:0104, a managed gadget's identity (Lemnos's daemon), so the move to e1cc295 is what
# gives the bring-up its own identity (PR B26; usb-ids.json names 1d6b:0103).
#
# The board id (/etc/usb-gadget.family) and the serial rule are the image's: see the product's own
# usb-gadget-family component. Untested on board.
version = 1
name = "usb-gadget-network"
description = "Bring-up USB network: Gaia's configfs NCM gadget (pinned source), run by a systemd unit. Untested on board."

[sources.gaia]
git = "https://github.com/Prometheus-Dynamics/Gaia-Image-Builder.git"
ref = "c6a3d102467f11a86ecc7fb53965cbaca9a09725"

# Gaia's init script (run by the unit below; it is an init-style script, not a unit on its own).
[[install]]
from = { source = "gaia", path = "examples/components/usb-gadget-network/files/S41usb0" }
to = "/etc/init.d/S41usb0"
mode = "0755"

# Gaia's udhcpd config: usb0, one lease, 10.55.0.2.
[[install]]
from = { source = "gaia", path = "examples/components/usb-gadget-network/files/udhcpd.usb0.conf" }
to = "/etc/udhcpd.usb0.conf"
mode = "0644"

# Ours: the unit that runs the script under systemd (the image's init is systemd, not SysV).
[[install]]
from = { file = "files/usb-gadget-network.service" }
to = "/etc/systemd/system/usb-gadget-network.service"
mode = "0644"

[[services]]
unit = "usb-gadget-network.service"
