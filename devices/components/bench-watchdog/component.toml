# The bench's hardware watchdog, armed by systemd (PID 1 pings it). The RK35xx's Synopsys watchdog is DW_WATCHDOG,
# already on in the family fragment (devices/families/rk35xx/assets/linux.fragment:74), so nothing is added to the
# kernel here.
#
# The value follows bringup-alive's (16 s runtime, 2 min reboot). On RK35xx the request rounds up to dw_wdt's 22.4 s
# TOP (dw_wdt.c), so a hang of PID 1 longer than that resets the board. Lemnos's keep-alive is NOT used: the board file
# names no watchdog (see bench-board). One opener only: systemd.
version = 1
name = "bench-watchdog"
description = "The bench's hardware watchdog: systemd's RuntimeWatchdogSec (16 s) and RebootWatchdogSec (2 min)."

[[install]]
from = { file = "files/10-watchdog.conf" }
to = "/etc/systemd/system.conf.d/10-bench-watchdog.conf"
mode = "0644"
