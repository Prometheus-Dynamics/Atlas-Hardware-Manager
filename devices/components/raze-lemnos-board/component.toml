# The Raze's files that still have to be files on the board, and the Lemnos
# board definition. Everything the board's scripts and units did that moved to
# Lemnos drivers or Orion is not here (the PR text lists each file's new home).
version = 1
name = "raze-lemnos-board"
description = "Raze board files for lemnosd: the i2c-dev module load and the USB power rule; the board file is a placeholder pending Lemnos Q2a"

# /etc/lemnos/board.toml: PENDING Lemnos Q2a. The placeholder (files/board.toml.PLACEHOLDER) is not
# installed: the file is not a board file yet, and lemnosd would refuse it.

# No lemnosd drop-in: lemnosd starts as root and drops to user lemnos itself (Lemnos L3), so the
# PWM and gadget writes need no capability or ReadWritePaths here. No setcap, no xattrs, no
# ExecStartPre helper.

# No gadget modules here: the gadget is one configuration built by Lemnos's usb-gadget driver from the
# board file (Lemnos Q2a, with the generated overlay's UDC). dev's board-usb-gadget.conf is not carried.

# lemnos.ko's modprobe.d line: generated by `lemnos-ctl tree` from the board file (Lemnos Q2a), not kept here.

# i2c-dev: /dev/i2c-N, which lemnosd opens for the buses (its groups are set by 70-lemnos.rules).
[[install]]
from = { file = "files/raze-i2c-dev.conf" }
to = "/usr/lib/modules-load.d/raze-i2c-dev.conf"
mode = "0644"

# USB power policy, not a Lemnos-user rule: it sets power/control=on and USB2 LPM off for every USB
# device when udev adds it, because USB autosuspend dropped external cameras on dev. udev runs it as
# root, so it gives the lemnos user nothing.
[[install]]
from = { file = "files/60-raze-usb-power.rules" }
to = "/usr/lib/udev/rules.d/60-raze-usb-power.rules"
mode = "0644"

