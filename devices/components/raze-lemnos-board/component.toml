# The Raze's files that still have to be files on the board, and the Lemnos
# board definition. Everything the board's scripts and units did that moved to
# Lemnos drivers or Orion is not here (the PR text lists each file's new home).
version = 1
name = "raze-lemnos-board"
description = "Raze board files for lemnosd: the i2c-dev module load, the USB power rule, the board file (Lemnos Q2d, from the board directory), the gadget drop-in (R1d), and the files lemnos-ctl tree generates from that board file; locked to Lemnos d6b9361d"

# /etc/lemnos/board.toml: the Raze's board file, written to Lemnos Q2d, and locked to Lemnos d6b9361d (L1,
# PR B23) with the rest of the product's Lemnos components. The file is the BOARD's, not this component's: it
# is boards/raze/lemnos-board.toml, named by boards/raze/board.toml under [descriptions] (PR B26). The install
# takes it by that name, so the file the image carries is the one the board directory holds.
# Its generated outputs come from `lemnos-ctl tree` on this file at build time.

[[install]]
from = { description = "lemnos" }
to = "/etc/lemnos/board.toml"
mode = "0644"

# The gadget drop-in (Lemnos R1d): the FunctionFS mount needs CAP_SYS_ADMIN in the root phase and
# mount/umount2 in the filter. The base unit has none of it. Installed here because this board file has a
# usb-gadget device; scripts/check-lemnos-gadget.py enforces that pairing both ways.
[sources.lemnos]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "d6b9361d006e5f633149b6dea8bb5d1be9483d0a"

# The image lemnos-ctl is built in, and the generator runs in (Gaia #100: a [generate] tool is built for the build
# machine and run in the image its component's `root` source names). The same image lemnos-ctl's own component uses.
[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

# The files `lemnos-ctl tree` writes from the board file (PR B27). Its arguments are the flags that exist at this
# Lemnos lock d6b9361d (service/ctl/src/lib.rs, fn tree): --socs, -o, --modprobe, --cmdline (and --boot, which this
# block does not pass: Gaia has no key for config.txt lines; Lemnos writes them in its own later steps). No --udev,
# --mdev, --boot-dir or --slot at this lock: those come with Lemnos Q2i (a06c650c), Q2j (4e668481) and the held L2
# stack. Every declared output is written by one of the flags above, and nothing else is written.
[generate]
description = "lemnos"
tool = { source = "lemnos", package = "lemnos-ctl" }
args = [
  "tree", "--socs", "@source@/socs", "@description@",
  "-o", "@out@/overlay.dts",
  "--modprobe", "@out@/modprobe.conf",
  "--cmdline", "@out@/cmdline.words",
]
outputs = ["overlay.dts", "modprobe.conf", "cmdline.words"]

[[install]]
from = { source = "lemnos", path = "packaging/systemd/lemnosd.service.d/gadget.conf" }
to = "/etc/systemd/system/lemnosd.service.d/gadget.conf"
mode = "0644"

# lemnosd starts as root and drops to user lemnos itself (Lemnos L3): no setcap, no xattrs, no ExecStartPre
# helper. The gadget's UDC writes are made by the daemon after the drop.

# No gadget modules here: the gadget is one configuration built by Lemnos's usb-gadget driver from the
# board file (Lemnos Q2a, with the generated overlay's UDC). dev's board-usb-gadget.conf is not carried.

# lemnos.ko's modprobe.d fragment: the generated modprobe.conf (`lemnos-ctl tree --modprobe`), installed as Lemnos
# documents (`lemnos.conf` in /etc/modprobe.d/, docs/boards.md and Q2c). Until PR B27 it was in no image: the component
# said "not kept here" and nothing generated it. lemnos.ko itself is not built by this kernel yet (the packaging
# comment above), so the options name a module that is not loaded; the file is what the board's module needs.
[[install]]
from = { generated = "modprobe.conf" }
to = "/etc/modprobe.d/lemnos.conf"
mode = "0644"

# The other two generated outputs have no consumer at Gaia 7177d72, so they are declared and not installed. The
# overlay and the command line gain consumers through `[generate.provides]` in later Gaia revs (docs/prs/B27.md
# has what Gaia said); that key is not at 7177d72, so it is not written here:
#   overlay.dts (-o): Gaia builds a board's kernel overlays only by name from the kernel's device tree directory
#     (`kernel.overlays`, crates/core/graph/src/os.rs); it has no step that compiles a generated overlay source.
#   --boot is not passed at all: Gaia has no key for config.txt lines (Lemnos writes them in its own later steps).
#   cmdline.words (--cmdline): Gaia names no kernel command line key at this rev (the extlinux APPEND is a component's
#     file, and the Raze has none; its command line is the firmware's cmdline.txt, on a boot partition the slot recipe
#     does not produce).
# None of them is hand-copied. docs/prs/B27.md has the plan lines.

# i2c-dev: /dev/i2c-N, which lemnosd opens for the buses (its groups are set by 70-lemnos.rules).
[[install]]
from = { file = "files/raze-i2c-dev.conf" }
to = "/usr/lib/modules-load.d/raze-i2c-dev.conf"
mode = "0644"

# Hand-written and kept: no generated udev rule at Lemnos d6b9361d (`lemnos-ctl tree` has no --udev; Lemnos Q2i a06c650c).
# The one Lemnos move (L2) brings --udev with the rest of the held stack; until then this file stays as it is.
# USB power policy, not a Lemnos-user rule: it sets power/control=on and USB2 LPM off for every USB
# device when udev adds it, because USB autosuspend dropped external cameras on dev. udev runs it as
# root, so it gives the lemnos user nothing.
[[install]]
from = { file = "files/60-raze-usb-power.rules" }
to = "/usr/lib/udev/rules.d/60-raze-usb-power.rules"
mode = "0644"
