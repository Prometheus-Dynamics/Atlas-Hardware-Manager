# The Raze's files that still have to be files on the board, and the Lemnos board definition. Everything the board's
# scripts and units did that moved to Lemnos drivers or Orion is not here (the PR text lists each file's new home).
version = 1
name = "raze-lemnos-board"
description = "Raze board files for lemnosd: the i2c-dev module load, the USB power rule, the board file (from the board directory), the gadget drop-in (R1d), the trust root, and the files, slot bundle and boot partition lemnos-ctl writes from that board file (L2d, slot-boot)"

# /etc/lemnos/board.toml: the Raze's board file, locked to Lemnos L2 (I5j, the bundle tool) with the rest of the
# product's Lemnos components. The file is the BOARD's, not this component's: it is boards/raze/lemnos-board.toml,
# named by boards/raze/board.toml under [descriptions]. The install takes it by that name, so the file the image
# carries is the one the board directory holds. Its generated outputs come from `lemnos-ctl tree` on this file at
# build time; the slot bundle and the boot partition from `lemnos-ctl bundle` and `boot-partition` (below).

[[install]]
from = { description = "lemnos" }
to = "/etc/lemnos/board.toml"
mode = "0644"

# The gadget drop-in (Lemnos R1d): the FunctionFS mount needs CAP_SYS_ADMIN in the root phase and
# mount/umount2 in the filter. The base unit has none of it. Installed here because this board file has a
# usb-gadget device; scripts/check-lemnos-gadget.py enforces that pairing both ways.
[sources.lemnos]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "a6251ecfb815752880f399e4e137634d022d4a2d"  # Lemnos a6251ecf (next: pin move 10's 7b4fdb25 plus WAY-BACK-TOOL, BOOTFILES-OWNER, TICK-BOUND and TRIAL-COUNT), coordinator 2026-11-22, pin move 11; before: 7b4fdb25

# The image lemnos-ctl is built in, and the generator runs in (Gaia #100: a [generate] tool is built for the build
# machine and run in the image its component's `root` source names). The same image lemnos-ctl's own component uses.
[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

# The files `lemnos-ctl tree` writes from the board file (L2d, the held L2 flags, lemnos-ctl at Lemnos next fe8beb7c:
# service/ctl/src/lib.rs, fn tree). NO --boot-dir: the boot partition is written as one image by `boot-partition` below
# (I5i8: `tree --boot-dir` is refused). --boot is not passed (Gaia has no key for config.txt lines).
# --manifest-boot comes from the SAME invocation as -o (I5i6). --cmdline-slot needs --slot (the image's slot id).
# Every declared output is written by one of these flags. Outputs with a [generate.provides] role are read by Gaia.
[generate]
description = "lemnos"
tool = { source = "lemnos", package = "lemnos-ctl" }
args = [
  "tree", "--socs", "@source@/socs", "@description@",
  "-o", "@out@/overlay.dts",
  "--manifest-boot", "@out@/manifest-boot.json",
  "--modprobe", "@out@/modprobe.conf",
  "--cmdline", "@out@/cmdline.words",
  "--cmdline-slot", "@out@/cmdline-slot.words", "--slot", "@slot@",
  "--security-unit", "@out@/security.service",
  "--udev", "@out@/lemnos-board.rules",
]
outputs = ["overlay.dts", "manifest-boot.json", "modprobe.conf", "cmdline.words", "cmdline-slot.words", "security.service", "lemnos-board.rules"]

# The roles slot-boot reads (Gaia #113; recipes/slot-boot.toml [inputs] provides.*). A path here must be a declared output.
#   board-overlay: the overlay SOURCE; Gaia compiles it with `dtc -@ -I dts -O dtb` and checks it with fdtoverlay.
#   manifest-boot: the overlay marker for the manifest's boot.overlay (the sha256 of the overlay source, 2026-11-14 I5i6).
#   cmdline:       the generator's words; Gaia adds the board base (kernel.cmdline) first and the slot words last.
#   cmdline-slot:  os.slot, os.roothash (a hole the bundle fills), os.src.<source>=<path>, panic=5.
[generate.provides]
board-overlay = "overlay.dts"
manifest-boot = "manifest-boot.json"
cmdline = "cmdline.words"
cmdline-slot = "cmdline-slot.words"

# The boot partition: one image, written by the tool from the payload (the bundle's boot files, as bundled), at the
# image's boot_size. `fit` is run before anything is written and fails when the payload does not fit its bay.
# Outputs are the image (`boot`) and the fit/args/verify printout (`boot-report`): the five bay sizes are read from it.
[generate.image]
fit = ["boot-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--min-size", "--payload", "@payload@", "--firmware", "@firmware@"]
args = ["boot-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--slot", "@slot@", "--payload", "@payload@", "--firmware", "@firmware@", "--size", "@size@", "--out", "@out@"]
verify = ["boot-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--verify", "@out@"]

# The slot bundle: the same tool writes it from the payload, the root image and its verity table (`@rootfs@`,
# `@verity-table@`), signed by the key the environment names (`sign_key_env`, `sign_key_id`), and gives the payload back
# as it bundled it (`@payload-out@`: the boot partition is written from THAT payload). Flags checked at Lemnos next fe8beb7c with
# `lemnos-ctl bundle --help` (docs/prs/L2d.md, "bundle, flag by flag").
[generate.bundle]
args = ["bundle", "--layout-of", "@description@", "--socs", "@source@/socs", "--slot", "@slot@", "--payload", "@payload@", "--firmware", "@firmware@", "--rootfs", "@rootfs@", "--verity-table", "@verity-table@", "--product", "@product@", "--version", "@version@", "--build", "@build@", "--medium", "@medium@", "--payload-out", "@payload-out@", "--out", "@out@"]
key_args = ["--key-file", "@key@", "--expect-key-id", "@key-id@"]
verify = ["bundle", "--layout-of", "@description@", "--socs", "@source@/socs", "--verify", "@out@"]
verify_key_args = ["--pubkey", "@pubkey@"]

# The data partition's contents (slot-disk): the slot installed from the bundle above, in Lemnos's own layout, into the directory
# @out@ that Gaia makes an ext4 filesystem of, at the board's partition size. Flags from Lemnos pr/M36 9f5e0b0f, spelt as Gaia PR 145
# and the Gaia pin 498873cf take them (src-498873c, crates/nodes/tree/src/generate_image.rs):
#   @boot-image@  the boot step's image (the bay that holds the bundle's slot).
#   @keys@        `keys = "files/slot-keys"` below: the bench key's public line, the trust list the image ships.
#   @time@        "@time@ is Gaia's fixed build date, 1970-01-01T00:00:00Z (epoch 0), the same for every build."
#   @data-size@   the size of the board's partition named by data_name ("data"): boards/raze/board.toml [[partitions]] size, 39,845,888.
#                 Gaia makes the ext4 at that size too, so this run and the filesystem cannot differ (wire.rs data_size). The number
#                 lives in board.toml only; product.toml has no data_size at 498873cf.
# --layout-of and --socs are named as [generate.bundle] names them. --switch off is the default and is left out.
# OPEN (the rest, after Gaia's placeholders): Lemnos M36's rev must carry the data-partition tool, the offline writer with no reserve
# (the first write checks only that the slot fits --data-size), and the first-start grow of p2 (Lemnos M36b). Until that rev is pinned,
# this run is not proven.
# verify: the same tool reads the tree back with the boot image, deep (Lemnos pr/M36 `--verify DIR --layout-of BOARD --boot-image FILE --deep`).
[generate.data]
args = ["data-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--install", "@bundle@", "--boot-image", "@boot-image@", "--keys", "@keys@", "--time", "@time@", "--data-size", "@data-size@", "--out", "@out@"]
verify = ["data-partition", "--verify", "@out@", "--layout-of", "@description@", "--socs", "@source@/socs", "--boot-image", "@boot-image@", "--deep"]
keys = "files/slot-keys"

# The SoC description lemnosd checks the live device tree against (/usr/share/lemnos/socs/<soc>.toml, the board file's
# `soc`; LEMNOS_SOCS overrides the directory). Lemnos's packaging list never carried it; it is in the image contract
# since 2026-11-20 (coordinator, after the D1 rehearsal: lemnosd said "live tree not checked: ... No such file").
# scripts/check-slot-mounts.sh requires it for every board file in the root that names a soc.
[[install]]
from = { source = "lemnos", path = "socs/bcm2712-rp1.toml" }
to = "/usr/share/lemnos/socs/bcm2712-rp1.toml"
mode = "0644"

[[install]]
from = { source = "lemnos", path = "packaging/systemd/lemnosd.service.d/gadget.conf" }
to = "/etc/systemd/system/lemnosd.service.d/gadget.conf"
mode = "0644"

# lemnosd starts as root and drops to user lemnos itself (Lemnos L3): no setcap, no xattrs, no ExecStartPre
# helper. The gadget's UDC writes are made by the daemon after the drop.

# The trust root (Lemnos S2b: [security] keys is the one key list): one line per key, `<64 hex public key> <owner>`.
# The bench key's PUBLIC line only (boards/raze/lemnos-board.toml [security] keys = /etc/lemnos/slot-keys; the bench key
# is `atlas-next bench-key`'s, milestone 2, a test credential: not for any released image). It holds no secret.
[[install]]
from = { file = "files/slot-keys" }
to = "/etc/lemnos/slot-keys"
mode = "0644"

# No gadget modules here: the gadget is one configuration built by Lemnos's usb-gadget driver from the
# board file (Lemnos Q2a, with the generated overlay's UDC). dev's board-usb-gadget.conf is not carried.

# lemnos.ko's modprobe.d fragment: the generated modprobe.conf (`lemnos-ctl tree --modprobe`), installed as Lemnos
# documents (`lemnos.conf` in /etc/modprobe.d/, docs/boards.md and Q2c). lemnos.ko is built by components/lemnos-module
# against this image's kernel and loaded at boot by components/lemnos (modules-load.d); these are its options.
[[install]]
from = { generated = "modprobe.conf" }
to = "/etc/modprobe.d/lemnos.conf"
mode = "0644"

# The overlay, the command line and the manifest's overlay marker have their consumers through [generate.provides]
# (Gaia's slot-boot): the overlay is compiled by the build and written as the boot partition's overlays/lemnos-board.dtbo;
# the cmdline words go into the slot's cmdline.txt; manifest-boot into the bundle's manifest. None is hand-copied.

# i2c-dev: /dev/i2c-N, which lemnosd opens for the buses (its groups are set by 70-lemnos.rules).
# The board's own device-node rules (Lemnos 7b4fdb25, packaging/README.md; docs/boards.md, "The daemon's device
# permissions"): the module's nodes, the board's dma-heaps, and the late hwmon and PWM grants (HOTPLUG-GRANT), generated
# from the board file by `lemnos-ctl tree --udev`, installed beside 70-lemnos.rules as Lemnos names it.
[[install]]
from = { generated = "lemnos-board.rules" }
to = "/usr/lib/udev/rules.d/71-lemnos-board.rules"
mode = "0644"

[[install]]
from = { file = "files/raze-i2c-dev.conf" }
to = "/usr/lib/modules-load.d/raze-i2c-dev.conf"
mode = "0644"

# Hand-written and kept beside the generated 71-lemnos-board.rules: `lemnos-ctl tree --udev` grants the lemnos group its
# nodes, and this rule is not one of those.
# USB power policy, not a Lemnos-user rule: it sets power/control=on and USB2 LPM off for every USB
# device when udev adds it, because USB autosuspend dropped external cameras on dev. udev runs it as
# root, so it gives the lemnos user nothing.
[[install]]
from = { file = "files/60-raze-usb-power.rules" }
to = "/usr/lib/udev/rules.d/60-raze-usb-power.rules"
mode = "0644"

# F3-1 (Lemnos 7d91d645 OWNER-PROBE-ACCESS, coordinator 2026-11-21). The board file has a system-slots device and a
# [security] table, so Lemnos's packaging contract (packaging/README.md, scripts/check-packaging-files.py) needs both
# drop-ins below. slots.conf: ProtectSystem=strict leaves /data read-only to lemnosd, and the slot driver writes
# /data/board/slots and /data/slots (data = /data in the board file, so the drop-in ships unchanged). Without it slot
# management refuses every write (state-unwritable). security.conf: the switch's record dir and /run/board.
[[install]]
from = { source = "lemnos", path = "packaging/systemd/lemnosd.service.d/slots.conf" }
to = "/etc/systemd/system/lemnosd.service.d/slots.conf"
mode = "0644"

[[install]]
from = { source = "lemnos", path = "packaging/systemd/lemnosd.service.d/security.conf" }
to = "/etc/systemd/system/lemnosd.service.d/security.conf"
mode = "0644"

# The security render unit (`lemnos-ctl tree --security-unit`, from the board file's [security] table). Reason: it
# makes /run/board (RuntimeDirectory, the daemon's user) and /var/lib/lemnos (StateDirectory) before lemnosd starts.
# security.conf names /run/board without a `-`, so lemnosd cannot start where nothing made it. It also renders the
# view /run/board/security. NOT added: the /etc/board -> /run/board link (packaging/README.md). Reason: the console gate
# (raze-base-files console-allowed) reads /etc/board/security and keeps reading an absent view (console open, as on D1)
# until the switch is ruled on separately; Gaia has no link form at our pin either.
[[install]]
from = { generated = "security.service" }
to = "/usr/lib/systemd/system/lemnos-board-security.service"
mode = "0644"

[[services]]
unit = "lemnos-board-security.service"
enable = true
