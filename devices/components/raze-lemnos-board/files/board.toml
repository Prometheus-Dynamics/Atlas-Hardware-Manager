# Raze's board file for lemnosd, in Lemnos's board format at 26364ff (docs/boards.md; the
# daemon refuses unknown keys by name). Ported from dev's devices/raze board.toml, which was
# written for an older Lemnos format; see the PR text for each change.
#
# UNVERIFIED on a board: a bus name (`i2c-1`), a thermal zone path, and the RP1 GPIO chip number
# (`gpiochip4`). They are the dev package's hints for the 7.2.9 image; lemnosd retries a device
# that is not there and says why, so a wrong one shows as `retrying`, not a silent failure.
format = "lemnos.board"
schema_version = 1

[board]
id = "raze"

# The BMI088: one chip, two dies (accelerometer at 0x18, gyroscope at 0x68), on the RP1 PIO bus
# GPIO8 SDA / GPIO7 SCL (no kernel adapter, so no /dev/i2c node for it).
[[devices]]
id = "imu"
driver = "bmi088"
bus = "pio-i2c:sda=8,scl=7,hz=400000"
config = { accel_address = 0x18, gyro_address = 0x68, accel_rate = 200, gyro_rate = 200 }

# The BMM150 magnetometer at 0x10 and the INA238 power monitor at 0x40 on the hardware bus.
[[devices]]
id = "magnetometer"
driver = "bmm150"
bus = "i2c-1"
config = { address = 0x10 }

[[devices]]
id = "power"
driver = "ina2xx"
bus = "i2c-1"
config = { chip = "ina238", address = 0x40, shunt_micro_ohms = 10000, max_current_micro_amps = 16384000 }

# Orientation fused from the IMU and the magnetometer. Mount and declination are unset (zero), as
# dev has them; dev's Mahony gains.
[[devices]]
id = "orientation"
driver = "orientation"
uses = { accel = "imu", gyro = "imu", mag = "magnetometer" }
config = { sample_rate_hz = 100, algorithm = "mahony", kp = 1.0, ki = 0.05 }

# The fan on RP1 PWM1, a hwmon node named pwmfan (dev's overlay raze-fan drives it; see the PR text
# on that overlay). lemnosd takes it over on the first duty and gives it back to the governor on release.
[[devices]]
id = "fan"
driver = "hwmon-fan"
config = { name = "pwmfan" }

# The CM5's cpu-thermal zone, read for the fan's governor. UNVERIFIED index.
[[devices]]
id = "cpu-thermal"
driver = "thermal-zone"
config = { path = "/sys/class/thermal/thermal_zone0" }

# The two port power enables: USB-A on RP1 GPIO20 and USB-C on GPIO16, both active high, on from
# lemnosd's start (default_on). UNVERIFIED chip number.
[[devices]]
id = "usb-a-power"
driver = "gpio-power-switch"
uses = { line = "gpiochip4:20" }
config = { default_on = true }

[[devices]]
id = "usb-c-power"
driver = "gpio-power-switch"
uses = { line = "gpiochip4:16" }
config = { default_on = true }

# PROVISIONAL (Lemnos Q2): the OV9782 sensor. Disabled until the camera overlay lands (PR text).
# continuous_clock is Lemnos's name for dev's clk-continuous.
[[devices]]
id = "camera-sensor"
driver = "ov9782"
bus = "i2c-10"
disabled = true
config = { address = 0x60, continuous_clock = true }

# NOT in this file, and why (see the PR text):
#  - the 16-LED ring (ws2812 on GPIO13): no path on next until Lemnos Q1 lands (its PIO transport).
#    The ring is dark until then.
#  - the USB gadget (ECM network, ACM serial): Lemnos's usb-gadget driver takes a UDC name, and
#    this board's UDC name is not known, and 26364ff has no ECM function.
#  - the camera (OV9782): the sensor is Lemnos's ov9782 driver, but the receiver and ISP that feed
#    it are the camera stack's (Styx).
