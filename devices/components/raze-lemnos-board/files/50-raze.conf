# Raze: what lemnosd writes outside its own device nodes. The fan's PWM (the pwmfan hwmon node) and
# the USB gadget (configfs) are root-owned sysfs trees, and lemnosd runs as user lemnos with only
# CAP_SYS_RAWIO (lemnosd.service). This drop-in adds CAP_DAC_OVERRIDE and nothing else: with it the
# lemnos user passes the file-permission checks on those writes, without becoming root. The unit
# also has ProtectKernelTunables=yes, which mounts /sys read-only; ReadWritePaths lifts that for
# the two trees the writes go through, and nothing else.
#
# Narrower alternatives considered: a udev rule that chgrps the pwm files covers the fan only, and
# configfs directories are made at run time by lemnosd, so no udev rule can give the gadget write
# access. Not tested on a board yet (G1 runs it).
[Service]
CapabilityBoundingSet=CAP_SYS_RAWIO CAP_DAC_OVERRIDE
AmbientCapabilities=CAP_SYS_RAWIO CAP_DAC_OVERRIDE
ReadWritePaths=/sys/devices /sys/kernel/config
