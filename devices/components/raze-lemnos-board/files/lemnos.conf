# Raze: lemnos.ko (when the image ships it; Lemnos's packaging/systemd/lemnos-module.conf is not
# installed yet) takes the camera's receiver and ISP devices, which the stock rp1-cfe and pispbe
# modules would otherwise claim (both are left out of the kernel: raze.config). Lemnos's
# docs/kernel-module.md gives these options.
options lemnos owned=raspberrypi,rp1-cfe,raspberrypi,pispbe pisp_be=raspberrypi,pispbe
