# The bcm2712 flasher's lemnos-restart, in the same form as components/lemnosd, at the flasher's own Lemnos rev.
# Its own component, not a shared one, because the flasher is pinned at Lemnos next da86d0b3 (FLASH-BCM2712, with
# reboot_to from 4a65e473), confirmed by the coordinator for the D6 flasher only, while the Raze product and build10
# stay on their own Lemnos (raze-base: 7b4fdb25). Gaia has no per-product source override, so the rev lives here.
version = 1
name = "flasher-lemnos-restart"
description = "the bcm2712 flasher's lemnos-restart (Lemnos da86d0b3, service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "da86d0b38903853cdd40093da1ab1618ac4b5e55"  # Lemnos next, FLASH-ANSWERS

# The Rust release the build uses (Gaia 08e71181): rustc, cargo and each target's std, the official files pinned by the
# lock. The build machine's rustup is never read. Every board here is aarch64 (static musl).
[sources.toolchain]
rust = "1.99.0"
targets = ["aarch64-unknown-linux-musl"]

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-restart"
profile = "service"

[[install]]
from = "bin/lemnos-restart"
to = "/usr/bin/lemnos-restart"
mode = "0755"
