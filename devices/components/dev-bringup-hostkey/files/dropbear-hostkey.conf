# DEV ONLY (bring-up). Dropbear's host key on the data partition, so a reflash or a slot change keeps it.
# Buildroot's dropbear.service (package/dropbear/dropbear.service, 2026.02.3) keeps its keys under /etc/dropbear,
# a symlink to /var/run/dropbear: RAM, so a new key at every boot. Its Config.in says the same. This drop-in
# gives dropbear one ed25519 host key on /data/dropbear, made once by dropbearkey (installed by the dropbear
# package as /usr/bin/dropbearkey, package/dropbear/dropbear.mk) and named to dropbear with -r.
# ExecStart is Buildroot's line with -r added; -s (key-only logins) still comes from /etc/default/dropbear.
# Buildroot's own ExecStartPre (the /etc/dropbear symlink check) stays: it does nothing on this layout.
[Unit]
RequiresMountsFor=/data

[Service]
ExecStartPre=/bin/sh -c 'umask 077; mkdir -p /data/dropbear; test -f /data/dropbear/dropbear_ed25519_host_key || /usr/bin/dropbearkey -t ed25519 -f /data/dropbear/dropbear_ed25519_host_key'
ExecStart=
ExecStart=/usr/sbin/dropbear -F -r /data/dropbear/dropbear_ed25519_host_key $DROPBEAR_ARGS
