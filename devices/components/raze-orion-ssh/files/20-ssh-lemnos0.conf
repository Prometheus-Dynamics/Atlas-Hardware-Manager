# Orion's SSH on the USB network (lemnos0) and wired Ethernet (end0, the CM5's RP1 GEM as systemd names it): one listener
# kept to each at port 22, each waited for if it is not there yet (Orion 5b94401's interface lists; components/raze-orion-ssh
# says why). Never a wildcard. The quotes keep the list one assignment: systemd splits an unquoted Environment= at the space.
[Service]
Environment="ORION_SSH_INTERFACE=lemnos0, end0"
