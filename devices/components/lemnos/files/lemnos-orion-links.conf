# Atlas (the Raze image): the bridge offers the Raze's USB link to the comm core. LEMNOS_ORION_LINKS=<board device
# id>=<comm core link name>: `gadget` is the usb-gadget device id in devices/boards/raze/lemnos-board.toml, and
# `orion-link` is links.usb in devices/components/orion/files/orion.conf (one name on both sides; checked by
# scripts/check-orion-link.py). Lemnos's example env file does not carry this line, and it is not forked: this drop-in
# sets it. Unset, the bridge offers no link at all. MOVES: to the generated output at Lemnos R1j.
[Service]
Environment=LEMNOS_ORION_LINKS=gadget=orion-link
