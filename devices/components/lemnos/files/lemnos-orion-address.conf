# Atlas (the Raze image): the bridge publishes through this node's own comm core, by its local socket. The bridge
# refuses a network or signed-serial ORION_ADDRESS at start (Lemnos service/orion/src/config.rs: publishes_on), so the
# address is named as the local socket here: unix:/run/orion/orion.sock, the socket the orion component's comm core
# listens on (RuntimeDirectory=orion). Unset would mean the same socket; it is written out so the image's bridge does
# not depend on that default. The bridge's user is in the orion group for the socket (lemnos-orion, component.toml).
[Service]
Environment=ORION_ADDRESS=unix:/run/orion/orion.sock
