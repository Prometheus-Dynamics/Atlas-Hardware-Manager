version = 1
name = "lemnos"
description = "Lemnos: the daemon that owns board management as drivers (update, slots, reboot, USB). Built from the Lemnos repository's next branch."

# Lemnos `next` at 890cb50 (origin/next, read for this PR). Workspace version 2.0.1-dev
# at that commit (Cargo.toml [workspace.package]); `~dev` orders it below the release, as opkg does.
[sources.lemnos]
git = "https://github.com/Prometheus-Dynamics/Lemnos.git"
ref = "890cb50f7e88e80a585db4c42a7e086221b11338"

# `lemnosd` built for aarch64 musl, as Lemnos's .cargo/config.toml and
# docs/testing.md build it. `lemnos-ctl` is a second package in the same
# build; the locked rust builder takes one package, so it is not built here.
[build]
builder = "rust"
source = "lemnos"

[build.settings]
package = "lemnosd"
triple = "aarch64-unknown-linux-musl"

[package]
version = "2.0.1~dev"
architecture = "aarch64"
maintainer = "Prometheus Dynamics"
description = """
Lemnos: the board-management daemon on this controller.
"""
depends = []

# Lemnos ships no systemd unit, preset or settings file on next; a unit is
# not written here until Lemnos packages one (see the PR text).
