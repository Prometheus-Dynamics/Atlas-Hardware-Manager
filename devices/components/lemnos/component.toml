# Lemnos's packaging for an image with systemd, at Lemnos next f4a295c6 (I5j merged): the units, udev rules
# and settings files, at the paths Lemnos's packaging/README.md gives (the "one privilege path": no
# setcap, no xattrs, no User= in the units; lemnosd starts as root and drops itself). Board-neutral.
#
# The binaries are the four Rust components beside this one (lemnosd, lemnos-ctl, lemnos-orion,
# lemnos-slot-init), one cargo package each. Not installed here, and why:
#   - init/S50lemnosd, init/S51lemnos-orion, init/mdev.conf.fragment: BusyBox init, for an image
#     without systemd (this image has systemd).
#   - systemd/lemnos.conf: the sysusers file; the users are this file's [[users]] declarations, with fixed ids
#     (see there).
version = 1
name = "lemnos"
description = "Lemnos packaging for systemd: the lemnosd, lemnos-orion and lemnos-restart units, the lemnos and lemnos-orion users, the device-node rules, the settings files"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "a6251ecfb815752880f399e4e137634d022d4a2d"  # Lemnos a6251ecf (next: pin move 10's 7b4fdb25 plus WAY-BACK-TOOL, BOOTFILES-OWNER, TICK-BOUND and TRIAL-COUNT), coordinator 2026-11-22, pin move 11; before: 7b4fdb25

[[install]]
from = { source = "src", path = "packaging/systemd/lemnosd.service" }
to = "/usr/lib/systemd/system/lemnosd.service"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/lemnos-orion.service" }
to = "/usr/lib/systemd/system/lemnos-orion.service"
mode = "0644"

# Not installed: Lemnos's sysusers file (packaging/systemd/lemnos.conf). Gaia makes the users from the [[users]] and
# [[groups]] declarations below (DO 32), and that file states no fixed ids (`u lemnos -`), which would disagree with
# the ids the image ships (no file on the image states an id other than the one that ships: coordinator 2026-11-20).

# The restart helper's units (Lemnos RESTART-UNIT, pin move 10): lemnosd drops to user lemnos, which cannot restart the
# board (no polkit on a board), so the slots driver and system-reboot ask the root helper on /run/lemnos-restart.sock.
# lemnosd.service Wants= the socket; the socket is enabled below and starts the service on the first connection. The
# helper's binary is the lemnos-restart component.
[[install]]
from = { source = "src", path = "packaging/systemd/lemnos-restart.socket" }
to = "/usr/lib/systemd/system/lemnos-restart.socket"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/lemnos-restart.service" }
to = "/usr/lib/systemd/system/lemnos-restart.service"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/udev/70-lemnos.rules" }
to = "/usr/lib/udev/rules.d/70-lemnos.rules"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/lemnosd.env.example" }
to = "/etc/lemnos/lemnosd.env"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/lemnos-orion.env.example" }
to = "/etc/lemnos/lemnos-orion.env"
mode = "0644"

# lemnos.ko is loaded at boot (Lemnos packaging/files.txt: `systemd,kmod`, an image that ships lemnos.ko): the module is
# built by components/lemnos-module, which every product listing this component lists too (the Raze). Its options
# (owned= and the rest) are the generated modprobe.d file the Raze board component installs.
[[install]]
from = { source = "src", path = "packaging/systemd/lemnos-module.conf" }
to = "/usr/lib/modules-load.d/lemnos.conf"
mode = "0644"

# The Raze's USB link for the bridge (Atlas, not Lemnos's example): LEMNOS_ORION_LINKS=gadget=orion-link, as a drop-in on
# lemnos-orion.service. MOVES to the generated output at Lemnos R1j; then this drop-in goes.
[[install]]
from = { file = "files/lemnos-orion-links.conf" }
to = "/etc/systemd/system/lemnos-orion.service.d/10-raze-links.conf"
mode = "0644"

# The users Lemnos's units run as, made at build time by Gaia from these declarations: the image's root is read-only,
# so systemd-sysusers cannot add them at boot. FIXED IDS (coordinator's ruling 2026-11-20): any user that can own files
# on /data has a fixed id, so an image update never orphans its files. lemnos 900:900 is the id in 993's /etc/passwd
# and /etc/group (Raze #2's running image, read from its root; route A keeps 993's /data); lemnos-orion 903:903 is
# Atlas's choice (Lemnos's packaging leaves the bridge's id to the OS): 993 has no such user, and 902 is Orion's
# orion-comm since Orion C52 (its sysusers file fixes it). Moved from 902 in pin move 1, before any board ran it. The product's
# os/data-owners table repeats them with the reason, and scripts/check-slot-users.sh holds the root to it.
[[groups]]
name = "lemnos"
gid = 900

[[groups]]
name = "lemnos-orion"
gid = 903

[[users]]
name = "lemnos"
uid = 900
group = "lemnos"

[[users]]
name = "lemnos-orion"
uid = 903
group = "lemnos-orion"
groups = ["lemnos", "orion"]

[[services]]
unit = "lemnosd.service"
enable = true

[[services]]
unit = "lemnos-orion.service"
enable = true

[[services]]
unit = "lemnos-restart.socket"
enable = true
