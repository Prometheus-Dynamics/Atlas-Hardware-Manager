# Lemnos's packaging for an image with systemd, at Lemnos next 4a2d3b7d: the units, sysusers, udev rules
# and settings files, at the paths Lemnos's packaging/README.md gives (the "one privilege path": no
# setcap, no xattrs, no User= in the units; lemnosd starts as root and drops itself). Board-neutral.
#
# The binaries are the four Rust components beside this one (lemnosd, lemnos-ctl, lemnos-orion,
# lemnos-slot-init), one cargo package each. Not installed here, and why:
#   - init/S50lemnosd, init/S51lemnos-orion, init/mdev.conf.fragment: BusyBox init, for an image
#     without systemd (this image has systemd).
#   - systemd/lemnos-module.conf: loads lemnos.ko, which this kernel does not build yet (the
#     generator's modprobe.d output is the module's options; see the Raze board component).
version = 1
name = "lemnos"
description = "Lemnos packaging for systemd: the lemnosd and lemnos-orion units, the lemnos and lemnos-orion users, the device-node rules, the settings files"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "4a2d3b7d07573d0406f1e8aa7a73248ad123646f"

[[install]]
from = { source = "src", path = "packaging/systemd/lemnosd.service" }
to = "/usr/lib/systemd/system/lemnosd.service"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/lemnos-orion.service" }
to = "/usr/lib/systemd/system/lemnos-orion.service"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/lemnos.conf" }
to = "/usr/lib/sysusers.d/lemnos.conf"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/udev/70-lemnos.rules" }
to = "/usr/lib/udev/rules.d/70-lemnos.rules"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/lemnosd.env.example" }
to = "/etc/lemnos/lemnosd.env"
mode = "0644"

[[install]]
from = { source = "src", path = "packaging/systemd/lemnos-orion.env.example" }
to = "/etc/lemnos/lemnos-orion.env"
mode = "0644"

# The users the sysusers file names (lemnos and lemnos-orion), made at build time as well: the
# image's root is read-only, so systemd-sysusers cannot add them at boot. No fixed ids (Lemnos's
# sysusers file leaves them to the system).
[[groups]]
name = "lemnos"

[[groups]]
name = "lemnos-orion"

[[users]]
name = "lemnos"
group = "lemnos"

[[users]]
name = "lemnos-orion"
group = "lemnos-orion"
groups = ["lemnos", "orion"]

[[services]]
unit = "lemnosd.service"
enable = true

[[services]]
unit = "lemnos-orion.service"
enable = true
