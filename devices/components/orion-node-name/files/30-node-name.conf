# Atlas: the board's Orion name from its serial (orion-node-name writes ORION_NODE_NAME at boot). Wants, not Requires:
# if the name program fails the unit still starts, under orion.conf's node.name. The leading "-": an absent file is
# not an error, it means orion.conf's name.
[Unit]
Wants=orion-node-name.service
After=orion-node-name.service

[Service]
EnvironmentFile=-/run/orion-node-name/node-name.env
