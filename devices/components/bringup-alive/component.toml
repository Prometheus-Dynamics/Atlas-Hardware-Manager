# The bring-up board's watchdog and LED signs, shared by every bring-up product (zero-3e, rock-5c, rock-4d,
# cubie-a7). DEV ONLY with the bring-up: it is the signal a person has with no serial adapter.
#
# Origin: adapted from Gaia's example component examples/components/board-alive at commit 0fb5637 (Gaia branch
# pr/board-alive; NOT our pinned Gaia, which is 3f6e561 since PR B32: a Gaia branch's commit is never a pin here). Changes made here, each with its reason:
#   - RuntimeWatchdogSec 30s -> 16s (files/10-watchdog.conf): 16 s is the A733 watchdog's hardware maximum
#     (sunxi_wdt.c WDT_MAX_TIMEOUT 16); on RK35xx the same request rounds up to the 22.4 s TOP (dw_wdt.c).
#   - The LED script changes only the LEDs and links a product names in /etc/board-alive.leds and
#     /etc/board-alive.links, and changes NOTHING when those files are absent (Gaia's script changed every
#     LED, and counted every non-gadget interface). The product's own settings component installs both files.
#   - The LED service never gives up (StartLimitIntervalSec=0), per the failure-handling rule.
#
# Requires, in the family kernel: a watchdog driver built in (DW_WATCHDOG on RK35xx, SUNXI_WATCHDOG on A733), and
# CONFIG_LEDS_TRIGGER_HEARTBEAT=y and CONFIG_LEDS_TRIGGER_TIMER=y (see the family fragments). systemd images only.
version = 1
name = "bringup-alive"
description = "Bring-up signs without a serial adapter: systemd arms the watchdog (16 s runtime, 2 min reboot), and the LEDs the product names beat from boot and change pattern when its link has an address."

[[install]]
from = { file = "files/10-watchdog.conf" }
to = "/etc/systemd/system.conf.d/10-bringup-watchdog.conf"
mode = "0644"

[[install]]
from = { file = "files/board-alive-led" }
to = "/usr/libexec/board-alive-led"
mode = "0755"

[[install]]
from = { file = "files/board-alive-led.service" }
to = "/etc/systemd/system/board-alive-led.service"
mode = "0644"

[[services]]
unit = "board-alive-led.service"
enable = true
