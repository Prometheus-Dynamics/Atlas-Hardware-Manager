# systemd opens the hardware watchdog when PID 1 starts and pings it every half of RuntimeWatchdogSec. A hang of
# PID 1 longer than RuntimeWatchdogSec resets the board. A restart or power-off that does not finish is cut after
# RebootWatchdogSec.
#
# RuntimeWatchdogSec=16s. Why 16 s:
#   - A733 (sun60i): the sunxi watchdog's hardware maximum is 16 s (drivers/watchdog/sunxi_wdt.c, WDT_MAX_TIMEOUT 16,
#     wdt_timeout_map). 16 s is served by the hardware itself, not by the watchdog core's software pings.
#   - RK3566, RK3588S, RK3576 (rk35xx): the timer is xin24m (drivers/clk/rockchip/clk-rk3568.c:1208, clk-rk3588.c:1060,
#     clk-rk3576.c:727), so the largest TOP is 2^31 / 24 MHz = 89.5 s (drivers/watchdog/dw_wdt.c). The smallest TOP
#     that is at least 16 s is 2^29 / 24 MHz = 22.4 s, so the RK35xx reset comes 22.4 s after the last ping.
#   - Margin: systemd pings every 8 s. A PID 1 stall of 16 s or more resets the board; the reset comes after one
#     missed ping plus the rounding. Services do not run in PID 1, so a slow first boot (a key made in ExecStartPre,
#     a mount, a DHCP wait) does not stop the pings. Only a stall of PID 1 itself does.
#   - Before PID 1 starts the watchdog is not open, so nothing resets during the kernel or the initramfs.
#
# RebootWatchdogSec=2min. Why 2 min, and what the hardware does:
#   - Above the hardware maximum the watchdog core keeps the watchdog fed while the kernel runs
#     (drivers/watchdog/watchdog_dev.c, watchdog_need_worker and watchdog_next_keepalive), so the request is served,
#     not refused. A reboot that stops the kernel is reset by the hardware at most 89.5 s after its last ping on
#     RK35xx, and at most 16 s after it on the A733. A reboot that stalls with the kernel alive is reset at 2 min.
#   - On the A733 that needs the DockSeed series patch sunxi-wdt-heartbeat (in families/sun60i/family.toml's series
#     pin): without it the mainline driver answers -EINVAL and systemd disarms the watchdog for the shutdown.
[Manager]
RuntimeWatchdogSec=16s
RebootWatchdogSec=2min
