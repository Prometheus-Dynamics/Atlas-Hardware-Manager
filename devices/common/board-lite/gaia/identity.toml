# How Atlas sees a board running: board-lite (crates/board-lite) serves the
# identity document on :5899 and advertises it by mDNS, read-only. It carries its
# own version, 2026.1.0-dev.<count>+<commit>, from the checkout it's built in.
# The binary goes to /usr/sbin/board-lite, and /etc/init.d/S41board-lite starts it.
#
# A board imports the file for its architecture (aarch64.toml, armv7.toml,
# riscv64.toml), which imports this, and names its model by redeclaring
# board_lite_model with a default in its device.toml.
config = 3
gaia_version = ">=2.0.0"

[inputs.board_lite_model]
description = "The model board-lite reports: the board's folder under devices/"
kind = "string"
required = true

[[install]]
id = "install-board-lite"
artifact = "board-lite"
dest = "/usr/sbin/board-lite"
replace = true
mode = 493 # 0755

[[stage.files]]
id = "board-lite-init"
dest = "/etc/init.d/S41board-lite"
origin = "static-asset"
mode = 493 # 0755
content = """
#!/bin/sh
# The board's identity contract for Atlas (crates/board-lite): its identity on
# :5899 and its mDNS advertisement. Read-only. It waits for an address by
# itself, so it doesn't matter whether DHCP has finished.

case "$1" in
start | "")
	/usr/sbin/board-lite --model ${input.board_lite_model} > /dev/null 2>&1 &
	;;
stop)
	killall board-lite 2> /dev/null
	;;
esac
exit 0
"""

[image]
kind = "buildroot"

[image.feed]
install_entries = ["install-board-lite"]
stage_files = ["board-lite-init"]
