config = 3
description = "What every Atlas board runs: identity endpoint and mDNS, default hostname, USB gadget network and serial, updates and slots, data partition, SSH keys, status and self-test."

# Shared by every board package of this OS ecosystem, whatever the hardware;
# a package imports this file from its device.toml, and adds what only it has
# (generated hardware description, LEDs, sensors). What depends on the boot
# chip is in the family's layer (devices/families/).
#
# Units are installed in /usr/lib/systemd/system (not /etc), so an OS or user
# can mask or replace them, and are enabled by 70-board.preset when the
# image is built. Defaults live in /usr/lib/board/*.env and are overridden
# by files of the same name in /etc/board/. Requires systemd as init and
# systemd-resolved for the mDNS advertisement (see devices/README.md).

imports = [
  "./data.toml",
  "./board-agent.toml",
  "./board-stream.toml",
]

