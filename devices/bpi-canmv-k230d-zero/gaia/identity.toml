# BPI-CanMV-K230D-Zero: how Atlas sees the board running. board-lite
# (crates/board-lite in this Atlas repository) serves the identity document on
# :5899 and advertises it by mDNS, read-only. A static riscv64 musl binary (this target links dynamically unless told +crt-static)
# at /usr/sbin/board-lite, and /etc/init.d/S41board-lite to start it. It carries
# its own version, 2026.1.0-dev.<count>+<commit>, from the checkout it's built
# in. Network: none yet: the board has no Ethernet, and Gaia's image sets up no Wi-Fi. Written from Atlas's contract; untested on a board.
config = 3
gaia_version = ">=2.0.0"

[providers.rust]
allow_nested_build = true

[[artifacts]]
id = "board-lite"
kind = "rust"
source = "atlas"
package = "board-lite"
target = "riscv64gc-unknown-linux-musl"
profile = "device-small"
target_name = "board-lite"
install_name = "board-lite"
install_class = "binary"
install_dest_hint = "/usr/sbin/board-lite"
output_path = "${outputs.dir}/artifacts/board-lite/board-lite"
build_env = [["CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER", "rust-lld"], ["CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS", "-C target-feature=+crt-static"]]

[artifacts.execution]
backend = "host"

[[install]]
id = "install-board-lite"
artifact = "board-lite"
dest = "/usr/sbin/board-lite"
replace = true
mode = 493 # 0755

[[stage.files]]
id = "k230d-zero-board-lite-init"
src = "${self}/assets/rootfs/etc/init.d/S41board-lite"
dest = "/etc/init.d/S41board-lite"
origin = "static-asset"
mode = 493 # 0755

[image]
kind = "buildroot"

[image.feed]
install_entries = ["install-board-lite"]
stage_files = ["k230d-zero-board-lite-init"]
