# BPI-CanMV-K230D-Zero device support from Atlas: everything an OS imports, so a later
# addition here needs no change there. Import it from a source named `atlas`
# (Gaia's examples/boards/k230d-zero):
#
#   imports = [
#     { source = "atlas", path = "devices/bpi-canmv-k230d-zero/gaia/device.toml" },
#   ]
# Network: none yet: the board has no Ethernet, and Gaia's image sets up no
# Wi-Fi.
# Written from Atlas's contract; untested on a board.
config = 3
gaia_version = ">=2.0.0"

imports = ["../../common/board-lite/gaia/riscv64.toml"]

[inputs.board_lite_model]
description = "The model board-lite reports"
kind = "string"
default = "bpi-canmv-k230d-zero"
