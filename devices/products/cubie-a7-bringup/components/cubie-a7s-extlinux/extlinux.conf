# DEV ONLY (bring-up). Candidate, UNVERIFIED, never booted. U-Boot's distro boot reads this from the first
# partition. The rootfs holds the kernel and the board's dtb under /boot (Buildroot's install).
#
# devicetree: the bring-up board's dtb, the A7S's dts with the status LED's heartbeat (board/assets/dts).
#   A new file name, so the series' own dtb is not overwritten.
# console=ttyS0,115200: the kernel console on UART0 (the earlier Gaia A733 build's console; not a board run).
#   There is NO serial adapter for the bring-up: this line is kept for when one is attached, and nothing
#   depends on it.
# The USB network is Gaia's usb-gadget-network component (configfs NCM; PR B24): its addresses come from the
# board id (usb-gadget-family) and the serial, not from the kernel command line, so no g_ether.* argument here.
default rootfs
label rootfs
  kernel /boot/Image
  devicetree /boot/sun60i-a733-cubie-a7s-bringup.dtb
  append root=PARTLABEL=rootfs rootwait console=ttyS0,115200
