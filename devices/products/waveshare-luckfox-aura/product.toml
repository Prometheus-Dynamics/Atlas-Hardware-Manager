# Luckfox Aura: the bench product (AU1 draft). Its image is hand-flashed and never published (the closed DDR blob).
#
# The recipe is a PLACEHOLDER: `firmware` (the built tree as a tar). It is NOT the flashable image. The bench image
# must become the U-Boot slot form (Lemnos) once the RV1126B U-Boot port and Lemnos's RV1126B SoC map exist; until
# then this product plans nothing that boots. No gaia.lock is committed: Gaia writes it when its pins are given.
version = 1
name = "waveshare-luckfox-aura"
description = "Luckfox Aura: bench base OS (draft)"

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "813cbac680a73092e1ebb86da72972c44573145c"

[[images]]
name = "waveshare-luckfox-aura"
board = "../../boards/waveshare-luckfox-aura/board.toml"
os = { provider = "buildroot", source = "buildroot", fragments = [] }
recipe = "firmware"
