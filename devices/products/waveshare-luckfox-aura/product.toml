# Luckfox Aura: the base OS image, written in Gaia's F8 form (see the Pico Pro product).
# eMMC storage, so a whole-disk image is what the board takes; its layout is unconfirmed
# (open). Fails the device check at e90ee03 until the Gaia F8 pin moves. Untested on board (G6).
version = 1
name = "waveshare-luckfox-aura"
description = "Luckfox Aura: base OS"

# F8? Buildroot, as for the Pico Pro product.
[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.08"

[[images]]
name = "waveshare-luckfox-aura"
board = "../../boards/waveshare-luckfox-aura/board.toml"
# F8? the OS: Buildroot, no fragments yet.
os = { provider = "buildroot", source = "buildroot", fragments = [] }
# F8? an eMMC disk takes the disk recipe; its name and partition table are unconfirmed (open).
recipe = "disk"
