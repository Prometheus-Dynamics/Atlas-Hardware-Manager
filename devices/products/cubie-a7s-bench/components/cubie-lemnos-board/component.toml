# The A7S bench image's Lemnos board files: the board file, the bench trust line, the files lemnos-ctl writes from the board
# file (tree, bundle, boot partition). Modeled on components/raze-lemnos-board (Raze, pinned f4a295c6); this copy is pinned
# to pr/BB1b e2e45ce7 with the rest of the product's Lemnos components. Untested on board.
version = 1
name = "cubie-lemnos-board"
description = "Cubie A7S bench board files for lemnosd: the board file (from the board directory), the bench trust line, and the files lemnos-ctl writes (overlay, cmdline, slot bundle, boot partition)"

# /etc/lemnos/board.toml: the A7S's board file (devices/boards/radxa-cubie-a7s/lemnos-board.toml, named by its [descriptions]).
[[install]]
from = { description = "lemnos" }
to = "/etc/lemnos/board.toml"
mode = "0644"

# The Lemnos packaging is the product's own `lemnos` component (pr/BB1b e2e45ce7). The generator and the boot partition
# tool are lemnos-ctl at the same rev.
[sources.lemnos]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "e2e45ce795e922ff92cf6334586ed7fd66f9c3d1"  # Lemnos pr/BB1b e2e45ce7 (C1 bench image)

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

# The files `lemnos-ctl tree` writes from the board file: NO --boot-dir (the boot partition is one image from boot-partition),
# --manifest-boot from the same invocation as -o, --cmdline-slot with --slot. Flag names as in the Raze component (f4a295c6):
# CHECK at BB1b: `lemnos-ctl tree --help` was NOT run here (no build is run in this PR). UNVERIFIED.
[generate]
description = "lemnos"
tool = { source = "lemnos", package = "lemnos-ctl" }
args = [
  "tree", "--socs", "@source@/socs", "@description@",
  "-o", "@out@/overlay.dts",
  "--manifest-boot", "@out@/manifest-boot.json",
  "--modprobe", "@out@/modprobe.conf",
  "--cmdline", "@out@/cmdline.words",
  "--cmdline-slot", "@out@/cmdline-slot.words", "--slot", "@slot@",
]
outputs = ["overlay.dts", "manifest-boot.json", "modprobe.conf", "cmdline.words", "cmdline-slot.words"]

[generate.provides]
board-overlay = "overlay.dts"
manifest-boot = "manifest-boot.json"
cmdline = "cmdline.words"
cmdline-slot = "cmdline-slot.words"

# The boot partition: one image, written by the tool from the payload, at the image's boot_size (the board's boot partition).
[generate.image]
fit = ["boot-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--min-size", "--payload", "@payload@"]
args = ["boot-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--slot", "@slot@", "--payload", "@payload@", "--size", "@size@", "--out", "@out@"]
verify = ["boot-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--verify", "@out@"]

# The slot bundle: lemnos-ctl writes it from the payload, the root image and its verity table, signed by the key the
# environment names (sign_key_env). The bench key is a test credential: milestone 2 only, not for a released image.
[generate.bundle]
args = ["bundle", "--layout-of", "@description@", "--socs", "@source@/socs", "--slot", "@slot@", "--payload", "@payload@", "--rootfs", "@rootfs@", "--verity-table", "@verity-table@", "--product", "@product@", "--version", "@version@", "--payload-out", "@payload-out@", "--out", "@out@"]
key_args = ["--key-file", "@key@", "--expect-key-id", "@key-id@"]
verify = ["bundle", "--layout-of", "@description@", "--socs", "@source@/socs", "--verify", "@out@"]
verify_key_args = ["--pubkey", "@pubkey@"]

# The trust root (Lemnos [security] keys: one line per key, `<64 hex public key> <owner>`). The bench key's PUBLIC line only.
[[install]]
from = { file = "files/slot-keys" }
to = "/etc/lemnos/slot-keys"
mode = "0644"

# lemnos.conf for the modprobe.d fragment the generator writes (no lemnos.ko in this kernel; the file is what the module needs).
[[install]]
from = { generated = "modprobe.conf" }
to = "/etc/modprobe.d/lemnos.conf"
mode = "0644"
