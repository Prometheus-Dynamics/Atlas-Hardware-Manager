# One Lemnos cargo package: lemnos-ctl, built from Lemnos pr/BB1b e2e45ce7 (the C1 rev for the A7S bench image).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-ctl --profile service`.
version = 1
name = "lemnos-ctl"
description = "the Lemnos command-line client, lemnos-ctl (service profile; the board-file tool)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "e2e45ce795e922ff92cf6334586ed7fd66f9c3d1"  # Lemnos pr/BB1b e2e45ce7 (bench-board slot declarations; the pin follows the branch head until BB1b merges), the C1 rev for the A7S bench image

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-ctl"
profile = "service"

[[install]]
from = "bin/lemnos-ctl"
to = "/usr/bin/lemnos-ctl"
mode = "0755"
