# This product's name prefix for the shared bench-hostname component: the board is named cubie-a7s-<last six hex digits>.
# The one file the product gives the shared script (/etc/bench-hostname.prefix). Untested on board.
version = 1
name = "bench-hostname-prefix"
description = "This bench's hostname prefix: /etc/bench-hostname.prefix (cubie-a7s)."

[[install]]
from = { file = "files/bench-hostname.prefix" }
to = "/etc/bench-hostname.prefix"
mode = "0644"
