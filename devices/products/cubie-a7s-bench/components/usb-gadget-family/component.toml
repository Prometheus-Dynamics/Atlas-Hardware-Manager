# The board id the USB network's addresses are derived from: one line of /etc/usb-gadget.family, read by Gaia's
# usb-gadget-network script (the bring-up's own rule). It is the board's name (devices/README.md, "The board id"): frozen
# once an image ships. NOT the serial-hash-v1 addressing of the Raze (that is on the unmerged pr/Z1 branch).
version = 1
name = "usb-gadget-family"
description = "The bench board's id for the USB network's addresses: /etc/usb-gadget.family (radxa-cubie-a7s)."

[[install]]
from = { file = "files/usb-gadget.family" }
to = "/etc/usb-gadget.family"
mode = "0644"
