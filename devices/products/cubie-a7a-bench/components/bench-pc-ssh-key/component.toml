# The bench SSH login: the PC's own public key as root's authorized_keys, the one way in over SSH on this image.
# The PC key is a NAMED LOCAL INPUT: `{ input = "pc-key" }`, supplied by `gaia plan/build --input pc-key=PATH`. The PUBLIC
# key file must carry no comment (the ssh-ed25519 part only), which the Z1 branch's scripts/pc-key-strip.sh does
# (build-product.sh --pc-key; NOT on origin/next yet: see docs/prs/C1.md). The check on next supplies only `bench-key`,
# so this product's device step FAILS until pc-key is wired there. No key is committed.
# Dropbear keeps the host key in RAM (/etc/dropbear is a symlink to /var/run/dropbear on Buildroot): a new host key at
# each boot. TODO: keep it on the data partition (Lemnos owns /data on a slot board; the bring-up's dev-bringup-hostkey
# component is dev-only and not carried).
version = 1
name = "bench-pc-ssh-key"
description = "The bench's SSH login: the PC's public key as root's authorized_keys, key only (dropbear -s)."

[[install]]
from = { input = "pc-key" }
to = "/root/.ssh/authorized_keys"
mode = "0600"

[[install]]
from = { file = "dropbear.default" }
to = "/etc/default/dropbear"
mode = "0644"

[[services]]
unit = "dropbear.service"
enable = true
