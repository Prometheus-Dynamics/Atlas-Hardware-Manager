# One Lemnos cargo package: lemnos-orion, built from Lemnos Lemnos 31e0f736, the approved rev (the C1 rev for the A7A bench image).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-orion --profile service`.
version = 1
name = "lemnos-orion"
description = "the Lemnos bridge to Orion, lemnos-orion (service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "31e0f736a334260a7df2ea86bcfa358e9a640f08"  # Lemnos Lemnos 31e0f736, the approved rev (bench-board slot declarations; the pin follows the branch head until BB1b merges), the C1 rev for the A7A bench image

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-orion"
profile = "service"

[[install]]
from = "bin/lemnos-orion"
to = "/usr/bin/lemnos-orion"
mode = "0755"
