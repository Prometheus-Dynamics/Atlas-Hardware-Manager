# Luckfox Pico Pro: the base OS image (Gaia F8 form, pin 70a5133).
#
# The NAND slots are UBI volumes (the ubi partition on the board), written on the board by
# a Lemnos driver (Lemnos I5c, system.slots/1). Gaia has no UBI layout recipe at 70a5133, so
# this product uses `firmware` (the built tree as a tar) as a placeholder. It is NOT the
# flashable NAND image. The UBI-layout recipe and its exact fields are listed in the PR text.
version = 1
name = "luckfox-pico-pro"
description = "Luckfox Pico Pro: base OS"

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "813cbac680a73092e1ebb86da72972c44573145c"

[[images]]
name = "luckfox-pico-pro"
board = "../../boards/luckfox-pico-pro/board.toml"
os = { provider = "buildroot", source = "buildroot", fragments = [] }
recipe = "firmware"
