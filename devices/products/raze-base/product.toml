# The Raze base OS product, Gaia F8 form. One image: the Raze board, its OS (Buildroot, os/raze.fragment), the Lemnos
# and Orion components, and the root slot made by the `slot-disk` recipe (D1; slot-boot before it, L2d): the EROFS root with dm-verity, the
# initramfs, the compiled board overlay, the kernel command line, the slot bundle (`[generate.bundle]`, Lemnos's tool,
# signed by the BENCH key: milestone 2 only) and the boot partition (`[generate.image]`).
#
# Components named here but NOT on the image's component list (the check reads them, the image takes them another way):
#   lemnos-slot-init   goes in the slot's INITRAMFS: `initramfs = ["lemnos-slot-init"]` below, its install to /init.
#   orion-recovery     the recovery package: for an initramfs or flasher image (the flasher product, B9).
# Components on the image: the Lemnos packaging, lemnosd, lemnos-ctl, lemnos-orion; the Orion board image
# (orion-bin); the Raze's board file and the base files.
#
# THE PINS: Gaia is pinned at a6299c62 (devices/gaia.lock; c0d084fa and before, PR G12: --setting, keep_setid, the [generate.data] placeholders, @firmware@, @tool:NAME@).
# Its `slot-disk` recipe declares version and slot; the build gives both with --setting (scripts/version-rule.sh).
# Lemnos next c215f575: the FINAL Lemnos rev for this image, declared by the coordinator 2026-11-18 (with Orion 671d29d).
# It carries data-partition (M36f), HEALTH-TCP and boot-partition --add-to; its kernel module is unchanged since efcc2106.
# The one-rev rule moves zero-3e-bench's Lemnos copies to it as well (one Lemnos rev in the tree).
version = 1
name = "raze-base"
description = "Raze base OS: the Raze board with the Lemnos and Orion packages, as a root slot made by slot-disk"

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.08"

[components]
lemnos = "../../components/lemnos/component.toml"
lemnosd = "../../components/lemnosd/component.toml"
lemnos-ctl = "../../components/lemnos-ctl/component.toml"
lemnos-orion = "../../components/lemnos-orion/component.toml"
lemnos-slot-init = "../../components/lemnos-slot-init/component.toml"
raze-lemnos-board = "../../components/raze-lemnos-board/component.toml"
raze-base-files = "../../components/raze-base-files/component.toml"
lemnos0-addressing = "../../components/lemnos0-addressing/component.toml"
# rpi-dtmerge: a host tool for boot-partition --verify (M38); not built until a run names it (its component.toml).
rpi-dtmerge = "../../components/rpi-dtmerge/component.toml"
orion = "../../components/orion/component.toml"
orion-recovery = "../../components/orion-recovery/component.toml"
# The way in over SSH (Orion's, on lemnos0) and the bench's root comm core (bench only: a product image leaves it out).
raze-orion-ssh = "../../components/raze-orion-ssh/component.toml"
bench-comm-root = "../../components/bench-comm-root/component.toml"
# Bench only: the trial dead-man, so a new slot booted beside dev 993 with no login comes back to 993 (route A).
bench-trial-deadman = "../../components/bench-trial-deadman/component.toml"
# Bench only: lemnosd on the A1 bench board file (grow_data = false), for the route (A) trial boots beside dev 993.
bench-a1-board = "../../components/bench-a1-board/component.toml"

[[images]]
name = "raze-base"
board = "../../boards/raze/board.toml"
components = ["lemnos", "lemnosd", "lemnos-ctl", "lemnos-orion", "raze-lemnos-board", "raze-base-files", "lemnos0-addressing", "orion", "raze-orion-ssh", "bench-comm-root", "bench-trial-deadman", "bench-a1-board"]
initramfs = ["lemnos-slot-init"]
os = { provider = "buildroot", source = "buildroot", fragments = ["os/raze.fragment"] }
recipe = "slot-disk"

# The slot-disk settings (recipes/slot-disk.toml at 498873cf): the slot-boot settings below, and three more.
#  id          names the disk: its GUIDs and MBR signature are derived from it, so they hold across rebuilds. The image's name, as
#              Gaia's own example does (examples/products/zero-3e-demo/product.toml: `id = "zero-3e-demo"`).
#  board_id    the board's id, which the flasher checks the first-flash file against: the Raze's [board] id in
#              devices/boards/raze/lemnos-board.toml, "raze".
#  data_label  the data filesystem's label; Lemnos's slot-init finds the data partition by it. "lemnos-data" is the coordinator's
#              value for this draft, not yet checked against Lemnos's source (M36 is not at the pin).
#  The data partition's size is NOT a setting here: slot-disk takes it from boards/raze/board.toml (the partition named data_name).
#  The boot and data partition names are the defaults ("boot", "data"), which match boards/raze/board.toml.
# The slot-boot settings (recipes/slot-boot.toml at the gating rev; each names what it sets).
#  device          where the slot is read from (the verity tree is in it too). F8?: the zero-3e example uses /data/slots.
#  slot, version   NOT SET HERE: the product leaves both unset, and Gaia takes them as `--setting raze-base.slot=…` and
#                  `--setting raze-base.version=…` (the recipe declares them with no default). scripts/build-product.sh computes
#                  them from git and prints them; scripts/check-devices.sh and check-config-only.sh plan with a test value
#                  (CHECK_VERSION). version = the Atlas dev scheme, <release>-dev.<count>+<commit> (dev's scripts/version.sh:
#                  count = `git rev-list --count HEAD`, commit = `git rev-parse --short=8 HEAD`). slot = <product>-<version> with
#                  `+` read as `-`, lowercased: lowercase [a-z0-9._-], 1..64 bytes, no `+` (Lemnos). The one rule's one place is
#                  scripts/version-rule.sh (slot_id_for, atlas_version). A product that sets either is refused by check-devices.
#  product         lowercase [a-z0-9-], <= 64 bytes.
#  boot_size       the boot partition's size in bytes, the layout's (79 MiB = 82,837,504: the Raze's FAT boot partition,
#                  L2-partition-requirements 8.4; `boot-partition --min-size` says the minimum, the bays are in
#                  boards/raze/lemnos-board.toml [boot]). It must equal the board's boot partition (boards/raze/board.toml
#                  [[partitions]] role = "boot"); check-devices refuses two numbers.
#  compression     EROFS compression: lzma, the one the build's own mkfs.erofs writes (Buildroot's host tool has no zstd).
#                  The board measurement on the first Raze image decides the final value (lzma, lz4hc, zstd rows).
#  level           the lzma level, 6 (coordinator's ruling 2026-11-14, from dev's lzma options). Measured by Gaia's build from
#                  Atlas f8e7a2c6 with the five options below: EROFS root 18,178,048 bytes, against 26,841,088 with lzma's
#                  defaults and 38,621,184 with lz4hc (dev's root was 39,817,216). The five options are one row: their
#                  reasons are the same measurement.
#  dictsize        the lzma dictionary, 2,097,152 bytes (2 MiB), the same row. The kernel holds one dictionary per LZMA stream
#                  while the image is mounted, and raze.config caps the streams at 4: up to 8 MiB of dictionary while mounted,
#                  against the 64 MB goal. The kernel's limit is checked (Gaia read raspberrypi/linux 53679a5, Linux 7.2.9):
#                  the lzma dictionary must be 4096 bytes to 8 MiB (fs/erofs/decompressor_lzma.c:93, Z_EROFS_LZMA_MAX_DICT_SIZE =
#                  8 * Z_EROFS_PCLUSTER_MAX_SIZE, erofs_fs.h:326), so 2 MiB is inside.
#  cluster         the most bytes of a compressed cluster, 1,048,576 (1 MiB, a multiple of 4096), the same row. Bigger is
#                  smaller on disk and costs RAM and read time on the board. Kernel limit, checked the same way (53679a5): a
#                  compressed cluster may be at most 1 MiB physical (Z_EROFS_PCLUSTER_MAX_SIZE, erofs_fs.h:297) and 12 MiB
#                  decompressed (zmap.c:754), so 1 MiB is exactly at the physical limit, inside it. Fragments add no separate limit.
#  fragments       true: mkfs.erofs -Efragments, file tails and small files packed together, the same row. A kernel from 6.1.
#  ztailpacking    true: mkfs.erofs -Eztailpacking, a file's compressed tail kept beside its inode, the same row. A kernel from 5.17.
#                  Kernel check (this PR): the Raze kernel is raspberrypi/linux b005af66 (rpi-7.3.y, Linux 7.3.5, families/bcm2712
#                  family.toml; NOT 6.12 as the brief said) so both floors are met, and raze.config has CONFIG_EROFS_FS_ZIP_LZMA=y,
#                  the decoder for lzma. The five values are slot-boot recipe parameters (recipes/slot-boot.toml at c0d084fa).
#  sign_key_env    the environment variable that names the signing key's file (a raw 32-byte Ed25519 seed or 64 hex,
#                  mode 0600). Set by the build's caller, never written here: no key path or key material in any file.
#  sign_key_id     the key id the build is keyed on: SHA-256 of the 32-byte PUBLIC key. This is the BENCH key's id
#                  (9af003d92992f9c2211a1f5b8d33a08f610c5bae45c61f9f9f6c3a10442fdd64, `atlas-next bench-key`, next f5e41cbb).
#                  A bench credential: an image that leaves the bench needs a released key, its own id, and the
#                  board's [security] keys list must carry that key, not this one (the board file's keys file ships the
#                  bench line only, components/raze-lemnos-board/files/slot-keys).
#  sign_pubkey_env the environment variable that names the public half's file, for the tool to verify its own signature.
[images.settings]
device = "/data/slots/root.img"
product = "raze-base"
id = "raze-base"
board_id = "raze"
data_label = "lemnos-data"
boot_size = 82837504
compression = "lzma"
level = 6
dictsize = 2097152
cluster = 1048576
fragments = true
ztailpacking = true
sign_key_env = "ATLAS_BENCH_SEED_FILE"
sign_key_id = "9af003d92992f9c2211a1f5b8d33a08f610c5bae45c61f9f9f6c3a10442fdd64"
sign_pubkey_env = "ATLAS_BENCH_PUBKEY_FILE"
