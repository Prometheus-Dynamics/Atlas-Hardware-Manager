# The ZERO 3E slot board's Lemnos generation and installs (Z2): the board file lemnos-ctl reads, its generated outputs, and
# the slot bundle and boot partition. The Raze's raze-lemnos-board is the model (devices/components/raze-lemnos-board); the
# differences are the U-Boot form (record = "uboot", boards/radxa-zero-3e/lemnos-board.toml [boot] bays) and the boot
# partition's tool arguments, which are the same lines Gaia ran for the Raze.
# The board file is the BOARD's (devices/boards/radxa-zero-3e/lemnos-board.toml, named by its [descriptions]): one copy.
version = 1
name = "zero-3e-slot-board"
description = "ZERO 3E slot board: the Lemnos board file (U-Boot record), the generated overlay, cmdline and manifest, the slot bundle and the boot partition"

[sources.lemnos]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "31e0f736a334260a7df2ea86bcfa358e9a640f08"  # Lemnos next 31e0f736 (BB1b; pair with Orion 671d29d)

# The image lemnos-ctl is built in, and the generator runs in (the same as lemnos-ctl's own component).
[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

# The files `lemnos-ctl tree` writes from the board file (Lemnos BB1b, service/ctl/src/lib.rs fn tree; flags as the
# Raze's raze-lemnos-board, which Lemnos's L2d checked at f4a295c6). NO --boot-dir (I5i8: refused). --uboot-config is NOT
# requested: its lines are written into the U-Boot fragment by hand (devices/families/rk35xx/assets/u-boot.fragment), and
# the Lemnos generator omits CONFIG_ENV_MMC_USE_DT, which Atlas adds and the check refuses without (see docs/prs/Z2.md).
[generate]
description = "lemnos"
tool = { source = "lemnos", package = "lemnos-ctl" }
args = [
  "tree", "--socs", "@source@/socs", "@description@",
  "-o", "@out@/overlay.dts",
  "--manifest-boot", "@out@/manifest-boot.json",
  "--modprobe", "@out@/modprobe.conf",
  "--cmdline", "@out@/cmdline.words",
  "--cmdline-slot", "@out@/cmdline-slot.words", "--slot", "@slot@",
]
outputs = ["overlay.dts", "manifest-boot.json", "modprobe.conf", "cmdline.words", "cmdline-slot.words"]

[generate.provides]
board-overlay = "overlay.dts"
manifest-boot = "manifest-boot.json"
cmdline = "cmdline.words"
cmdline-slot = "cmdline-slot.words"

# The boot partition: one image, written from the payload (the bundle's boot files, as bundled), at the image's boot_size.
[generate.image]
fit = ["boot-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--min-size", "--payload", "@payload@"]
args = ["boot-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--slot", "@slot@", "--payload", "@payload@", "--size", "@size@", "--out", "@out@"]
verify = ["boot-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--verify", "@out@"]

# The slot bundle, signed by the key the environment names (the BENCH key: a test credential, milestone 2 only).
[generate.bundle]
args = ["bundle", "--layout-of", "@description@", "--socs", "@source@/socs", "--slot", "@slot@", "--payload", "@payload@", "--rootfs", "@rootfs@", "--verity-table", "@verity-table@", "--product", "@product@", "--version", "@version@", "--payload-out", "@payload-out@", "--out", "@out@"]
key_args = ["--key-file", "@key@", "--expect-key-id", "@key-id@"]
verify = ["bundle", "--layout-of", "@description@", "--socs", "@source@/socs", "--verify", "@out@"]
verify_key_args = ["--pubkey", "@pubkey@"]

# The data partition (slot-disk): the tool writes the installed slot into a data directory in its own layout, from the bundle,
# with the boot partition image, the keys and the data partition's size (the board's; one number with the ext4 size).
# The args and verify are D1's (devices/products/raze-base on pr/D1, components/raze-lemnos-board). NOT at Lemnos pr/BB1b
# 31e0f736 (BB1b; pair with Orion 671d29d): `data-partition` is Lemnos M36 (not at the pin), so the first real build of this image will fail here until the
# pin moves. Plan does not run it.
[generate.data]
args = ["data-partition", "--layout-of", "@description@", "--socs", "@source@/socs", "--install", "@bundle@", "--boot-image", "@boot-image@", "--keys", "@keys@", "--time", "@time@", "--data-size", "@data-size@", "--out", "@out@"]
verify = ["data-partition", "--verify", "@out@", "--layout-of", "@description@", "--boot-image", "@boot-image@", "--deep"]
keys = "files/slot-keys"

# The board file, as /etc/lemnos/board.toml (the board's own, named by its [descriptions]).
[[install]]
from = { description = "lemnos" }
to = "/etc/lemnos/board.toml"
mode = "0644"

# The gadget drop-in (Lemnos R1d): the FunctionFS mount needs CAP_SYS_ADMIN in the root phase (the same unit drop-in as the Raze).
[[install]]
from = { source = "lemnos", path = "packaging/systemd/lemnosd.service.d/gadget.conf" }
to = "/etc/systemd/system/lemnosd.service.d/gadget.conf"
mode = "0644"

# The trust root: one line per key (Lemnos S2b). The bench key's PUBLIC line only: the same file the Raze carries.
[[install]]
from = { file = "files/slot-keys" }
to = "/etc/lemnos/slot-keys"
mode = "0644"

# lemnos.ko's modprobe.d fragment, generated (the Raze's form; lemnos.ko is not built by this kernel).
[[install]]
from = { generated = "modprobe.conf" }
to = "/etc/modprobe.d/lemnos.conf"
mode = "0644"
