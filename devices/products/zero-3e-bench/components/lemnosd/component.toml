# One Lemnos cargo package: lemnosd, built from Lemnos 7d91d645 (next head, OWNER-PROBE-ACCESS: the daemon's slot and security writes work under its real unit; coordinator 2026-11-21, F3-1) (Z2; this product's copy).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnosd --profile service`.
version = 1
name = "lemnosd"
description = "the Lemnos hardware daemon, lemnosd (service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "6c8568d073e9953833b75fbf5e9b4f530214cb91"  # Lemnos 6c8568d0 (next, CSI2-STOP-CONFIRMED; since bbb3c420: GADGET-CONTROL-OFF-CALL part two, NCM-REBIND-GUARD, SLOTS-INCOMING-DOC, GADGET-REBIND-KEEPS-LINK (three fds for the link), REFUSAL-WORDS, PACKAGING-FILES-SINK (the status topic's `pushes`, lemnos-ctl --bridge-env / --bridge-dropin), the camera stop fix), coordinator 2026-11-23, pin move 13; before: bbb3c420

# The Rust release the build uses (Gaia 08e71181): rustc, cargo and each target's std, the official files pinned by the
# lock. The build machine's rustup is never read. Every board here is aarch64 (static musl).
[sources.toolchain]
rust = "1.99.0"
targets = ["aarch64-unknown-linux-musl"]

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnosd"
profile = "service"

[[install]]
from = "bin/lemnosd"
to = "/usr/bin/lemnosd"
mode = "0755"
