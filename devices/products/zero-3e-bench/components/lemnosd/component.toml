# One Lemnos cargo package: lemnosd, built from Lemnos Lemnos next 31e0f736 (BB1b; pair with Orion 671d29d) (Z2; this product's copy).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnosd --profile service`.
version = 1
name = "lemnosd"
description = "the Lemnos hardware daemon, lemnosd (service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "31e0f736a334260a7df2ea86bcfa358e9a640f08"  # Lemnos Lemnos next 31e0f736 (BB1b; pair with Orion 671d29d): the U-Boot slot form for bench boards before merge

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnosd"
profile = "service"

[[install]]
from = "bin/lemnosd"
to = "/usr/bin/lemnosd"
mode = "0755"
