# The PC's SSH key for root, read from the named local input `pc-key` (`gaia plan --input pc-key=PATH`).
#
# BLOCKED, see docs/prs/Z1.md: Gaia's named input copies the file as written. It cannot write only the
# `ssh-ed25519 AAAA...` part, and the comment is the PC owner's (an email address), so the input file must
# be given with the comment already removed until Gaia has a transform for named inputs. The check plans with a
# throwaway public key (no comment), as check-config-only does for bench-key.
#
# Dropbear: key only, no password logins (-s in dropbear.default). dropbear.service is enabled by the base's
# dropbear package and this component's entry below.
version = 1
name = "bench-pc-key"
description = "The PC's SSH public key for root (named input pc-key) and dropbear's key-only options."

[[install]]
from = { input = "pc-key" }
to = "/root/.ssh/authorized_keys"
mode = "0600"

[[install]]
from = { file = "files/dropbear.default" }
to = "/etc/default/dropbear"
mode = "0644"

[[services]]
unit = "dropbear.service"
enable = true
