# One Lemnos cargo package: lemnos-orion, built from Lemnos 7d91d645 (next head, OWNER-PROBE-ACCESS: the daemon's slot and security writes work under its real unit; coordinator 2026-11-21, F3-1) (Z2; this product's copy).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-orion --profile service`.
version = 1
name = "lemnos-orion"
description = "the Lemnos bridge to Orion, lemnos-orion (service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "214c0ca74b736c0218a75ac62ffc323a6163714e"  # Lemnos 214c0ca7 (next: BOOT-FAT-LABEL, the boot volume is labelled LEMNOS-BOOT; SLOTS-REBIND-LOOP; GADGET-REBIND-VISIBLE; RING-ONE-WRITER; LOCATE-APP-LAYER; PUSHES-NOT-STALE; on e199fcb9), coordinator 2026-11-23, pin move 15; before: e199fcb9

# The Rust release the build uses (Gaia 08e71181): rustc, cargo and each target's std, the official files pinned by the
# lock. The build machine's rustup is never read. Every board here is aarch64 (static musl).
[sources.toolchain]
rust = "1.99.0"
targets = ["aarch64-unknown-linux-musl"]

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-orion"
profile = "service"

[[install]]
from = "bin/lemnos-orion"
to = "/usr/bin/lemnos-orion"
mode = "0755"
