# One Lemnos cargo package: lemnos-orion, built from Lemnos pr/BB1b e2e45ce7 (Z2, unmerged; this product's copy).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-orion --profile service`.
version = 1
name = "lemnos-orion"
description = "the Lemnos bridge to Orion, lemnos-orion (service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "e2e45ce795e922ff92cf6334586ed7fd66f9c3d1"  # Lemnos pr/BB1b TIP (Z2): the U-Boot slot form for bench boards. UNMERGED pin, moves to the merged rev before merge

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-orion"
profile = "service"

[[install]]
from = "bin/lemnos-orion"
to = "/usr/bin/lemnos-orion"
mode = "0755"
