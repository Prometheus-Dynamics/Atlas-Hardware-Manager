# One Lemnos cargo package: lemnos-orion, built from Lemnos 7d91d645 (next head, OWNER-PROBE-ACCESS: the daemon's slot and security writes work under its real unit; coordinator 2026-11-21, F3-1) (Z2; this product's copy).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-orion --profile service`.
version = 1
name = "lemnos-orion"
description = "the Lemnos bridge to Orion, lemnos-orion (service profile)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "bed325fb0c695a695eae23b5e7a48993c29394a0"  # Lemnos bed325fb (pr/BOOT-DISK-WAIT-0d37: 0d37cc55 + boot-disk wait + eMMC hardware areas are not boot disks + their sysfs set-aside + MFD-cell watchdog + real gadget endpoint addresses + boot-loop fallback + module node claim + unjudged count clear), coordinator 2026-11-22, pin move 3

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-orion"
profile = "service"

[[install]]
from = "bin/lemnos-orion"
to = "/usr/bin/lemnos-orion"
mode = "0755"
