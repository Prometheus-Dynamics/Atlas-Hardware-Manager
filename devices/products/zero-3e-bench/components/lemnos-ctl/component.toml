# One Lemnos cargo package: lemnos-ctl, built from Lemnos b210934d (pr/RUNDIR-D1: next c215f575, the Raze image's final Lemnos rev, plus the RUNDIR fix, runtime_directory's mode before its chown; coordinator 2026-11-20; with Orion 671d29d) (Z2; this product's copy).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-ctl --profile service`.
version = 1
name = "lemnos-ctl"
description = "the Lemnos command-line client, lemnos-ctl (service profile; the board-file tool)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "b210934dbad70926e07214875b100134d946640b"  # Lemnos b210934d (pr/RUNDIR-D1: next c215f575, the Raze image's final Lemnos rev, plus the RUNDIR fix, runtime_directory's mode before its chown; coordinator 2026-11-20; with Orion 671d29d): the U-Boot slot form for bench boards before merge

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-ctl"
profile = "service"

[[install]]
from = "bin/lemnos-ctl"
to = "/usr/bin/lemnos-ctl"
mode = "0755"
