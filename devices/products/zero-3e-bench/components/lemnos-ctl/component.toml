# One Lemnos cargo package: lemnos-ctl, built from Lemnos 7d91d645 (next head, OWNER-PROBE-ACCESS: the daemon's slot and security writes work under its real unit; coordinator 2026-11-21, F3-1) (Z2; this product's copy).
# The target is the board's and the crates come from Cargo.lock: no triple, no vendor here.
# Gaia's rust builder, at 4abf626 and later: `--package lemnos-ctl --profile service`.
version = 1
name = "lemnos-ctl"
description = "the Lemnos command-line client, lemnos-ctl (service profile; the board-file tool)"

[sources.src]
git = "https://github.com/Prometheus-Dynamics/Lemnos"
ref = "7d91d6459bb20afe473143a9b559e2017109ec81"  # Lemnos 7d91d645 (next head, OWNER-PROBE-ACCESS: the daemon's slot and security writes work under its real unit; coordinator 2026-11-21, F3-1): the U-Boot slot form for bench boards before merge

[sources.root]
image = "docker.io/library/rust:1.99-slim"
platform = "host"

[build]
builder = "rust"
source = "src"

[build.settings]
package = "lemnos-ctl"
profile = "service"

[[install]]
from = "bin/lemnos-ctl"
to = "/usr/bin/lemnos-ctl"
mode = "0755"
