# Radxa ZERO 3E bench image, Gaia F8 form, as a U-Boot SLOT image (Z2; replaces Z1's plain sd-image). One image: the ZERO 3E
# board (its U-Boot with the Lemnos environment, the kernel with pstore), the bench's OS (zero-3e-base's and this product's
# fragments), the Lemnos and Orion packages, and the root slot made by the `slot-boot` recipe (the raze-base pattern): the EROFS
# root with dm-verity, the initramfs (lemnos-slot-init), the overlay, the cmdline, the slot bundle (`[generate.bundle]`, signed by
# the BENCH key: a test credential, milestone 2 only) and the boot partition (`[generate.image]`, the U-Boot form: boot.scr and
# the three bay sets, written by Lemnos's tool).
#
# Access over the USB gadget on the OTG Type-C (serial-hash-v1 lemnos0 addressing), plus Ethernet DHCP and mDNS (Z1; the
# coordinator's ruling of 2026-11-14: Ethernet stays, the gadget is added). Hostname from the serial. PC key, watchdog, serial console.
#
# PINS (Z2): the Lemnos components here are this product's own copies at Lemnos pr/BB1b TIP e2e45ce7 (unmerged), NOT the shared
# devices/components/lemnos* at f4a295c6 (the Raze's L2 rev), so the Raze's lock does not move. The root Cargo.toml's
# lemnos-slot-store rev is still f4a295c6: check-devices refuses the mismatch (Z2 stopped there; see docs/prs/Z2.md).
# Gaia: devices/gaia.lock is d8441c9d; the rk-env rev (1db105c) is for the coordinator to move.
version = 1
name = "zero-3e-bench"
description = "Radxa ZERO 3E bench OS: U-Boot slot form (Lemnos BB1b), USB gadget and Ethernet, mDNS, serial-based hostname, lemnosd and Orion with security off, systemd watchdog."

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.02.3"

[components]
dev-bringup-hostkey = "../../components/dev-bringup-hostkey/component.toml"
lemnos = "components/lemnos/component.toml"
lemnosd = "components/lemnosd/component.toml"
lemnos-ctl = "components/lemnos-ctl/component.toml"
lemnos-orion = "components/lemnos-orion/component.toml"
lemnos-slot-init = "components/lemnos-slot-init/component.toml"
orion = "../../components/orion/component.toml"
zero-3e-slot-board = "components/zero-3e-slot-board/component.toml"
lemnos0-addressing = "../../components/lemnos0-addressing/component.toml"
bench-pc-key = "components/bench-pc-key/component.toml"
bench-network = "components/bench-network/component.toml"
bench-watchdog = "components/bench-watchdog/component.toml"

[[images]]
name = "zero-3e-bench"
board = "../../boards/radxa-zero-3e/board.toml"
components = ["dev-bringup-hostkey", "lemnos", "lemnosd", "lemnos-ctl", "lemnos-orion", "orion", "zero-3e-slot-board", "bench-pc-key", "bench-network", "lemnos0-addressing", "bench-watchdog"]
# The slot's initramfs carries lemnos-slot-init (installed there as /init); it is not on the root filesystem.
initramfs = ["lemnos-slot-init"]
os = { provider = "buildroot", source = "buildroot", fragments = ["../zero-3e-base/os.fragment", "os.fragment"] }
recipe = "slot-boot"

# The slot-boot settings (as raze-base's; each named in devices/products/raze-base/product.toml). Compression and level are the
# Raze's board measurement (lzma, 6); the ZERO 3E kernel carries the lzma decoder (families/rk35xx linux.fragment, EROFS_FS_ZIP_LZMA).
# version and slot are NOT set: Gaia takes them as --setting (scripts/version-rule.sh).
[images.settings]
device = "/data/slots/root.img"
product = "zero-3e-bench"
# UNVERIFIED: the board's boot partition size (boards/radxa-zero-3e/board.toml [[partitions]] role = "boot"). check-devices
# requires the two to agree; Gaia's boot-partition fit refuses a size too small for the bays.
boot_size = 134217728
compression = "lzma"
level = 6
dictsize = 2097152
cluster = 1048576
fragments = true
ztailpacking = true
sign_key_env = "ATLAS_BENCH_SEED_FILE"
sign_key_id = "9af003d92992f9c2211a1f5b8d33a08f610c5bae45c61f9f9f6c3a10442fdd64"
sign_pubkey_env = "ATLAS_BENCH_PUBKEY_FILE"
