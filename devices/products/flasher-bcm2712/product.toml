# The bcm2712 flasher: a RAM-only initramfs that the boot ROM's USB boot loads (D6). Once it runs, the board is an
# Orion node in the flasher state on its USB link, with lemnosd beside it. Atlas pushes the first-flash image to
# the Lemnos bridge's system-flash sink (atlas-first-flash). Untested on board.
#
# This supersedes B9's unlanded flasher-bcm2712 (pr/B9 b2efaf42). What changed, and why (docs/prs/D6.md):
#   - Orion runs as orion-comm and orion-node with hello.state = flasher (flasher-orion), not orion-recovery
#     alone: the recovery comm core refuses file pushes and actions.
#   - The board file is the flasher's own (raze-flasher-board: Lemnos bcm2712-flasher.toml with the Raze's id),
#     because only a flasher's board file sets allow_first_flash.
#   - Every Lemnos part is at Lemnos next da86d0b3 and Orion at next 3f60576c (flasher-* components), confirmed for
#     this work only. The Raze product's pins do not move.
#
# Recipe: Gaia's rpi-ramdisk-boot-generated (Gaia bb98a262, devices/gaia.lock). It makes the set a Pi's EEPROM asks
# for in a USB boot with boot_ramdisk=1: an outer config.txt holding only boot_ramdisk=1, beside boot.img, a FAT16 of
# kernel8.img, this tree as a newc initramfs, the device trees below, the board overlay raze-flasher-board generates
# (compiled and checked as slot-boot does), config.txt and cmdline.txt. Output `boot` is that directory.
#
# The board's kernel (boards/raze/kernel, unchanged here) already builds in everything the flasher needs:
# USB_CONFIGFS, USB_CONFIGFS_F_FS, USB_CONFIGFS_NCM, I2C_CHARDEV, I2C_DESIGNWARE_PLATFORM and RP1_PIO are =y on next.
# So the flasher needs no kernel fragment and no modules, and raze-base's plan is unchanged.
#
# The PC reaches the node with orion+tcp on lemnos0 at the board's serial-hash-v1 address (flasher-lemnos0), which
# Atlas computes from the serial: no configuration on the PC.
version = 1
name = "flasher-bcm2712"
description = "bcm2712 flasher: a RAM-only initramfs with lemnosd, the Lemnos bridge and Orion in the flasher state (BusyBox init)"

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.08"

[components]
flasher-lemnosd = "../../components/flasher-lemnosd/component.toml"
flasher-lemnos-orion = "../../components/flasher-lemnos-orion/component.toml"
flasher-lemnos-restart = "../../components/flasher-lemnos-restart/component.toml"
flasher-lemnos-way-back = "../../components/flasher-lemnos-way-back/component.toml"
flasher-lemnos-busybox = "../../components/flasher-lemnos-busybox/component.toml"
raze-flasher-board = "../../components/raze-flasher-board/component.toml"
flasher-orion = "../../components/flasher-orion/component.toml"
flasher-lemnos0 = "../../components/flasher-lemnos0/component.toml"
flasher-init = "../../components/flasher-init/component.toml"
lemnos0-addressing = "../../components/lemnos0-addressing/component.toml"

[[images]]
name = "flasher-bcm2712"
board = "../../boards/raze/board.toml"
components = ["flasher-lemnosd", "flasher-lemnos-orion", "flasher-lemnos-restart", "flasher-lemnos-way-back", "flasher-lemnos-busybox", "raze-flasher-board", "flasher-orion", "flasher-lemnos0", "lemnos0-addressing", "flasher-init"]
os = { provider = "buildroot", source = "buildroot", fragments = ["os/flasher.fragment"] }
recipe = "rpi-ramdisk-boot-generated"

# /etc/mdev.conf from its three owners (Gaia F12, docs/assembled-files.md). mdev acts on the FIRST rule that matches,
# so the specific rules go first and Buildroot's own file (catch-alls such as ttyS[0-9]*) last: Lemnos's packaged
# rules, then the board's own nodes (generated from the board file), then the OS's.
[[images.assembled]]
path = "/etc/mdev.conf"
order = ["flasher-lemnos-busybox", "raze-flasher-board", "os"]

# /etc/fstab: the OS's mounts (Buildroot's skeleton, sysfs among them), then flasher-init's configfs line, which needs
# sysfs mounted first. rule_key 2: a rule is named by its mount point, so a second /sys/kernel/config line fails the
# build. lemnosd needs configfs and never mounts it (scripts/check-lemnos-gadget.py).
[[images.assembled]]
path = "/etc/fstab"
order = ["os", "flasher-init"]
rule_key = 2

# The boot settings (recipes/rpi-ramdisk-boot-generated.toml), each with its reason:
#  board_overlay  where the generated overlay goes; config.txt's dtoverlay=lemnos-board names it.
#  device_trees   out of the Raze kernel build's flat device-tree output (Gaia, 2026-11-22: six files): the board's
#                 tree, bcm2712d0.dtbo (the firmware applies it on a D0 chip), the firmware's two maps, and ramoops-pi5.
#                 The same files, byte for byte, as the RAM stage that booted Raze #2. Not taken: vc4-kms-v3d-pi5.
#  config         boot.img's config.txt:
#                   arm_64bit, kernel, initramfs  the kernel and this tree, by the names the recipe gives them.
#                   kernel_watchdog_timeout=15    the firmware arms the SoC watchdog, as build10 does; lemnosd's
#                                                 hw-watchdog keepalive (the board file, 15 s) feeds it. It resets a
#                                                 hung kernel or a dead lemnosd only: a running lemnosd whose gadget
#                                                 never comes up keeps feeding it (2026-11-22, Raze #2). The way back
#                                                 from that is the return flasher-init's /init arms.
#                   dtoverlay=lemnos-board        the board overlay: the CM5's USB controller as a peripheral (the gadget).
#                   gpio=45=op,dh                 the fan line held high: the flasher's board file has no fan device,
#                                                 so the fan runs full while it writes (build10 holds the same line).
#                   dtoverlay=ramoops-pi5,...    crash logs kept in RAM across a reset, build10's sizes: a flasher that
#                                                 panics leaves its log for the next boot to read.
#                 Not carried from the Raze's config: vc4-kms-v3d (no display here). No dwc2: the overlay's fragment@7
#                 makes the controller a peripheral.
#  cmdline        the Raze's kernel base words (boards/raze/board.toml [kernel] cmdline: the hash table sizes) and
#                 panic=5 (the Raze's: a panic restarts in 5 s, then the eMMC boots). rdinit=/init is flasher-init's /init.
[images.settings]
board_overlay = "overlays/lemnos-board.dtbo"
device_trees = "bcm2712-rpi-cm5-cm5io.dtb bcm2712d0.dtbo=overlays/bcm2712d0.dtbo hat_map.dtb=overlays/hat_map.dtb overlay_map.dtb=overlays/overlay_map.dtb ramoops-pi5.dtbo=overlays/ramoops-pi5.dtbo"
config = """
arm_64bit=1
kernel=kernel8.img
initramfs initramfs.cpio followkernel
kernel_watchdog_timeout=15
dtoverlay=lemnos-board
dtoverlay=ramoops-pi5,total-size=0x40000,record-size=0x10000,console-size=0x20000
gpio=45=op,dh
"""
cmdline = "dhash_entries=16384 ihash_entries=8192 thash_entries=4096 uhash_entries=1024 rdinit=/init panic=5"
