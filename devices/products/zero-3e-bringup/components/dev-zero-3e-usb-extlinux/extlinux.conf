# DEV ONLY (bring-up): the ZERO 3E's extlinux.conf with the usb0 gadget's fixed addresses. The shared
# radxa-zero-3e-extlinux is the same except for the last line; this one replaces it in the bring-up product
# only, because the base product must carry no bring-up data.
#
# g_ether.dev_addr / g_ether.host_addr: the built-in legacy Ethernet gadget (CONFIG_USB_ETH=y, the ZERO 3E
# fragment) takes its two MACs from the kernel command line (USB_ETHERNET_MODULE_PARAMETERS in
# drivers/usb/gadget/legacy/ether.c, v7.3.3). Without them the MACs are random every boot and the host's
# network profile does not re-attach. Both are locally administered and unicast (first octet 02), different
# from each other and from every other board's. Bring-up only: the managed image's MACs come from Lemnos's
# `function ncm derive`.
default rootfs
label rootfs
  kernel /boot/Image
  devicetree /boot/rk3566-radxa-zero-3e-gadget.dtb
  append root=PARTLABEL=rootfs rootwait console=ttyS2,1500000 earlycon g_ether.dev_addr=02:3e:00:00:00:01 g_ether.host_addr=02:3e:00:00:00:02
