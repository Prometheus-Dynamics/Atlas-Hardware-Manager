# DEV ONLY, bring-up product only. The usb0 gadget network as systemd units, not
# dev's /etc/init.d script: systemd is this OS's init (decision 3).
# Goes when Lemnos's USB driver owns the gadget (decision 5).
version = 1
name = "dev-usb0-gadget"
description = "DEV ONLY: usb0 at 10.55.0.1 with a DHCP server for 10.55.0.2 (bring-up only)."

[[install]]
from = { file = "10-usb0.network" }
to = "/etc/systemd/network/10-usb0.network"
mode = "0644"

[[install]]
from = { file = "usb0-gadget.service" }
to = "/etc/systemd/system/usb0-gadget.service"
mode = "0644"

[[services]]
unit = "usb0-gadget.service"
enable = true
