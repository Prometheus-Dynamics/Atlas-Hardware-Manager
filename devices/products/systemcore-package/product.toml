version = 1
name = "systemcore-package"
description = "The SystemCore's package: one .ipk carrying Orion and Lemnos, installed on the controller by its own package install (Atlas offers it; E2 runs it). Not an image: Atlas never reflashes the controller."

[components]
orion = "../../components/orion/component.toml"
lemnos = "../../components/lemnos/component.toml"

[[images]]
name = "systemcore-package"
board = "../../boards/systemcore/board.toml"
components = ["orion", "lemnos"]
recipe = "ipk" # F8?: no `ipk` recipe under recipes/ at e90ee03 (examples/packages only)
