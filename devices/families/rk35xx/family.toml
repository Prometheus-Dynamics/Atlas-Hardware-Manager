# Rockchip RK35xx family: mainline Linux, U-Boot and TF-A, rkbin's DDR init
# and maskrom loader. Boards extend this and keep only what differs: CPU,
# device tree, U-Boot defconfig, TF-A platform, DDR blob and RKBOOT ini.
# Pins are dev's (Linux 7.3.3, U-Boot v2026.10, TF-A v2.15.0) and rkbin
# 3e288fe, where the RK3566 DDR blobs are v1.26. Untested on board.
version = 1

[target]
arch = "aarch64"
os = "linux"

[sources.linux]
git = "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
ref = "v7.3.3"

[sources.u-boot]
git = "https://github.com/u-boot/u-boot.git"
ref = "v2026.10"

[sources.tf-a]
git = "https://github.com/ARM-software/arm-trusted-firmware.git"
ref = "v2.15.0"

# rkbin 3e288fe (master on 2026-11-13): the RK3566 DDR blobs are v1.26 there,
# and the usbplug v1.17 and SPL v1.14 are unchanged from dev's f43a462.
[sources.rkbin]
git = "https://github.com/rockchip-linux/rkbin.git"
ref = "3e288fe814e059dd06833495f845cab04ac20a5c"

[kernel]
source = "linux"
fragments = ["assets/linux.fragment"]

[bootloader]
source = "u-boot"
fragments = ["assets/u-boot.fragment"]

[bootloader.trusted_firmware]
source = "tf-a"

# The boot ROM reads idbloader and U-Boot from sector 64, outside the
# partition table. U-Boot keeps its environment in the partition with this
# type GUID, left empty so the built-in environment boots.
[[partitions]]
name = "u-boot"
role = "bootloader"
offset = "32K"
in_table = false

[[partitions]]
name = "uboot-env"
role = "raw"
type = "3de21764-95bd-54bd-a5c3-4abe786f38a8"
offset = "16M"
size = "64K"

[disk]
scheme = "gpt"

# Written by maskrom (rockusb): the boot ROM takes the board's loader over USB,
# and the usbplug writes the storage. No vendor tool at run time.
[flash]
methods = ["maskrom", "sd-card"]
