# Rockchip RK35xx family: mainline Linux, U-Boot and TF-A, rkbin's DDR init
# and maskrom loader. Boards extend this and keep only what differs: CPU,
# device tree, U-Boot defconfig, TF-A platform, DDR blob and RKBOOT ini.
# Pins are dev's (Linux 7.3.3, U-Boot v2026.10, TF-A v2.15.0). The family pins
# no boot blobs: each board names the rkbin commit and the blob versions it is
# known to boot with, and says whether that was verified on hardware.
version = 1

[target]
arch = "aarch64"
os = "linux"

[sources.linux]
git = "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
ref = "v7.3.3"

[sources.u-boot]
git = "https://github.com/u-boot/u-boot.git"
ref = "v2026.10"

[sources.tf-a]
git = "https://github.com/ARM-software/arm-trusted-firmware.git"
ref = "v2.15.0"

[kernel]
source = "linux"
fragments = ["assets/linux.fragment"]

[bootloader]
source = "u-boot"
fragments = ["assets/u-boot.fragment"]

[bootloader.trusted_firmware]
source = "tf-a"

# The boot ROM reads idbloader and U-Boot from sector 64, outside the
# partition table. U-Boot keeps its environment in the partition with this
# type GUID, left empty so the built-in environment boots.
[[partitions]]
name = "u-boot"
role = "bootloader"
offset = "32K"
in_table = false
# The file written at the offset: U-Boot's binman output (idbloader and U-Boot),
# which the OS build makes. Gaia's rk35xx example names it the same way.
content = "u-boot-rockchip.bin"

[[partitions]]
name = "uboot-env"
role = "raw"
type = "3de21764-95bd-54bd-a5c3-4abe786f38a8"
offset = "16M"
size = "64K"

# Bring-up form (Gaia's sd-image, F7, at 10beed8): the rootfs partition holds
# /boot/extlinux/extlinux.conf (radxa-zero-3e-extlinux) for U-Boot's distro
# boot; data holds the slot file. Moves to the slot boot form when Gaia's real
# boot recipe exists.
# rootfs and data are not declared here: sd-image makes them itself (the build
# tree as ext4, marked bootable; and the data partition holding the slot file).
# The board's partitions are only the areas outside the table and the env.

[disk]
scheme = "gpt"

# Written by maskrom (rockusb): the boot ROM takes the board's loader over USB,
# and the usbplug writes the storage. No vendor tool at run time.
[flash]
methods = ["maskrom", "sd-card"]
