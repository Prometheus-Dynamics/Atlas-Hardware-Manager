# Allwinner A733 (sun60i) family: Radxa Cubie A7A, A7S and A7Z. aarch64 Linux.
#
# CANDIDATE SOURCES, UNVERIFIED, NEVER BOOTED ON BOARD. A new choice made in B12 (2026-11-13),
# not carried from dev (dev never built an image for these boards). Every pin below was read
# from a real commit (URL and commit beside it). Nothing here is a board run.
#
# What is pinned is the candidate chain that DockSeed's public recipe builds, and that the
# earlier Gaia work on this machine built (cubie-a7s image on Linux 7.3.3, signed, NOT booted;
# /mnt/ssd-samsung/gaia/boards/cubie-a7s/build.log, and the Gaia work config
# /mnt/ssd-samsung/gaia/work/examples/boards/a733/base.toml). The vendor alternatives are
# recorded at the end of this file.
#
# Chain (candidate): BROM -> U-Boot SPL (vendor DRAM blob ddr.bin, built in via SUNXI_LIBDRAM)
#   -> BL31 (TF-A, A733 platform) -> U-Boot -> kernel. One image file, u-boot-sunxi-with-spl.bin,
#   sits on the card at 128 KiB (sector 256); the first partition starts at 16 MiB.
#
# OPEN, blocks shipping (see the B12 PR text): the kernel is a patch series on Linux 7.3.3
# (Gaia's git source cannot apply it); U-Boot and TF-A also need DockSeed's patches applied; the
# TF-A and U-Boot patch series have no F8 spelling; the DRAM blob is closed (no redistribution
# grant): no published image may carry it.
version = 1

[target]
arch = "aarch64"
os = "linux"

# Mainline Linux 7.3.3, the latest 7.x tag this chip's candidate runs on. Pinned to the
# peeled commit of tag v7.3.3 (kernel.org; `git ls-remote`, tag object b7cb9f47).
# candidate, unverified, never booted; a new choice, not carried from dev.
[sources.linux]
git = "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
ref = "d50d994bffa3c7c6db2d8bc4c5f0c55e3f46b0cd"

# DockSeed's Linux 7.3.3 patch series for the A733 (SoC, CCU, pinctrl, PMIC, GMAC, USB, GPU,
# NPU; the A7S board dts). Applied on top of linux.linux by its build (patches/series, 19
# commits on main). Only the Cubie A7S is tested by its author. Pinned to the commit main had
# when the earlier build read it. candidate, unverified, never booted; a new choice, not carried from dev.
[sources.a733-kernel-series]
git = "https://github.com/DockSeed/a7s-linux-mainline.git"
ref = "fe0a8ed3a426c09efa8d92c14c9d9ab3769d5256"

# Radxa's U-Boot tree, the one radxa-pkg/u-boot-dlan17 pins as its `src` submodule (branch
# u-boot-dlan17). Holds the A733 defconfigs and board dts for the A7A and A7S (see the boards).
# candidate, unverified, never booted; a new choice, not carried from dev.
[sources.u-boot]
git = "https://github.com/radxa/u-boot.git"
ref = "9da4b3e82d641296f5b19d5e78eaad0d3cf56eec"

# DockSeed's 18 U-Boot patches on that tree (patches/u-boot/series in a733-bootchain, pinned to
# commit b6f6872be2505e1f4d4dfcea7bee5b423a3efcb3, which is the A7S's board patches). Gaia
# cannot express a patch series at this rev: an open field (B12 PR text). candidate, unverified.
[sources.a733-bootchain]
git = "https://github.com/DockSeed/a733-bootchain.git"
ref = "b6f6872be2505e1f4d4dfcea7bee5b423a3efcb3"

# TF-A: upstream master at 3d425f4f4598 (VERSION 2.15.0, 2026-10-02) plus DockSeed's 17 patches
# (patches/tf-a/series; they add plat/allwinner/sun60i_a733). Upstream master has no A733
# platform of its own. candidate, unverified, never booted; a new choice, not carried from dev.
[sources.tf-a]
git = "https://git.trustedfirmware.org/TF-A/trusted-firmware-a.git"
ref = "3d425f4f459820a44d24b23464dbc09d6baab7bb"

# The DRAM blob's home: radxa-pkg/u-boot-dlan17 at tag 2026.04-4. The blob is
# awbin/a733/ddr.bin (sha256 d89804f404f2eef6ef5b03d82a310ef0906c4db8ded760be221b131f5c813a05,
# checked by hash in the B12 work). CLOSED vendor code with no redistribution grant: it is
# fetched at build time, never committed, and never published inside an image.
[sources.dlan17-pkg]
git = "https://github.com/radxa-pkg/u-boot-dlan17.git"
ref = "b1cec0a90c795f65b82cee7098489e0bdf550b74"

[kernel]
source = "linux"
fragments = ["assets/linux.fragment"]

[bootloader]
source = "u-boot"
fragments = []

[bootloader.trusted_firmware]
source = "tf-a"
platform = "sun60i_a733"

# The boot ROM loads the SPL and U-Boot from the card at 128 KiB (sector 256). The SPL and
# U-Boot are one file, u-boot-sunxi-with-spl.bin, which the OS build makes. candidate, unverified:
# the 128 KiB rule is from DockSeed's docs/boot-chain.md (their A7S card test), not a board run.
[[partitions]]
name = "u-boot"
role = "bootloader"
offset = "128K"
in_table = false
content = "u-boot-sunxi-with-spl.bin"

# The first partition starts at 16 MiB, which is the offset DockSeed's chain uses for its rootfs.
# rootfs and data are made by the recipe (sd-image), as for the RK35xx boards.

[disk]
scheme = "gpt"

[flash]
methods = ["fel", "sd-card"]

# VENDOR ALTERNATIVE (records, not used by this chain; kept with its reason, B12):
#   radxa-pkg/linux-a733 @ 166c84e4ce3e75750359f5085d712fd4f0bd1fe6 (tags 5.15.147-1..21), kernel
#     src radxa/kernel branch allwinner-aiot-linux-5.15 @ e41499895c17074874f4c48ff04041c57d8dfd99
#     (Linux 5.15.147). The vendor 6.6 kernel: radxa/kernel branch allwinner-aiot-linux-6.6 @
#     76402aa303a7571bc0e7e33188a46367f0ae4420 (Linux 6.6.98). Neither tree has an A733 dts: the
#     board files come from radxa-pkg device-a733 (below).
#   radxa/allwinner-device branch device-a733-v1.4.6 @ 79d54f44e14111db3845096cef0639a6c9222707:
#     configs/cubie_a7a|a7s|a7z/linux-6.6/board.dts (generic sun60iw2p1 board files), and the
#     Radxa boot0 (bin/boot0_sdcard_sun60iw2p1.bin), sboot and fes1 blobs (vendor, closed).
#   radxa/allwinner-bsp branch cubie-aiot-v1.4.6 @ 2045a3ca2a01f088c0314dc924bda59d154e363e.
#   The vendor first stage (boot0) and its packer (dragonsecboot, an Allwinner x86 tool) are
#   what Atlas's rule refuses: loaders are our own Rust. Not used.
#   dlan17/a733 docs: boot0 at 128 KiB, a boot_package at sector 32800 (16793600 B), which
#   would overlap a 16 MiB rootfs start; the boot-chain doc above says 12 MiB for the same
#   packer. Both unverified here; they are the vendor route only.
#
# OPEN, mainline (the latest 7.x goal): nothing of the A733 is in Linux 7.3.3 (see the
# B12 PR text). Upstream posting: "[PATCH 0/4] arm64: dts: allwinner: add A733/Cubie A7S DTS
# support" (Enzo Adriano, 2026-06-13, linux-arm-kernel; its SoC dtsi review by Jerome Brunet,
# 2026-06-23). It needs the A733 clock and RTC series first. Merge status in 7.4+ NOT verified.
