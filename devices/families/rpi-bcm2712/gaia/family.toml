config = 3
description = "BCM2712 (Pi 5, CM5) boot family: firmware hooks for the board scripts, A/B tryboot updates, RP1 LED probe workaround, stock overlays."

# A package on this family imports this file from device.toml, after
# ../../common/board-os/gaia/board-os.toml. Its slots layer is slots.toml.

imports = ["./boot.toml"]

[[stage.files]]
id = "bcm2712-modprobe-d-raze-ws2812-pio-conf"
src = "${self}/assets/rootfs/usr/lib/modprobe.d/raze-ws2812-pio.conf"
dest = "/usr/lib/modprobe.d/raze-ws2812-pio.conf"
origin = "static-asset"

[[stage.files]]
id = "bcm2712-board-raze-leds-reprobe"
src = "${self}/assets/rootfs/usr/lib/board/raze-leds-reprobe"
dest = "/usr/lib/board/raze-leds-reprobe"
origin = "static-asset"
mode = 493

[[stage.files]]
id = "bcm2712-systemd-system-raze-leds-reprobe-service"
src = "${self}/assets/rootfs/usr/lib/systemd/system/raze-leds-reprobe.service"
dest = "/usr/lib/systemd/system/raze-leds-reprobe.service"
origin = "static-asset"

[[stage.files]]
id = "bcm2712-board-usb-boot"
src = "${self}/assets/rootfs/usr/lib/board/usb-boot"
dest = "/usr/lib/board/usb-boot"
origin = "static-asset"
mode = 493

[[stage.files]]
id = "bcm2712-systemd-system-board-usb-boot-path"
src = "${self}/assets/rootfs/usr/lib/systemd/system/board-usb-boot.path"
dest = "/usr/lib/systemd/system/board-usb-boot.path"
origin = "static-asset"

[[stage.files]]
id = "bcm2712-systemd-system-board-usb-boot-service"
src = "${self}/assets/rootfs/usr/lib/systemd/system/board-usb-boot.service"
dest = "/usr/lib/systemd/system/board-usb-boot.service"
origin = "static-asset"

[[stage.files]]
id = "bcm2712-update"
src = "${self}/assets/rootfs/usr/lib/board/update"
dest = "/usr/lib/board/update"
origin = "static-asset"
mode = 493

[[stage.files]]
id = "bcm2712-board-family-sh"
src = "${self}/assets/rootfs/usr/lib/board/family.sh"
dest = "/usr/lib/board/family.sh"
origin = "static-asset"

[image]
kind = "buildroot"

[image.feed]
stage_files = [
  "bcm2712-modprobe-d-raze-ws2812-pio-conf",
  "bcm2712-board-raze-leds-reprobe",
  "bcm2712-systemd-system-raze-leds-reprobe-service",
  "bcm2712-board-usb-boot",
  "bcm2712-systemd-system-board-usb-boot-path",
  "bcm2712-systemd-system-board-usb-boot-service",
  "bcm2712-update",
  "bcm2712-board-family-sh",
]
