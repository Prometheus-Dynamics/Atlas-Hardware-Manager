# DEV ONLY (bring-up). Candidate, UNVERIFIED, never booted. U-Boot's distro boot reads this from the first
# partition. The rootfs holds the kernel and the board's dtb under /boot (Buildroot's install).
#
# devicetree: the bring-up board's dtb, the A7S's dts with the status LED's heartbeat (board/assets/dts).
#   A new file name, so the series' own dtb is not overwritten.
# console=ttyS0,115200: the kernel console on UART0 (the earlier Gaia A733 build's console; not a board run).
#   There is NO serial adapter for the bring-up: this line is kept for when one is attached, and nothing
#   depends on it.
# g_ether.dev_addr / g_ether.host_addr: the built-in legacy Ethernet gadget (CONFIG_USB_ETH=y, bringup.fragment)
#   takes its two MACs from the command line. Without them the MACs change every boot and the PC's network
#   profile does not re-attach. Both are locally administered and unicast (first octet 02), different from each
#   other and from the ZERO 3E's (02:3e:...). Bring-up only: the managed image's MACs come from Lemnos's
#   `function ncm derive`.
default rootfs
label rootfs
  kernel /boot/Image
  devicetree /boot/sun60i-a733-cubie-a7s-bringup.dtb
  append root=PARTLABEL=rootfs rootwait console=ttyS0,115200 g_ether.dev_addr=02:a7:01:00:00:01 g_ether.host_addr=02:a7:01:00:00:02
