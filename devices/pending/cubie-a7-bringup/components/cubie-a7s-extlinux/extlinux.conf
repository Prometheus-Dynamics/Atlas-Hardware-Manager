# Candidate, unverified, never booted. Same form as the ZERO 3E's: the rootfs holds the kernel and
# the board's dtb under /boot (Buildroot's install), and the root is named by its label.
# UART0 is ttyS0 at 115200 (the earlier Gaia A733 build's console; not a board run).
default rootfs
label rootfs
  kernel /boot/Image
  devicetree /boot/sun60i-a733-cubie-a7s.dtb
  append root=PARTLABEL=rootfs rootwait console=ttyS0,115200
