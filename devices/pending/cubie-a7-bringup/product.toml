# Radxa Cubie A7S BRING-UP, DEV ONLY: boots from the card, gives an Ethernet and an optional USB
# device-mode network, and SSH with the bench key. NO Lemnos, NO Orion, NO slots. Candidate
# sources, unverified, never booted (the one place a dev-only unit is allowed).
#
# PENDING, outside the device check: the bench SSH public key is a Gaia local input (`--input`),
# not in the locked Gaia rev (10beed8). The base product is not added (no A733 base yet: the
# kernel is a patch series Gaia cannot apply, see the family). When Gaia's rev with the input
# is locked, move this to devices/products/, commit its gaia.lock, and check it plans.
version = 1
name = "cubie-a7-bringup"
description = "Radxa Cubie A7S bring-up (DEV ONLY): SD boot, Ethernet and usb0, SSH with the bench key. Candidate, never booted."

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.02.3"

[components]
cubie-a7s-extlinux = "components/cubie-a7s-extlinux/component.toml"
dev-bench-ssh-key = "components/dev-bench-ssh-key/component.toml"
dev-usb0-gadget = "components/dev-usb0-gadget/component.toml"

[[images]]
name = "cubie-a7-bringup"
board = "../../boards/radxa-cubie-a7s/board.toml"
components = ["cubie-a7s-extlinux", "dev-bench-ssh-key", "dev-usb0-gadget"]
os = { provider = "buildroot", source = "buildroot", fragments = ["os.fragment"] }
recipe = "sd-image"
budget = "1G"

[images.settings]
# Names the disk (required by sd-image).
id = "cubie-a7-bringup"
