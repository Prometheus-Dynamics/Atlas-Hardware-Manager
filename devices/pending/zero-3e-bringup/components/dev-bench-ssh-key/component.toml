# PENDING Gaia local input. DEV ONLY; used only by zero-3e-bringup (in pending).
# The bench SSH PUBLIC key is a BUILD INPUT: a named local file from outside the
# repository, hashed into the key (Gaia's local input, `--input name=path`, in a
# later rev; not in the locked one yet). Commit no key, and never a private key.
# Why it exists: dropbear refuses blank passwords, so a bring-up board needs a
# key to log in. Goes when Orion serves SSH on the board.
version = 1
name = "dev-bench-ssh-key"
description = "DEV ONLY: the bench SSH public key as root's authorized_keys (bring-up only)."

# The name below becomes the named local input (pending Gaia's rev).
[[install]]
from = { file = "authorized_keys" }
to = "/root/.ssh/authorized_keys"
mode = "0600"

# dropbear.service (installed by the dropbear package; Buildroot's preset is not
# relied on): enabled here so the bring-up board takes the key at boot.
[[services]]
unit = "dropbear.service"
enable = true
