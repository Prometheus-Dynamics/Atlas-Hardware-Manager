# DEV ONLY (bring-up): /boot/extlinux/extlinux.conf for the ZERO 3E bring-up product, with the usb0 gadget's
# fixed MAC addresses on the kernel command line. It replaces components/radxa-zero-3e-extlinux in this
# product only (both install the same path, so the bring-up product lists this one instead). Why a copy: Gaia's
# component form takes no per-product value, and the shared file is in the base product too.
version = 1
name = "dev-zero-3e-usb-extlinux"
description = "DEV ONLY: the ZERO 3E bring-up extlinux.conf, with fixed g_ether MAC addresses for usb0 (bring-up only)."

[[install]]
from = { file = "extlinux.conf" }
to = "/boot/extlinux/extlinux.conf"
mode = "0644"
