# Radxa ZERO 3E bring-up: zero-3e-base plus the DEV-ONLY pieces (the bench SSH
# public key and the usb0 gadget network). Those exist only until Orion serves
# SSH and Lemnos's USB driver owns the gadget.
#
# PENDING, and deliberately outside the device check: this file is under
# devices/pending/, which the check does not read, because the bench key is a
# Gaia local input that the locked rev does not have yet. When Gaia's rev with
# `--input name=path` is locked, move this back to devices/products/ and
# commit its lock. The base product must pass on its own without it.
version = 1
name = "zero-3e-bringup"
description = "Radxa ZERO 3E bring-up: the base OS plus dev-only SSH key and usb0 gadget network."

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.02.3"

[components]
dev-zero-3e-usb-extlinux = "components/dev-zero-3e-usb-extlinux/component.toml"
dev-bench-ssh-key = "components/dev-bench-ssh-key/component.toml"
dev-bringup-hostkey = "../../components/dev-bringup-hostkey/component.toml"
dev-usb0-gadget = "components/dev-usb0-gadget/component.toml"

[[images]]
name = "zero-3e-bringup"
board = "../../boards/radxa-zero-3e/board.toml"
components = ["dev-zero-3e-usb-extlinux", "dev-bench-ssh-key", "dev-bringup-hostkey", "dev-usb0-gadget"]
# The base OS fragment, then the bring-up's own (dropbear).
os = { provider = "buildroot", source = "buildroot", fragments = ["../../products/zero-3e-base/os.fragment", "os.fragment"] }
recipe = "sd-image"
budget = "1G"

[images.settings]
# Names the disk (required by sd-image; see zero-3e-base).
id = "zero-3e-bringup"
