name: CI

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The device package's shell scripts and pd-image-slots, under the runner's
  # POSIX sh (dash). 24.04 for erofs-utils >= 1.5, so update.sh also installs
  # an image with a real EROFS root slot.
  device:
    name: device package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends erofs-utils zstd xz-utils

      - name: Run the tests
        run: |
          sh devices/raze/tests/update.sh
          sh devices/raze/tests/root-device.sh
          sh devices/raze/tests/usb-boot.sh
          sh devices/raze/tests/selftest.sh
          sh devices/raze/tests/manifest-lint.sh

  workspace:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      # The Tauri shell embeds the built frontend, so it is built first.
      - name: Check and build the frontend
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run file-size lint
        run: ./scripts/check-file-sizes.sh

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # Phase 0 gate: the CLI lists devices and runs update jobs on every OS.
      - name: Smoke test the CLI against simulated devices
        run: |
          cargo run -q -p atlas-cli -- --sim demo ls
          cargo run -q -p atlas-cli -- --sim demo update --all \
            --release sim-helios=2026.3.1 --release sim-mcu=1.5.0
          if cargo run -q -p atlas-cli -- --sim flaky update --all --staged off \
            --release sim-helios=2026.3.1 --release sim-mcu=1.5.0; then
            echo "a rolled-back device must make the update exit non-zero" >&2
            exit 1
          fi

      - name: Smoke test host checks
        run: |
          cargo run -q -p atlas-cli -- disks
          cargo run -q -p atlas-cli -- doctor || true

  bundle:
    name: bundle (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: workspace
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build installers
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run bundle

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: atlas-${{ runner.os }}
          path: |
            target/*/release/bundle/**/*.deb
            target/*/release/bundle/**/*.rpm
            target/*/release/bundle/**/*.AppImage
            target/*/release/bundle/**/*.msi
            target/*/release/bundle/**/*.exe
            target/*/release/bundle/**/*.dmg
          if-no-files-found: error
