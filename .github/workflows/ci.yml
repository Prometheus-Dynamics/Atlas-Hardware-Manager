name: CI

on:
  push:
    tags: ["v*"]
    # `rebuild` is always pushed at the same commit as `dev`; testing it again
    # would run the whole matrix twice for nothing.
    branches-ignore: ["rebuild"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR supersedes a running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # What the change touches decides what runs:
  # - docs only (docs/, *.md): nothing;
  # - the device package (devices/) and docs only: the device tests, and the
  #   workspace checks on Linux (atlas-devices and atlas-driver-rpi read
  #   devices/ in their tests), not on macOS and Windows;
  # - anything else: everything.
  # Tags, manual runs and anything the diff can't be computed for run
  # everything.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      device: ${{ steps.classify.outputs.device }}
      workspace: ${{ steps.classify.outputs.workspace }}
      oses: ${{ steps.classify.outputs.oses }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        run: |
          all='["ubuntu-22.04","windows-latest","macos-latest"]'
          everything() {
            { echo "device=true"; echo "workspace=true"; echo "oses=$all"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT:$REF" in push:refs/tags/*|workflow_dispatch:*) everything ;; esac
          base=$BEFORE
          [ "$EVENT" = pull_request ] && base=$BASE
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] ||
            ! files=$(git diff --name-only "$base" HEAD 2>/dev/null); then
            everything
          fi
          echo "$files"
          device=false workspace=false cross=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              devices/*|scripts/ci.sh|.github/workflows/*) device=true ;;
            esac
            case "$f" in
              docs/*|*.md) ;;
              devices/*) workspace=true ;;
              *) workspace=true; cross=true ;;
            esac
          done <<EOF
          $files
          EOF
          oses='["ubuntu-22.04"]'
          [ "$cross" = true ] && oses=$all
          { echo "device=$device"; echo "workspace=$workspace"; echo "oses=$oses"; } >> "$GITHUB_OUTPUT"
          echo "device=$device workspace=$workspace oses=$oses"

  # The device package's shell scripts and board-image-slots, under the runner's
  # POSIX sh (dash). 24.04 for erofs-utils >= 1.5, so update.sh also installs
  # an image with a real EROFS root slot.
  device:
    name: device package tests
    needs: changes
    if: needs.changes.outputs.device == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends erofs-utils zstd xz-utils busybox

      # slot-init.sh builds slot-init (the slot initramfs's /init) for the host.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      # Every devices/raze/tests/*.sh, in parallel.
      - name: Run the tests
        run: sh devices/raze/tests/all.sh

  workspace:
    name: checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # A prebuilt binary, seconds to install.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Only dev saves the cache (the branch every push goes to); other
      # branches and PRs restore it.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # The Tauri shell embeds the built frontend, so it is built first.
      # svelte-check is the same on every OS: Linux runs it.
      - name: Check and build the frontend
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          if [ "$RUNNER_OS" = Linux ]; then bun run check; fi
          bun run build

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run file-size lint
        run: ./scripts/check-file-sizes.sh

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # nextest runs every binary's tests at once (cargo test runs the
      # binaries one after another); doc tests are cargo test's alone.
      - name: Run tests
        run: |
          cargo nextest run --workspace
          cargo test --workspace --doc

      # Phase 0 gate: the CLI lists devices and runs update jobs on every OS.
      - name: Smoke test the CLI against simulated devices
        run: |
          cargo run -q -p atlas-cli -- --sim demo ls
          cargo run -q -p atlas-cli -- --sim demo update --all \
            --release sim-helios=2026.3.1 --release sim-mcu=1.5.0
          if cargo run -q -p atlas-cli -- --sim flaky update --all --staged off \
            --release sim-helios=2026.3.1 --release sim-mcu=1.5.0; then
            echo "a rolled-back device must make the update exit non-zero" >&2
            exit 1
          fi

      - name: Smoke test host checks
        run: |
          cargo run -q -p atlas-cli -- disks
          cargo run -q -p atlas-cli -- doctor || true

  # A .deb quickly, on a manual run only (never per push): the release
  # profile without LTO (16 codegen units), built in the distro it installs
  # on (scripts/deb-fast.sh does the same locally), whatever the checks say.
  # Tagged releases still come from `bundle` (full LTO).
  dev-deb:
    name: dev .deb (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-trixie
            image: debian:trixie
          - name: ubuntu-22.04
            image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl unzip git \
            build-essential pkg-config file xz-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version counts commits (scripts/version.sh).
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: dev-deb-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Build the .deb
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/prepare-bundle.sh x86_64-unknown-linux-gnu
          cd apps/desktop
          bun install --frozen-lockfile
          export ATLAS_VERSION="$("$GITHUB_WORKSPACE/scripts/version.sh")"
          bun run tauri build --target x86_64-unknown-linux-gnu --bundles deb --config src-tauri/tauri.bundle.conf.json --config "{\"version\":\"$ATLAS_VERSION\"}"
          # As dpkg orders it, below the release (scripts/package-versions.sh).
          "$GITHUB_WORKSPACE/scripts/package-versions.sh" fix-debs \
            "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/bundle/deb" "$ATLAS_VERSION"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE"/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb \
            "$GITHUB_WORKSPACE/dist/atlas-${GITHUB_SHA::7}-${{ matrix.name }}.deb"

      - name: Upload the .deb
        uses: actions/upload-artifact@v7
        with:
          name: atlas-deb-${{ matrix.name }}
          path: dist/*.deb
          if-no-files-found: error

  bundle:
    name: bundle (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: workspace
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version counts commits (scripts/version.sh).
          fetch-depth: 0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build installers
        working-directory: apps/desktop
        run: |
          # A tag's build carries its version (the app compares it with
          # newer releases); a manual run is <release>-dev.<count>+<commit>.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export ATLAS_VERSION="${GITHUB_REF_NAME#v}"; fi
          bun install --frozen-lockfile
          bun run bundle

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: atlas-${{ runner.os }}
          path: |
            target/*/release/bundle/**/*.deb
            target/*/release/bundle/**/*.rpm
            target/*/release/bundle/**/*.AppImage
            target/*/release/bundle/**/*.msi
            target/*/release/bundle/**/*.exe
            target/*/release/bundle/**/*.dmg
          if-no-files-found: error

  # A tag's installers become its GitHub release, each with a signed
  # manifest (<installer>.manifest.json, atlas-release's sign-app-release
  # example) when the ATLAS_RELEASE_KEY secret is set: what Atlas checks
  # an update against before it installs it. A pre-release tag (v…-rc.1)
  # makes a pre-release.
  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Fetch installers
        uses: actions/download-artifact@v7
        with:
          pattern: atlas-*
          path: dist-raw

      - name: Collect installers
        run: |
          mkdir -p dist
          # The bundle tree nests them; only the installers go out.
          find dist-raw -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -l dist

      - name: Sign manifests
        env:
          ATLAS_RELEASE_KEY: ${{ secrets.ATLAS_RELEASE_KEY }}
        run: |
          if [[ -z "$ATLAS_RELEASE_KEY" ]]; then
            echo "::warning::ATLAS_RELEASE_KEY isn't set: the release has no signed manifests, so Atlas checks updates against GitHub's checksums only"
            exit 0
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          cargo run -q -p atlas-release --example sign-app-release -- sign "$GITHUB_REF_NAME" "$base" dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Atlas ${GITHUB_REF_NAME#v}" --generate-notes "${pre[@]}"
          fi
