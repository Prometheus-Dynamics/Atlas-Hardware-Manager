name: CI

on:
  push:
    tags: ["v*"]
    # `rebuild` is always pushed at the same commit as `dev`; testing it again
    # would run the whole matrix twice for nothing.
    branches-ignore: ["rebuild"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR supersedes a running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # What the change touches decides what runs:
  # - docs only (docs/, *.md): nothing;
  # - the device package (devices/) and docs only: the device tests, and the
  #   workspace checks on Linux (atlas-devices and atlas-driver-rpi read
  #   devices/ in their tests), not on macOS and Windows;
  # - anything else: everything.
  # Tags, manual runs and anything the diff can't be computed for run
  # everything.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      device: ${{ steps.classify.outputs.device }}
      workspace: ${{ steps.classify.outputs.workspace }}
      oses: ${{ steps.classify.outputs.oses }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        run: |
          all='["ubuntu-22.04","windows-latest","macos-latest"]'
          everything() {
            { echo "device=true"; echo "workspace=true"; echo "oses=$all"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT:$REF" in push:refs/tags/*|workflow_dispatch:*) everything ;; esac
          base=$BEFORE
          [ "$EVENT" = pull_request ] && base=$BASE
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] ||
            ! files=$(git diff --name-only "$base" HEAD 2>/dev/null); then
            everything
          fi
          echo "$files"
          device=false workspace=false cross=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              devices/*|scripts/ci.sh|.github/workflows/*) device=true ;;
            esac
            case "$f" in
              docs/*|*.md) ;;
              devices/*) workspace=true ;;
              *) workspace=true; cross=true ;;
            esac
          done <<EOF
          $files
          EOF
          oses='["ubuntu-22.04"]'
          [ "$cross" = true ] && oses=$all
          { echo "device=$device"; echo "workspace=$workspace"; echo "oses=$oses"; } >> "$GITHUB_OUTPUT"
          echo "device=$device workspace=$workspace oses=$oses"

  # The device package's shell scripts and board-image-slots, under the runner's
  # POSIX sh (dash). 24.04 for erofs-utils >= 1.5, so update.sh also installs
  # an image with a real EROFS root slot.
  device:
    name: device package tests
    needs: changes
    if: needs.changes.outputs.device == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends erofs-utils zstd xz-utils

      # Every devices/raze/tests/*.sh, in parallel.
      - name: Run the tests
        run: sh devices/raze/tests/all.sh

  workspace:
    name: checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Only dev saves the cache (the branch every push goes to); other
      # branches and PRs restore it.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # The Tauri shell embeds the built frontend, so it is built first.
      # svelte-check is the same on every OS: Linux runs it.
      - name: Check and build the frontend
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          if [ "$RUNNER_OS" = Linux ]; then bun run check; fi
          bun run build

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run file-size lint
        run: ./scripts/check-file-sizes.sh

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # Phase 0 gate: the CLI lists devices and runs update jobs on every OS.
      - name: Smoke test the CLI against simulated devices
        run: |
          cargo run -q -p atlas-cli -- --sim demo ls
          cargo run -q -p atlas-cli -- --sim demo update --all \
            --release sim-helios=2026.3.1 --release sim-mcu=1.5.0
          if cargo run -q -p atlas-cli -- --sim flaky update --all --staged off \
            --release sim-helios=2026.3.1 --release sim-mcu=1.5.0; then
            echo "a rolled-back device must make the update exit non-zero" >&2
            exit 1
          fi

      - name: Smoke test host checks
        run: |
          cargo run -q -p atlas-cli -- disks
          cargo run -q -p atlas-cli -- doctor || true

  bundle:
    name: bundle (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: workspace
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build installers
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run bundle

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: atlas-${{ runner.os }}
          path: |
            target/*/release/bundle/**/*.deb
            target/*/release/bundle/**/*.rpm
            target/*/release/bundle/**/*.AppImage
            target/*/release/bundle/**/*.msi
            target/*/release/bundle/**/*.exe
            target/*/release/bundle/**/*.dmg
          if-no-files-found: error
