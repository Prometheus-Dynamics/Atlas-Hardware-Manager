[workspace]
members = [
    "crates/atlas-driver",
    "crates/atlas-core",
    "crates/atlas-devices",
    "crates/atlas-driver-mock",
    "crates/atlas-driver-rpi",
    "crates/atlas-driver-pd",
    "crates/atlas-driver-orion",
    "crates/atlas-release",
    "crates/atlas-usbboot",
    "crates/atlas-blockdev",
    "crates/atlas-helper",
    "crates/atlas-cli",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
homepage = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
rust-version = "1.94"
authors = ["Prometheus Dynamics"]
publish = false

[workspace.dependencies]
atlas-driver = { path = "crates/atlas-driver" }
atlas-core = { path = "crates/atlas-core" }
atlas-devices = { path = "crates/atlas-devices" }
atlas-driver-mock = { path = "crates/atlas-driver-mock" }
atlas-driver-rpi = { path = "crates/atlas-driver-rpi" }
atlas-driver-pd = { path = "crates/atlas-driver-pd" }
atlas-driver-orion = { path = "crates/atlas-driver-orion" }
atlas-release = { path = "crates/atlas-release" }
atlas-usbboot = { path = "crates/atlas-usbboot" }
atlas-blockdev = { path = "crates/atlas-blockdev" }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
lzma-rs = "0.3"
mdns-sd = "0.21"
nusb = { version = "0.2.7", features = ["tokio"] }
# Orion (control protocol 4) and its remote operator client, pinned together.
orion-client = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "6776a0d97866deaaec1c846456749785f4933082", default-features = false, features = ["remote"] }
orion-control-plane = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "6776a0d97866deaaec1c846456749785f4933082", default-features = false, features = ["std"] }
orion-core = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "6776a0d97866deaaec1c846456749785f4933082", default-features = false, features = ["std"] }
nix = { version = "0.30", default-features = false }
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ruzstd = "0.9"
sha2 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1.52.1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

# Decompression and hashing run on multi-gigabyte images; keep them fast in
# dev builds and tests too.
[profile.dev.package.lzma-rs]
opt-level = 3
[profile.dev.package.ruzstd]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
