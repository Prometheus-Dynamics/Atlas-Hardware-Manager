[workspace]
members = [
    "crates/atlas-driver",
    "crates/atlas-core",
    "crates/atlas-devices",
    "crates/atlas-driver-mock",
    "crates/atlas-driver-rpi",
    "crates/atlas-driver-board",
    "crates/atlas-driver-orion",
    "crates/board-agent",
    "crates/atlas-image-server",
    "crates/atlas-release",
    "crates/atlas-usbboot",
    "crates/atlas-blockdev",
    "crates/atlas-helper",
    "crates/atlas-cli",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
homepage = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
rust-version = "1.99"
authors = ["Prometheus Dynamics"]
publish = false

[workspace.dependencies]
atlas-driver = { path = "crates/atlas-driver" }
atlas-core = { path = "crates/atlas-core" }
atlas-devices = { path = "crates/atlas-devices" }
atlas-driver-mock = { path = "crates/atlas-driver-mock" }
atlas-driver-rpi = { path = "crates/atlas-driver-rpi" }
atlas-driver-board = { path = "crates/atlas-driver-board" }
atlas-driver-orion = { path = "crates/atlas-driver-orion" }
atlas-image-server = { path = "crates/atlas-image-server" }
atlas-release = { path = "crates/atlas-release" }
atlas-usbboot = { path = "crates/atlas-usbboot" }
atlas-blockdev = { path = "crates/atlas-blockdev" }
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
ed25519-dalek = { version = "3", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
lzma-rs = "0.3"
mdns-sd = "0.21"
nusb = { version = "0.2.7", features = ["tokio"] }
# Orion (control protocol 4, layout of c22fa42) and its remote operator client, pinned together.
# Features per crate: the remote operator client (Atlas), IPC (board-agent).
orion-client = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "c22fa42a8dd4176805d292796e1580f5c865e23f", default-features = false }
orion-control-plane = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "c22fa42a8dd4176805d292796e1580f5c865e23f", default-features = false, features = ["std"] }
orion-core = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "c22fa42a8dd4176805d292796e1580f5c865e23f", default-features = false, features = ["std"] }
# Tests only: a real node in-process (board-agent).
orion-node = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "c22fa42a8dd4176805d292796e1580f5c865e23f", default-features = false }
nix = { version = "0.31", default-features = false }
plist = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ruzstd = "0.9"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

# Decompression and hashing run on multi-gigabyte images; keep them fast in
# dev builds and tests too.
[profile.dev.package.lzma-rs]
opt-level = 3
[profile.dev.package.ruzstd]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
