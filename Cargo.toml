[workspace]
# Every directory directly inside a crates/<folder>/ is a crate. Adding a crate
# never edits this file. The desktop app's Rust side is "apps/*/src-tauri" (F2).
members = ["crates/*/*", "apps/*/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2026.1.0-dev"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
homepage = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"

[workspace.dependencies]
# Locked by commit. Moving a lock is its own PR.
# Orion d361b592 (I140: shm-fdpass at Lemnos 98fbe0c2, a frame cut short is the peer closing; on ae6eb669), coordinator 2026-11-27, pin move 16; before: ae6eb669
orion = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "d361b592009dae9533dbfcdb7378d66588bb655a", default-features = false }
# Lemnos's slot-bundle format: the signing record, the signed message, the manifest's bytes and the bundle rules.
# Its rev is the image's Lemnos pin (devices/); scripts/check-devices.sh holds the two equal. Moving it is its own PR.
lemnos-slot-store = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "98fbe0c2fdf5ee79db03e7ae25155ace4f82a79e", default-features = false }
# The contract crates Atlas reads a method's tag and names from (the same rev, no new rev): `lemnos-core` is their trait.
lemnos-core = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "98fbe0c2fdf5ee79db03e7ae25155ace4f82a79e", default-features = false }
lemnos-contract-system-slots = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "98fbe0c2fdf5ee79db03e7ae25155ace4f82a79e", default-features = false }
lemnos-contract-system-reboot = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "98fbe0c2fdf5ee79db03e7ae25155ace4f82a79e", default-features = false }
lemnos-contract-system-flash = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "98fbe0c2fdf5ee79db03e7ae25155ace4f82a79e", default-features = false }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

# Dev and test builds keep file and line tables only (backtraces still name file and line), not full debug info. Measured
# interleaved on the gate PC, 2026-11-18: cold build 143/100 s -> 70/73 s, target dir 6.0 -> 3.0 GB, test runs unchanged.
# For a debugger session with local variables, build with CARGO_PROFILE_DEV_DEBUG=true. Debug assertions and overflow
# checks are unchanged. Workspace opt-level 1 was measured too and gave nothing (the slow tests' work is in dependencies).
[profile.dev]
debug = "line-tables-only"

# The tests hash and decompress hundreds of MiB (bounded-memory and verity checks); unoptimized, sha2 and liblzma set
# the test step's length. Only these two dependencies are optimized, in the dev profile only: Atlas's own code builds
# as before, and debug assertions and overflow checks stay on everywhere.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.lzma-sys]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The Atlas release being worked toward. A build from a checkout reports
# <release>-dev.<commit count>+<commit> (scripts/version-rule.sh atlas_version, the rule of dev's
# scripts/version.sh); a tagged release sets ATLAS_VERSION. Read by the version rule only.
[workspace.metadata.atlas]
release = "2026.1.0"
