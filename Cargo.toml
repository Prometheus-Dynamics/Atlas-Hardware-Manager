[workspace]
# Every directory directly inside a crates/<folder>/ is a crate. Adding a crate
# never edits this file. The desktop app's Rust side ("apps/*/src-tauri") joins
# with F2: cargo refuses a member glob that matches nothing, so it can't be
# listed before the app exists.
members = ["crates/*/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2026.1.0-dev"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
homepage = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"

[workspace.dependencies]
# Locked by commit. Moving a lock is its own PR.
orion = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "c9eb5a25ebeff940786901995ad4d9abc91795bc", default-features = false }
# Lemnos's slot-bundle format: the signing record, the signed message, the manifest's bytes and the bundle rules.
# Its rev is the image's Lemnos pin (devices/); scripts/check-devices.sh holds the two equal. Moving it is its own PR.
lemnos-slot-store = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "fe8beb7cc966392b22be138a5e51d742331ac2ad", default-features = false }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The Atlas release being worked toward. A build from a checkout reports
# <release>-dev.<commit count>+<commit> (scripts/version-rule.sh atlas_version, the rule of dev's
# scripts/version.sh); a tagged release sets ATLAS_VERSION. Read by the version rule only.
[workspace.metadata.atlas]
release = "2026.1.0"
