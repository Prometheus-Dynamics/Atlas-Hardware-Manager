[workspace]
members = [
    "crates/atlas-driver",
    "crates/atlas-core",
    "crates/atlas-driver-mock",
    "crates/atlas-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
homepage = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
rust-version = "1.94"
authors = ["Prometheus Dynamics"]
publish = false

[workspace.dependencies]
atlas-driver = { path = "crates/atlas-driver" }
atlas-core = { path = "crates/atlas-core" }
atlas-driver-mock = { path = "crates/atlas-driver-mock" }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
futures = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
