[workspace]
# Every directory directly inside a crates/<folder>/ is a crate. Adding a crate
# never edits this file. The desktop app's Rust side ("apps/*/src-tauri") joins
# with F2: cargo refuses a member glob that matches nothing, so it can't be
# listed before the app exists.
members = ["crates/*/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2026.1.0-dev"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
homepage = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"

[workspace.dependencies]
# Locked by commit. Moving a lock is its own PR.
orion = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "c0187f4c195cd27f8353c055dd0a94247c2965cc", default-features = false }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
