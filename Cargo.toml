[workspace]
members = [
    "crates/atlas-driver",
    "crates/atlas-core",
    "crates/atlas-devices",
    "crates/atlas-driver-mock",
    "crates/atlas-driver-rpi",
    "crates/atlas-driver-board",
    "crates/atlas-driver-orion",
    "crates/atlas-driver-robot",
    "crates/board-agent",
    "crates/board-stream",
    "crates/slot-init",
    "crates/atlas-image-server",
    "crates/atlas-release",
    "crates/atlas-usbboot",
    "crates/atlas-flasher-proto",
    "crates/atlas-flasher",
    "crates/flasher",
    "crates/atlas-blockdev",
    "crates/atlas-helper",
    "crates/atlas-cli",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
homepage = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
rust-version = "1.99"
authors = ["Prometheus Dynamics"]
publish = false

[workspace.dependencies]
atlas-driver = { path = "crates/atlas-driver" }
atlas-core = { path = "crates/atlas-core" }
atlas-devices = { path = "crates/atlas-devices" }
atlas-driver-mock = { path = "crates/atlas-driver-mock" }
atlas-driver-rpi = { path = "crates/atlas-driver-rpi" }
atlas-driver-board = { path = "crates/atlas-driver-board" }
atlas-driver-orion = { path = "crates/atlas-driver-orion" }
atlas-driver-robot = { path = "crates/atlas-driver-robot" }
atlas-image-server = { path = "crates/atlas-image-server" }
atlas-release = { path = "crates/atlas-release" }
atlas-usbboot = { path = "crates/atlas-usbboot" }
atlas-flasher-proto = { path = "crates/atlas-flasher-proto" }
atlas-flasher = { path = "crates/atlas-flasher" }
atlas-blockdev = { path = "crates/atlas-blockdev" }
atlas-cli = { path = "crates/atlas-cli" }
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
ed25519-dalek = { version = "3", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
lzma-rs = "0.3"
mdns-sd = "0.21"
nusb = { version = "0.2.7", features = ["tokio"] }
# Orion (control protocol 5, layout of f8d767a) and its remote operator client, pinned together.
# Features per crate: the remote operator client (Atlas), IPC (board-agent).
orion-client = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "f8d767ac5f7a995fbdc205d727f58dcf719c25dc", default-features = false }
orion-control-plane = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "f8d767ac5f7a995fbdc205d727f58dcf719c25dc", default-features = false, features = ["std"] }
orion-core = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "f8d767ac5f7a995fbdc205d727f58dcf719c25dc", default-features = false, features = ["std"] }
# lemnosd's client (board-stream's live readings), at the commit the Raze
# package pins (devices/raze/manifest.json, capabilities.hardware-service).
lemnos-ipc = { git = "https://github.com/Prometheus-Dynamics/Lemnos", rev = "fc879eb17f48fec5e0cec88c2adf5edeb918abe6" }
# NetworkTables 4 client and server (the desktop app's NetworkTables page);
# independent of orion-node.
orion-nt4 = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "f8d767ac5f7a995fbdc205d727f58dcf719c25dc" }
# Tests only: a real node in-process (board-agent).
orion-node = { git = "https://github.com/Prometheus-Dynamics/Orion", rev = "f8d767ac5f7a995fbdc205d727f58dcf719c25dc", default-features = false }
nix = { version = "0.31", default-features = false }
# PhotonVision's UI socket (the device page's vision panel): the versions orion-nt4 uses.
rmpv = "1.3.1"
libc = "0.2.190"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
plist = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ruzstd = "0.9"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

# Dev builds and tests: line tables for our own crates (file and line in
# backtraces and panics, enough for tests) and no debug info for
# dependencies. Full debug info made target/ several GB larger and every
# link slower; set CARGO_PROFILE_DEV_DEBUG=true for a debugger session.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Decompression and hashing run on multi-gigabyte images; keep them fast in
# dev builds and tests too.
[profile.dev.package.lzma-rs]
opt-level = 3
[profile.dev.package.ruzstd]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# Desktop release (atlas-app, which carries the CLI, and the atlas-helper
# sidecar the installers ship): stripped, full LTO, one codegen unit. About
# half the size of the plain release build for about twice its clean build
# time (fat LTO's single-threaded link); thin LTO saved nothing over strip.
# Panic locations (file:line) are string constants, so they survive the
# strip and still reach the app log. opt-level stays 3: "s" on atlas-helper
# made it bigger under LTO. [profile.device] inherits this, so it pins its
# own (no LTO) values. Fix builds and dev .debs (scripts/deb-fast.sh, CI's
# dev .deb job) turn LTO off and use 16 codegen units through
# CARGO_PROFILE_RELEASE_*, for a build in seconds once warm.
[profile.release]
strip = "symbols"
lto = true
codegen-units = 1

# Binaries built for the boards (board-agent, by the device package's Gaia
# layer): release, stripped. No LTO, to keep image builds quick.
[profile.device]
inherits = "release"
strip = "symbols"
lto = false
codegen-units = 16

# slot-init, which every slot's initramfs carries: built for size (567 KB
# -> 422 KB for aarch64 musl). It's small, so LTO costs the build little.
[profile.device-small]
inherits = "device"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# board-agent and board-stream (the device package's Gaia recipes): size with
# speed kept (opt-level 3). Full LTO and one codegen unit cut the stripped
# binaries by about a third at the same build time; see the CHANGELOG entry.
[profile.device-lean]
inherits = "device"
lto = true
codegen-units = 1
