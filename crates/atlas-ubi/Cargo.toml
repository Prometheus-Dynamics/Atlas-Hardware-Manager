[package]
name = "atlas-ubi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "UBI on raw NAND for Atlas: reads the images Gaia writes (G8), writes them to a flash as ubiformat does, and updates a board's A/B slot volumes."

[lib]
path = "src/lib.rs"

[[bin]]
name = "atlas-ubi"
path = "src/main.rs"

[dependencies]
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

# The workspace's lints, except unsafe code is denied rather than forbidden:
# raw flash and slot updates are kernel ioctls, and only the sys module
# allows unsafe, each call with its SAFETY note.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
