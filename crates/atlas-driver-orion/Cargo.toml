[package]
name = "atlas-driver-orion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Orion as a capability source for Atlas: live readings, actions, and A/B updates for boards other drivers find."

[dependencies]
serde_json.workspace = true
async-trait.workspace = true
atlas-driver.workspace = true
futures.workspace = true
orion-client = { workspace = true, features = ["remote"] }
orion-control-plane.workspace = true
orion-core.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["time", "sync", "net", "io-util", "rt", "rt-multi-thread"] }

[dev-dependencies]
atlas-image-server.workspace = true
reqwest.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }

# tests/live_stream.rs and status_push.rs: a real node with its orion+tcp
# listener, and a publisher on its IPC. Unix only: Orion's IPC (and so the
# node) doesn't build on Windows, and these tests are #![cfg(unix)].
[target.'cfg(unix)'.dev-dependencies]
orion-node = { workspace = true, features = ["peer-tcp"] }
orion-client = { workspace = true, features = ["remote", "ipc"] }

[lints]
workspace = true
