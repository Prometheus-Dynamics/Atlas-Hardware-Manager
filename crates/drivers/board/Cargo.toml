[package]
name = "atlas-board"
description = "The one board driver: finds Orion nodes on a link and identifies them from their hello document and Lemnos's state."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
atlas-driver = { path = "../../core/driver" }
atlas-session = { path = "../../board/session" }
atlas-types = { path = "../../core/types" }
async-trait = "0.1"
orion = { workspace = true, features = ["actions"] }
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
atlas-sim-node = { path = "../../testing/sim-node" }
orion = { workspace = true, features = ["topics", "actions"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
serde_json = "1"

[lints]
workspace = true
