[package]
name = "atlas-allwinner"
description = "The Allwinner FEL driver: finds Allwinner devices in their USB boot ROM, says what each one is, and grants Flash there."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
atlas-driver = { path = "../../core/driver" }
atlas-fel = { path = "../../flash/fel" }
atlas-types = { path = "../../core/types" }
atlas-usb = { path = "../../flash/usb" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
