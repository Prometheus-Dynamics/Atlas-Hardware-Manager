[package]
name = "atlas-driver-rockchip"
description = "The Rockchip boot-ROM driver: finds the devices in a maskrom or loader mode on USB, names them, and grants Flash in the boot-ROM state."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
atlas-driver = { path = "../../core/driver" }
atlas-rockchip = { path = "../../flash/rockchip" }
atlas-types = { path = "../../core/types" }
atlas-usb = { path = "../../flash/usb" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
