[package]
name = "atlas-rpi"
description = "The Raspberry Pi boot ROM driver: finds the boards in a USB boot ROM, says what each is, grants Flash in the boot ROM state, and boots them into the flasher image."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
atlas-driver = { path = "../../core/driver" }
atlas-rpiboot = { path = "../../flash/rpiboot" }
atlas-types = { path = "../../core/types" }
atlas-usb = { path = "../../flash/usb" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
