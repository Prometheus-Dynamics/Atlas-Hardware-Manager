[package]
name = "atlas-release"
description = "The release catalog: local images, signed manifests, verified downloads, and the trusted key list with owners."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
atlas-types = { path = "../types" }
base64 = "0.22"
blake2 = "0.10"
ed25519-dalek = { version = "3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
