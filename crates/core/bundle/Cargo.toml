[package]
name = "atlas-bundle"
description = "Slot bundles: a first-flash image's slot made into the tar a board's slot writer takes, signed with ed25519, and checked back."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
atlas-image = { path = "../../flash/image" }
atlas-release = { path = "../release" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
