[package]
name = "atlas-bundle"
description = "Slot bundles: a first-flash image's slot made into the tar a board's slot writer takes, signed with ed25519, and checked back."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
atlas-release = { path = "../release" }
ed25519-dalek = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
thiserror = "2"

[lints]
workspace = true
