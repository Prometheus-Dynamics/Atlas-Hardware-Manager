[package]
name = "atlas-image"
description = "Reads one slot out of a first-flash .img.xz (or a plain .img): a streamed xz decode, the partition table, the boot files and the slot file, read back from a bounded scratch spool. No Atlas types."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ext4-view = { version = "=1.0.0", default-features = false, features = ["std"] }
fatfs = { version = "=0.3.6", default-features = false, features = ["std", "alloc"] }
lzma-rs = "=0.3.0"
thiserror = "2"

[dev-dependencies]
atlas-bundle = { path = "../../core/bundle" }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }

[lints]
workspace = true
