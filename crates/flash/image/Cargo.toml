[package]
name = "atlas-image"
description = "Reads a slot out of a first-flash .img.xz (or a plain .img): a streamed xz decode, the data partition spooled to a scratch file, the slot's file, manifest and boot files checked by digest. No Atlas types."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ext4-view = { version = "=1.0.0", default-features = false, features = ["std"] }
atlas-xzdec = { path = "../xzdec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = "2"
atlas-bundle = { path = "../../core/bundle" }

[lints]
workspace = true
