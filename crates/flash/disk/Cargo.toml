[package]
name = "atlas-disk"
description = "Disks and cards: discovery, the safety rules for writing one, and verified, resumable image writes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lzma-rs = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "mount"] }

[lints]
workspace = true
