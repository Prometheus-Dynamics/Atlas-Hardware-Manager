[package]
name = "atlas-sim-node"
description = "The simulated Orion node: what a board publishes (hello facts, actions, topics, files), its slot and reboot surface, scripted failures and link faults. For tests of drivers and the app; not a driver."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The test image (src/image.rs) is made with the real bundle writer and read back with the real image reader.
atlas-bundle = { path = "../../core/bundle" }
atlas-image = { path = "../../flash/image" }
# The one socket-path check (atlas-types::socket): a node directory is made by it, never a long one.
atlas-types = { path = "../../core/types" }
ed25519-dalek = "2"
# The signing record and message of a slot bundle, read and written by Lemnos's own code at the pin.
lemnos-slot-store = { workspace = true }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
orion = { workspace = true, features = ["topics", "records", "actions", "files", "provider"] }
# The comm core for tests: the real server, broker, hello and keys on a real socket, with
# small stand-ins for node logic. Same commit as the locked `orion` crate.
orion-stubs = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "d361b592009dae9533dbfcdb7378d66588bb655a" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
