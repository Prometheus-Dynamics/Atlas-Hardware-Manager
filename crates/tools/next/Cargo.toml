[package]
name = "atlas-next"
description = "The milestone's slot test tool: list, install, trial, confirm and remove a board's slots from the computer, through its Orion address, with the pin rule. A test tool for the first next image, not the product CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "atlas-next"
path = "src/main.rs"

[dependencies]
atlas-board-slots = { path = "../../drivers/board-slots" }
atlas-bundle = { path = "../../core/bundle" }
atlas-jobs = { path = "../../core/jobs" }
atlas-session = { path = "../../board/session" }
atlas-slots = { path = "../../core/slots" }
atlas-trial = { path = "../../core/trial" }
atlas-types = { path = "../../core/types" }
orion = { workspace = true }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "signal"] }

[dev-dependencies]
atlas-release = { path = "../../core/release" }
atlas-sim-node = { path = "../../testing/sim-node" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
