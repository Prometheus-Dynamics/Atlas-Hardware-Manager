[package]
name = "atlas-next"
description = "The milestone's slot test tool: list, install, trial, confirm and remove a board's slots from the computer, through its Orion address, with the pin rule. A test tool for the first next image, not the product CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "atlas-next"
path = "src/main.rs"

[dependencies]
atlas-actions = { path = "../../board/actions" }
atlas-board-slots = { path = "../../drivers/board-slots" }
atlas-bundle = { path = "../../core/bundle" }
# usb-boot reads the slot and the boot partition out of the product's OS image.
atlas-image = { path = "../../flash/image" }
atlas-files = { path = "../../board/files" }
lemnos-slot-store = { workspace = true }
atlas-release = { path = "../../core/release" }
atlas-jobs = { path = "../../core/jobs" }
atlas-session = { path = "../../board/session" }
atlas-slots = { path = "../../core/slots" }
atlas-trial = { path = "../../core/trial" }
atlas-types = { path = "../../core/types" }
fatfs = "0.3"
orion = { workspace = true, features = ["topics", "provider"] }
orion-msg-topics = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "ae6eb669fb55258a37e23f6ddfe6a0df7fd0a978" }
orion-wire = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "ae6eb669fb55258a37e23f6ddfe6a0df7fd0a978" }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "signal"] }

[dev-dependencies]
atlas-actions = { path = "../../board/actions" }
atlas-release = { path = "../../core/release" }
atlas-sim-node = { path = "../../testing/sim-node" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
