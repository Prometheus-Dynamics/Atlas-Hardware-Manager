[package]
name = "atlas-nt"
description = "NetworkTables for Atlas: a viewer of an NT4 server's topics that edits what the server accepts, and the plain editable NT4 server Atlas runs itself. Both on Orion's NT4 crate."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Orion's NT4 crate, at the rev the root Cargo.toml locks (the same repository and rev as `orion`).
orion-nt4 = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "671d29d626f49e06ab7332417275ef1b0ac31b01", default-features = false, features = ["client", "server"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync"] }

[dev-dependencies]
# The socket-path check and the node directory (atlas-types::socket).
atlas-types = { path = "../../core/types" }
# The restart port: picked outside the OS ephemeral range and reserved across test processes (atlas-sim-node::ports).
atlas-sim-node = { path = "../../testing/sim-node" }
# The real comm core, in process, with its NT4 gateway (as Orion's own gateway test runs it).
orion = { workspace = true, features = ["topics"] }
orion-comm-app = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "671d29d626f49e06ab7332417275ef1b0ac31b01", default-features = false, features = ["nt4"] }
orion-config = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "671d29d626f49e06ab7332417275ef1b0ac31b01" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net"] }

[lints]
workspace = true
