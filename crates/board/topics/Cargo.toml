[package]
name = "atlas-topics"
description = "A node's hardware description, readings and logs, read over its session as Orion resources and topics. Shows what the node describes: nothing per kind of device, and a gap in the description reads as not reported."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
atlas-board = { path = "../../drivers/board" }
atlas-session = { path = "../session" }
atlas-types = { path = "../../core/types" }
orion = { workspace = true, features = ["topics", "provider"] }
# The same rev as the locked `orion` crate: the declaration of a topic is decoded with them, as
# Orion's own tools do.
orion-msg-topics = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "fd61df3ed167bd9643e162a9953b8d260c048af5" }
orion-wire = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "fd61df3ed167bd9643e162a9953b8d260c048af5" }
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
atlas-sim-node = { path = "../../testing/sim-node" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
