[package]
name = "atlas-files"
description = "Sending a file to an Orion node: resumable through a lost session, streamed, checked end to end, with progress as a job. Built on atlas-session; works on any Orion node."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
atlas-driver = { path = "../../core/driver" }
atlas-jobs = { path = "../../core/jobs" }
atlas-session = { path = "../session" }
orion = { workspace = true, features = ["files"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
atlas-sim-node = { path = "../../testing/sim-node" }
# The per-call test runs an action on the test board while a push is held.
orion = { workspace = true, features = ["actions", "files"] }
orion-test-board = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "b01a7fb2fc76436b551b8f61ac8ebe3d332164ab" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
