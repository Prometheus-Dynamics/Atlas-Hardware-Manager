[package]
name = "atlas-driver-robot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Atlas drivers for the FRC robot network's own devices: the robot controller (roboRIO) and the radio (VH-109), read-only and without credentials."

[dependencies]
async-trait.workspace = true
atlas-driver.workspace = true
futures.workspace = true
# This computer's networks: the robot networks it is on directly.
if-addrs = "0.15"
nusb.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt", "sync", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
