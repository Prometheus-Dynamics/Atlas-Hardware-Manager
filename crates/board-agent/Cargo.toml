[package]
name = "board-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "The device agent of the board device packages: claims update, update.cancel, update.rollback, reboot and locate on orion-node's local IPC and runs them with the package's writer (/usr/lib/board/update)."

[[bin]]
name = "board-agent"
path = "src/main.rs"

# Linux only: it runs on the board, and Orion's IPC client doesn't build on
# Windows. Elsewhere the crate is empty (and the binary only says so), so the
# workspace still builds and other OSes don't compile its Orion stack.
[target.'cfg(target_os = "linux")'.dependencies]
# IPC only (no remote operator client): this runs on the board.
orion-client = { workspace = true, features = ["ipc"] }
orion-control-plane.workspace = true
orion-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "process", "time", "sync", "fs", "io-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A real orion-node in-process, for tests/orion_node.rs (same commit as the client crates).
orion-node.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
