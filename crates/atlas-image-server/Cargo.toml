[package]
name = "atlas-image-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Serves registered update images over HTTP for devices to pull (Orion updates)."

[dependencies]
atlas-driver.workspace = true
atlas-driver-orion.workspace = true
bytes = "1"
futures-core = "0.3"
getrandom = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
if-addrs = "0.15"
percent-encoding = "2"
serde.workspace = true
tokio = { workspace = true, features = ["rt", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }

[dev-dependencies]
reqwest.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
