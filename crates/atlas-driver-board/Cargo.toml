[package]
name = "atlas-driver-board"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Atlas driver for running boards that follow device contract v1 (mDNS + identity endpoint)."

[dependencies]
async-trait.workspace = true
atlas-devices.workspace = true
atlas-driver.workspace = true
# This computer's networks, for the sweep (sweep.rs), on every OS.
if-addrs = "0.15"
mdns-sd.workspace = true
nusb.workspace = true
reqwest.workspace = true
futures.workspace = true
rmpv.workspace = true
tokio-tungstenite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs", "time", "macros", "rt", "sync"] }

[target.'cfg(unix)'.dependencies]
# The USB console (console.rs): raw tty and flock.
nix = { workspace = true, features = ["term", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
