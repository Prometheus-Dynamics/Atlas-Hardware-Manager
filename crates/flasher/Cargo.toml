[package]
name = "flasher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "The raze-flasher daemon (docs/flasher.md): runs on a USB-booted Raze, takes an image from Atlas over a FunctionFS bulk interface, writes and verifies it on the eMMC, and reboots."

# Gaia builds it for the board as a static aarch64 musl binary
# (devices/raze/gaia/flasher.toml), installed in the flasher's initramfs.
[[bin]]
name = "atlas-flasher"
path = "src/main.rs"

[dependencies]
atlas-flasher-proto.workspace = true
lzma-rs.workspace = true
ruzstd.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["fs", "reboot"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
