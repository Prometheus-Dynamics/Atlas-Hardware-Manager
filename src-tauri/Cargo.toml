[package]
name = "atlas-hardware-manager"
version = "2026.0.0"
description = "Instrument-grade desktop control surface for Atlas CAN hardware"
authors = ["Sozo Systems <engineering@sozo.dev>"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
repository = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager"
keywords = ["tauri", "atlas", "hardware", "can"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atlas_hardware_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
tungstenite = "0.24"
rmp-serde = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusb = { version = "0.9", features = ["vendored"] }
sysinfo = "0.33"
xz2 = "0.1"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
thiserror = "2"
