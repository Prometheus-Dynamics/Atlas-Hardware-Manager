[package]
name = "atlas-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Atlas desktop app: a Tauri shell over atlas-core."

[lib]
name = "atlas_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atlas-core.workspace = true
atlas-driver.workspace = true
atlas-driver-mock.workspace = true
atlas-devices.workspace = true
atlas-driver-orion.workspace = true
atlas-image-server.workspace = true
atlas-driver-board.workspace = true
atlas-driver-rpi.workspace = true
atlas-release.workspace = true
orion-nt4.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
atlas-usbboot.workspace = true

[lints]
workspace = true
