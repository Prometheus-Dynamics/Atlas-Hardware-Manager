name: atlas-cross-build

x-cross-common: &cross-common
  build:
    context: .
    dockerfile: docker/cross/Dockerfile
  working_dir: /workspace
  volumes:
    - .:/workspace
    - cross-cargo-registry:/usr/local/cargo/registry
    - cross-cargo-git:/usr/local/cargo/git
    - cross-target-cache:/workspace/target
  environment:
    HOST_UID: "${LOCAL_UID:-1000}"
    HOST_GID: "${LOCAL_GID:-1000}"

services:
  cross-linux-x64:
    <<: *cross-common
    command: ["./scripts/docker-cross-build.sh", "x86_64-unknown-linux-gnu"]

  cross-linux-arm64:
    <<: *cross-common
    command: ["./scripts/docker-cross-build.sh", "aarch64-unknown-linux-gnu"]

  cross-windows-x64:
    <<: *cross-common
    command: ["./scripts/docker-cross-build.sh", "x86_64-pc-windows-gnu"]

  cross-windows-arm64:
    <<: *cross-common
    command: ["./scripts/docker-cross-build.sh", "aarch64-pc-windows-gnullvm"]

volumes:
  cross-cargo-registry:
  cross-cargo-git:
  cross-target-cache:
